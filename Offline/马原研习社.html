text":"尊重事物的客观规律是正确发挥主观能动性的前提"}],"answer":["D"],"analysis":"“天帮忙很重要，但人努力才是根本”说明，风、气温等自然条件固然影响治霾效果，但治霾成效最终取决于人的努力。这启示我们：尊重客观规律是正确发挥主观能动性的前提和基础，只有在认识和尊重客观规律的基础上，才能正确发挥主观能动性，有效地改造世界。A项强调尚未认识的规律的作用，方向不对；B项颠倒了关系，掌握客观规律才是发挥主观能动性的前提；C项错误，实践而不是认识活动才是客观规律性与主观能动性相统一的基础。故选 D。","tags":["一、马克思主义哲学","客观规律性和主观能动性"],"part":"一、马克思主义哲学","section":"客观规律性和主观能动性","subsection":"","origin":"考研真题 · 2017年第1题"},{"id":"ky-038","bank":"kaoyan","bankName":"考研政治真题精选","num":38,"type":"single","stem":"“只有音乐才能激起人的音乐感，对于没有音乐感的耳朵来说，再好的音乐也无济于事”，这说明（）","options":[{"key":"A","text":"人的认识是主体与客体相互作用的结果与过程"},{"key":"B","text":"人的感觉能力决定认识的产生和发展"},{"key":"C","text":"人的认识能力是因人的生理结构决定的"},{"key":"D","text":"事物因人的感觉而存在"}],"answer":["A"],"analysis":"“只有音乐才能激起人的音乐感”说明认识需要以相应的客体对象为前提；“对于没有音乐感的耳朵来说，再好的音乐也无济于事”说明认识还取决于主体的素质和能力。二者结合表明，人的认识是主体与客体相互作用的结果与过程。B项人的感觉能力决定认识的产生和发展、C项认识能力由生理结构决定，都夸大了主体生理条件的作用；D项“事物因人的感觉而存在”是主观唯心主义。故选 A。","tags":["一、马克思主义哲学","认识和实践","认识的基础"],"part":"一、马克思主义哲学","section":"认识和实践","subsection":"认识的基础","origin":"考研真题 · 2006年第2题"},{"id":"ky-039","bank":"kaoyan","bankName":"考研政治真题精选","num":39,"type":"multi","stem":"1971年，迪士尼乐园的路径设计获得“世界最佳设计奖”，设计者说，“其实那不是我设计的”。原因是在迪士尼乐园主体工程完工后，格罗佩斯暂停修筑乐园里的道路，并在空地上撒下草种，5个月后，乐园里绿草茵茵，草地上被游客踏出了不少宽窄不一的小路，格罗佩斯根据这些行人踏出来的小路，建设了人行道，成了优雅自然，简捷便利，个性突出的优秀设计，格罗佩斯的设计对我们认识和实践活动的启示是（）","options":[{"key":"A","text":"要从实践中获得灵感"},{"key":"B","text":"要尊重实践的要求"},{"key":"C","text":"不要对自然事物做任何改变"},{"key":"D","text":"要求对事物本来的面目做直接反映"}],"answer":["A","B"],"analysis":"格罗佩斯先撒草种，再根据游人踏出的小路铺设人行道，设计因此获得“世界最佳设计奖”。这告诉我们：认识要从实践中获得灵感（A），设计方案要尊重实践的要求、符合实际需要（B）。C项错误，人能够认识和改造自然，“不要对自然事物做任何改变”否认了主观能动性；D项错误，认识是对客观事物的能动反映，而不是对事物本来面目做直接、消极的反映。故选 AB。","tags":["一、马克思主义哲学","认识和实践","认识的基础"],"part":"一、马克思主义哲学","section":"认识和实践","subsection":"认识的基础","origin":"考研真题 · 2011年多选第17题"},{"id":"ky-040","bank":"kaoyan","bankName":"考研政治真题精选","num":40,"type":"single","stem":"中国工程院院士袁隆平曾结合自己的科研经历，语重心长地对年轻人说：“书本知识非常重要，电脑技术也很重要，但是书本电脑里种不出水稻来，只有在田里才能种出水稻来。”这表明（）","options":[{"key":"A","text":"实践水平的提高有赖于认识水平的提高"},{"key":"B","text":"实践是人类认识的基础和来源"},{"key":"C","text":"理论对实践的指导作用没有正确与错误之分"},{"key":"D","text":"由实践到认识的第一次飞跃比认识到实践的第二次飞跃更加重要"}],"answer":["B"],"analysis":"袁隆平的话强调，书本知识和电脑技术属于间接经验，归根到底来源于实践，而“只有在田里才能种出水稻来”表明实践是认识的基础和来源。A项颠倒了实践与认识的关系，是认识决定实践；C项错误，理论有正确与错误之分，错误的理论会把实践引向失败；D项错误，在认识过程的两次飞跃中，第二次飞跃（理性认识回到实践）比第一次飞跃更重要。故选 B。\n\n> **说明：** 原文档此处标注的答案为 D，经与真题核对，正确答案应为 B。\n\n\n\n### 认识的本质","tags":["一、马克思主义哲学","认识和实践","认识的基础"],"part":"一、马克思主义哲学","section":"认识和实践","subsection":"认识的基础","origin":"考研真题 · 2015年第1题"},{"id":"ky-041","bank":"kaoyan","bankName":"考研政治真题精选","num":41,"type":"single","stem":"辩证唯物主义认为，认识的本质是（）","options":[{"key":"A","text":"主体对各种认识要素的建构"},{"key":"B","text":"主体通过实践对客体的能动反映"},{"key":"C","text":"主体对客体本质的内省"},{"key":"D","text":"主体对客体信息的选择"}],"answer":["B"],"analysis":"辩证唯物主义认为，认识的本质是主体在实践基础上对客体的能动反映。这一界定包含两层含义：一是坚持反映论，承认认识是对客观事物的反映；二是坚持能动论，承认反映是主体能动地选择、加工、改造信息的过程。A项“建构”、D项“选择”只讲主体对信息的选择加工而否认反映论基础，属于唯心主义认识论倾向；C项“内省”是唯心主义的直觉论。故选 B。\n\n\n\n### 认识的规律","tags":["一、马克思主义哲学","认识和实践","认识的基础"],"part":"一、马克思主义哲学","section":"认识和实践","subsection":"认识的基础","origin":"考研真题 · 1992年文科第10题"},{"id":"ky-042","bank":"kaoyan","bankName":"考研政治真题精选","num":42,"type":"single","stem":"人的视觉感官有感觉外界物体的光和颜色的功能。可见光的波长范围一般是380nm（纳米）～780nm，称为可见光谱。在可见光谱范围内，不同波长的辐射使人感觉到不同的颜色，一般来说，700nm为红色，580nm为黄红，510nm为绿色，470nm为蓝色，400nm为紫色。这种现象表明（）","options":[{"key":"A","text":"人只能认识外界物体作用于感官形成的感觉"},{"key":"B","text":"人的感觉所具有的生理阈限是人的认识能力的界限"},{"key":"C","text":"人的感觉中包含着对外界事物信息的选择、加工和转换"},{"key":"D","text":"人所形成的关于事物的感觉是人自身生理活动的结果"}],"answer":["C"],"analysis":"不同波长的光使人产生不同的颜色感觉，说明人的感觉并不是对客观信息的被动接受，而是包含着对外界事物信息的选择、加工和转换，体现了认识主体的能动性。A项把认识局限于感官形成的感觉、B项以生理阈限划定认识能力的界限，都会导致不可知论；D项把感觉归结为人自身生理活动的结果，否认了感觉的客观来源。故选 C。","tags":["一、马克思主义哲学","认识和实践","认识的基础"],"part":"一、马克思主义哲学","section":"认识和实践","subsection":"认识的基础","origin":"考研真题 · 2003年第3题"},{"id":"ky-043","bank":"kaoyan","bankName":"考研政治真题精选","num":43,"type":"single","stem":"恩格斯说：“鹰比人看得远得多，但是人的眼睛识别的东西远胜于鹰。狗比人具有锐敏得多的嗅觉，但是它连被人当作各种物的特定标志的不同气味的百分之一也辨别不出来。”人的感官的识别能力高于动物，除了人脑及感官发育得更完美之外，还因为（）","options":[{"key":"A","text":"人不仅有感觉还有思维"},{"key":"B","text":"人不仅有理性还有非理性"},{"key":"C","text":"人不仅有直觉还有想象"},{"key":"D","text":"人不仅有生理机能还有心理活动"}],"answer":["A"],"analysis":"人的感官识别能力高于动物，除了人脑及感官发育得更完美这一生理条件之外，关键在于人有思维（理性认识），人不仅能看到对象，还能理解和识别对象，把感觉材料加工上升为对事物本质和规律的把握，而动物只有感觉。B项非理性、C项直觉与想象、D项生理机能与心理活动都不是人高于动物的根本原因。故选 A。","tags":["一、马克思主义哲学","认识和实践","认识的基础"],"part":"一、马克思主义哲学","section":"认识和实践","subsection":"认识的基础","origin":"考研真题 · 2012年第1题"},{"id":"ky-044","bank":"kaoyan","bankName":"考研政治真题精选","num":44,"type":"multi","stem":"显微摄影是一门使用照相机拍摄显微镜下一般用肉眼无法看清的标本的技术。肉眼中千篇一律的细沙，在显微镜下，却是“一沙一世界”。有的晶莹剔透像宝石，有的金黄酥脆像饼干。即使是司空见惯的柴米油盐，在显微镜下也会展现神奇而充满魅力的另一面。显微镜下的“一沙一世界”表明（）","options":[{"key":"A","text":"任何事物都具有无限多样的属性"},{"key":"B","text":"事物的本质随着人们认识的变化而改变"},{"key":"C","text":"人们可以通过制造和使用工具日益深化对客观世界的认识"},{"key":"D","text":"人们能够通过对个别事物的认识而达到对世界整体的把握"}],"answer":["A","C","D"],"analysis":"肉眼中千篇一律的细沙在显微镜下呈现出“一沙一世界”，表明任何事物都具有无限多样的属性（A）；人们可以通过制造和使用工具（显微镜、照相机）日益深化对客观世界的认识（C）；人们能够通过对个别事物的认识达到对世界整体的把握（D）。B项错误，事物的本质是客观的，不随人们认识的变化而改变。故选 ACD。","tags":["一、马克思主义哲学","认识和实践","认识的基础"],"part":"一、马克思主义哲学","section":"认识和实践","subsection":"认识的基础","origin":"考研真题 · 2016年第17题"},{"id":"ky-045","bank":"kaoyan","bankName":"考研政治真题精选","num":45,"type":"single","stem":"爱迪生在发明电灯之前做了两千多实验，有个年轻的记者曾经问他为什么遭遇这么多次失败。爱迪生回答：“我一次都没有失败。我发明了电灯，这只是一段经历了两千步的历程。”爱迪生之所以说“我一次都没有失败”，是因为他把每一次实验都看做（）","options":[{"key":"A","text":"认识中所获得的相对真理"},{"key":"B","text":"整个实践过程中的一部分"},{"key":"C","text":"对事物规律的正确反映"},{"key":"D","text":"实践中可以忽略不计的偶然挫折"}],"answer":["B"],"analysis":"爱迪生把两千多次实验都看作发明电灯这一整个实践过程中的组成部分，每一次实验都使认识向前推进一步，因而他说“我一次都没有失败”。这表明实践是一个过程，失败是实践过程中的一个环节。A项“相对真理”、C项“对事物规律的正确反映”与“失败”不符；D项把失败说成实践中可以忽略不计的偶然挫折，否认了失败在认识发展中的意义。故选 B。\n\n\n\n### 真理的检验标准","tags":["一、马克思主义哲学","真理"],"part":"一、马克思主义哲学","section":"真理","subsection":"","origin":"考研真题 · 2014年第1题"},{"id":"ky-046","bank":"kaoyan","bankName":"考研政治真题精选","num":46,"type":"single","stem":"一种认识是不是真理，要看它（）","options":[{"key":"A","text":"能否满足人的需要"},{"key":"B","text":"能否被多数人认可"},{"key":"C","text":"能否付诸实践"},{"key":"D","text":"能否在实践中最终取得预期的效果"}],"answer":["D"],"analysis":"真理是主观与客观相符合的认识。检验一种认识是不是真理，就要把主观认识与客观事物联系起来比较，而实践是主观见之于客观的物质活动，具有直接现实性，只有在实践中最终取得预期的效果，才能证明认识与客观事物相符合。A项“能否满足人的需要”是价值标准；B项“能否被多数人认可”是主观标准；C项“能否付诸实践”不等于实践获得成功，都不能作为判断真理的标准。故选 D。","tags":["一、马克思主义哲学","真理"],"part":"一、马克思主义哲学","section":"真理","subsection":"","origin":"考研真题 · 1999年文科第4题"},{"id":"ky-047","bank":"kaoyan","bankName":"考研政治真题精选","num":47,"type":"single","stem":"1978年关于真理标准大讨论是一场新的思想解放运动。实践之所以成为检验真理的唯一标准是由（）","options":[{"key":"A","text":"真理的主观性和实践的客观性所要求的"},{"key":"B","text":"真理的相对性和实践的决定性所预设的"},{"key":"C","text":"真理的属性和实践的功能所规定的"},{"key":"D","text":"真理的本性和实践的特点所决定的"}],"answer":["D"],"analysis":"实践之所以成为检验真理的唯一标准，是由真理的本性和实践的特点共同决定的：从真理的本性看，真理是主观与客观相符合，要判定这种符合就必须把主观认识与客观对象联系起来加以对照，认识自身和客观对象本身都不能充当这一标准；从实践的特点看，实践是主观见之于客观的物质活动，具有直接现实性，能把主观认识变成客观现实，从而检验认识是否具有真理性。A、B、C三项的表述都没有揭示这一根据。故选 D。","tags":["一、马克思主义哲学","真理"],"part":"一、马克思主义哲学","section":"真理","subsection":"","origin":"考研真题 · 2009年第2题"},{"id":"ky-048","bank":"kaoyan","bankName":"考研政治真题精选","num":48,"type":"single","stem":"社会存在是指社会的物质生活条件，它有多方面的内容，其中最能集中体现人类社会性质的是（）","options":[{"key":"A","text":"社会形态"},{"key":"B","text":"地理环境"},{"key":"C","text":"人口因素"},{"key":"D","text":"生产方式"}],"answer":["D"],"analysis":"社会存在是指社会的物质生活条件，包括地理环境、人口因素和生产方式。其中，生产方式是社会历史发展的决定力量，它决定着社会的性质、结构和面貌，是区分不同社会形态的根本标志，因而最能集中体现人类社会的性质。A项社会形态是经济基础与上层建筑的统一，不是社会存在的内容；B项地理环境、C项人口因素是社会存在的内容，但只起加速或延缓社会发展的作用，不起决定作用。故选 D。","tags":["一、马克思主义哲学","历史唯物主义是科学的社会历史观"],"part":"一、马克思主义哲学","section":"历史唯物主义是科学的社会历史观","subsection":"","origin":"考研真题 · 2011年第2题"},{"id":"ky-049","bank":"kaoyan","bankName":"考研政治真题精选","num":49,"type":"single","stem":"大众心理影响经济走势，能正确解释这一现象的观点是（）","options":[{"key":"A","text":"社会意识对社会存在具有决定作用"},{"key":"B","text":"社会心理可以左右社会发展方向"},{"key":"C","text":"只有正确的社会意识才能影响社会发展"},{"key":"D","text":"社会意识反作用于社会存在"}],"answer":["D"],"analysis":"大众心理属于社会意识范畴，它影响经济走势，正说明社会意识对社会存在具有能动的反作用，先进的社会意识促进社会发展，落后的社会意识阻碍社会发展。A项错误，它颠倒了社会存在与社会意识的关系，是唯心史观；B项夸大了社会心理的作用，社会心理可以影响但不能左右社会发展方向；C项错误，正确的和错误的、先进的和落后的社会意识都会影响社会发展。故选 D。","tags":["一、马克思主义哲学","历史唯物主义是科学的社会历史观"],"part":"一、马克思主义哲学","section":"历史唯物主义是科学的社会历史观","subsection":"","origin":"考研真题 · 2000年文科第3题"},{"id":"ky-050","bank":"kaoyan","bankName":"考研政治真题精选","num":50,"type":"single","stem":"社会存在决定社会意识，社会意识是社会存在的反映。社会意识具有相对独立性，即它在反映社会存在的同时，还有自己特有的发展形式和规律。社会意识相对独立性最突出的表现是（）","options":[{"key":"A","text":"社会意识内部各种形式之间的相互作用和影响"},{"key":"B","text":"社会意识与社会存在发展的不完全同步性"},{"key":"C","text":"社会意识各种形式各自具有其历史继承性"},{"key":"D","text":"社会意识对社会存在具有能动的反作用"}],"answer":["D"],"analysis":"社会意识的相对独立性有多种表现：社会意识与社会存在发展的不完全同步性、社会意识各种形式各自具有历史继承性、社会意识内部各种形式之间相互作用和影响，以及社会意识对社会存在具有能动的反作用。其中，最突出的表现是社会意识对社会存在具有能动的反作用，即社会意识能够反作用于社会存在，促进或阻碍社会发展。A、B、C三项都是相对独立性的表现，但不是最突出的表现。故选 D。","tags":["一、马克思主义哲学","历史唯物主义是科学的社会历史观"],"part":"一、马克思主义哲学","section":"历史唯物主义是科学的社会历史观","subsection":"","origin":"考研真题 · 2015年第2题"},{"id":"ky-051","bank":"kaoyan","bankName":"考研政治真题精选","num":51,"type":"single","stem":"社会存在是指社会的物质生活条件，它有多方面的内容，其中最能集中体现人类社会性质的是（）","options":[{"key":"A","text":"社会形态"},{"key":"B","text":"地理环境"},{"key":"C","text":"人口因素"},{"key":"D","text":"生产方式"}],"answer":["D"],"analysis":"同第48题。社会存在包括地理环境、人口因素和生产方式，其中生产方式是社会历史发展的决定力量，最能集中体现人类社会的性质，也是区分不同社会形态的根本标志。故选 D。\n\n> **说明：** 本题与第48题重复，原文档在“历史唯物主义是科学的社会历史观”和“社会存在和社会意识”两节中均收录。","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 2011年第2题"},{"id":"ky-052","bank":"kaoyan","bankName":"考研政治真题精选","num":52,"type":"single","stem":"大众心理影响经济走势，能正确解释这一现象的观点是（）","options":[{"key":"A","text":"社会意识对社会存在具有决定作用"},{"key":"B","text":"社会心理可以左右社会发展方向"},{"key":"C","text":"只有正确的社会意识才能影响社会发展"},{"key":"D","text":"社会意识反作用于社会存在"}],"answer":["D"],"analysis":"同第49题。大众心理属于社会意识，其影响经济走势说明社会意识对社会存在具有能动的反作用。A项颠倒了社会存在与社会意识的关系；B项夸大了社会心理的作用；C项否认了落后、错误的社会意识同样会影响社会发展。故选 D。\n\n> **说明：** 本题与第49题重复，原文档两处均收录。","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 2000年文科第3题"},{"id":"ky-053","bank":"kaoyan","bankName":"考研政治真题精选","num":53,"type":"single","stem":"社会存在决定社会意识，社会意识是社会存在的反映。社会意识具有相对独立性，即它在反映社会存在的同时，还有自己特有的发展形式和规律。社会意识相对独立性最突出的表现是（）","options":[{"key":"A","text":"社会意识内部各种形式之间的相互作用和影响"},{"key":"B","text":"社会意识与社会存在发展的不完全同步性"},{"key":"C","text":"社会意识各种形式各自具有其历史继承性"},{"key":"D","text":"社会意识对社会存在具有能动的反作用"}],"answer":["D"],"analysis":"同第50题。社会意识相对独立性最突出的表现，是社会意识对社会存在具有能动的反作用。A、B、C三项虽也是相对独立性的表现，但不是最突出的表现。故选 D。\n\n> **说明：** 本题与第50题重复，原文档两处均收录。\n\n\n\n### 生产力和生产关系","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 2015年第2题"},{"id":"ky-054","bank":"kaoyan","bankName":"考研政治真题精选","num":54,"type":"single","stem":"马克思指出，判断一个变革时代不能以该时代的意识为依据，相反，这个意识必须从物质生活的矛盾中去解释。这里的“物质生活的矛盾”从根本上说是（）","options":[{"key":"A","text":"社会生产力和生产关系的现存冲突"},{"key":"B","text":"经济基础与上层建筑的现存冲突"},{"key":"C","text":"人类社会与自然界的现存冲突"},{"key":"D","text":"社会存在与社会意识的现存冲突"}],"answer":["A"],"analysis":"马克思指出，判断一个变革时代不能以该时代的意识为依据，这个意识必须从物质生活的矛盾中去解释。“物质生活的矛盾”从根本上说就是社会生产力和生产关系之间的现存冲突——生产力是最活跃最革命的因素，当它发展到一定阶段，便同现存的生产关系发生矛盾，这种矛盾是社会变革的根本原因，也是理解一切社会意识的根本依据。B项经济基础与上层建筑的冲突也很重要，但它是生产力与生产关系矛盾在政治和观念领域的表现，不是“从根本上说”所指；C、D两项均不符合题意。故选 A。","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 2019年第3题"},{"id":"ky-055","bank":"kaoyan","bankName":"考研政治真题精选","num":55,"type":"single","stem":"先进生产力的集中体现和主要标志是（）","options":[{"key":"A","text":"劳动者"},{"key":"B","text":"劳动对象"},{"key":"C","text":"科学技术"},{"key":"D","text":"管理方式"}],"answer":["C"],"analysis":"科学技术是第一生产力，是先进生产力的集中体现和主要标志。劳动者、劳动对象、管理方式都是生产力的构成要素或组织方式，其中劳动者是生产力中最活跃的主导因素，但衡量生产力是否先进，最集中体现在科学技术上。故选 C。","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 2002年理科第3题"},{"id":"ky-056","bank":"kaoyan","bankName":"考研政治真题精选","num":56,"type":"single","stem":"生产关系是人们在生产过程中结成的（）","options":[{"key":"A","text":"人与自然的关系"},{"key":"B","text":"人与人的物质利益关系"},{"key":"C","text":"管理与被管理的关系"},{"key":"D","text":"分工协作关系"}],"answer":["B"],"analysis":"生产关系是人们在物质生产过程中形成的、不以人的意志为转移的经济关系，其实质是人与人的物质利益关系。A项人与自然的关系是生产力所反映的关系，不是生产关系；C项管理与被管理的关系、D项分工协作关系是生产关系在某些方面的具体表现，都没有揭示生产关系的实质。故选 B。\n\n\n\n### 经济基础和上层建筑","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 1999年理科第3题"},{"id":"ky-057","bank":"kaoyan","bankName":"考研政治真题精选","num":57,"type":"multi","stem":"在下列社会现象中，属于上层建筑的有（）","options":[{"key":"A","text":"生产资料所有制形式"},{"key":"B","text":"政治法律制度"},{"key":"C","text":"国家政权"},{"key":"D","text":"社会意识形态"},{"key":"E","text":"社会风俗习惯"}],"answer":["B","C","D","E"],"analysis":"上层建筑是指建立在一定经济基础之上的意识形态以及相应的制度、组织和设施，分为两部分：一是政治上层建筑，包括政治法律制度、国家政权、军队、警察等（B、C）；二是观念上层建筑，即社会意识形态，包括政治法律思想、道德、艺术、宗教、哲学等（D）。E项社会风俗习惯属于观念上层建筑范畴。A项生产资料所有制形式属于生产关系即经济基础，不属于上层建筑。故选 BCDE。\n\n\n\n### 社会形态更替的一般规律及特殊形式","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 1999年理科第18题"},{"id":"ky-058","bank":"kaoyan","bankName":"考研政治真题精选","num":58,"type":"multi","stem":"从社会发展的主体选择性的角度看，中国人民走上社会主义道路，其原因在于（）","options":[{"key":"A","text":"社会主义符合中国人民根本利益的要求"},{"key":"B","text":"在历史进程中没有多种道路可供人们选择"},{"key":"C","text":"中国人民在国际交往中受到俄国十月社会主义革命的历史启示"},{"key":"D","text":"中国共产党对历史必然性及本国国情的正确把握"},{"key":"E","text":"人们可以自由选择社会制度并决定社会发展的方向"}],"answer":["A","C","D"],"analysis":"中国人民走上社会主义道路，体现了历史必然性与主体选择性的统一：社会主义符合中国人民的根本利益和要求（A）；中国人民在国际交往中受到俄国十月社会主义革命的历史启示（C）；中国共产党对历史必然性及本国国情作出了正确把握（D）。B项否认了历史发展存在多种可能性和主体的选择性；E项否认了社会规律的客观性和历史选择的受制约性，是错误的。故选 ACD。","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 2002年文科第17题"},{"id":"ky-059","bank":"kaoyan","bankName":"考研政治真题精选","num":59,"type":"multi","stem":"1989年，时任美国国务院顾问的弗朗西斯·福山抛出了所谓的“历史终结论”，认为西方实行的自由民主制度是“人类社会形态进步的终点”和“人类最后一种的统治形式”。然而，20年来的历史告诉我们，终结的不是历史，而是西方的优越感。就在柏林墙倒塌20年后的2009年11月9日，BBC公布了一份对27国民众的调查。结果半数以上的受访者不满资本主义制度，此次调查的主办方之一的“全球扫描”公司主席米勒对媒体表示，这说明随着1989年柏林墙的倒塌资本主义并没有取得看上去的压倒性胜利，这一点在这次金融危机中表现的尤其明显，“历史终结论”的破产说明：（）","options":[{"key":"A","text":"社会规律和自然规律一样都是作为一种盲目的无意识力量起作用"},{"key":"B","text":"人类历史发展的曲折性不会改变历史发展的前进性"},{"key":"C","text":"一些国家社会发展的特殊形式不能否定历史发展的普遍规律"},{"key":"D","text":"人们对社会发展某个阶段的认识不能代替社会发展的整个过程"}],"answer":["B","C","D"],"analysis":"“历史终结论”的破产说明：人类历史发展的曲折性不会改变历史发展的前进性（B）；一些国家社会发展的特殊形式不能否定历史发展的普遍规律（C）；人们对社会发展某个阶段的认识不能代替社会发展的整个过程（D）。A项错误，社会规律与自然规律不同，它必须通过人有意识的、有目的的活动才能起作用，而不是盲目的无意识力量。故选 BCD。","tags":["一、马克思主义哲学","社会基本矛盾","社会存在和社会意识"],"part":"一、马克思主义哲学","section":"社会基本矛盾","subsection":"社会存在和社会意识","origin":"考研真题 · 2010年第20题"},{"id":"ky-060","bank":"kaoyan","bankName":"考研政治真题精选","num":60,"type":"single","stem":"阶级产生的直接原因是（）","options":[{"key":"A","text":"一部分人对另一部分人的暴力掠夺"},{"key":"B","text":"社会产品的分配不均"},{"key":"C","text":"剩余产品的出现"},{"key":"D","text":"生产资料私有制的形成"}],"answer":["D"],"analysis":"阶级是一个经济范畴。剩余产品的出现使阶级的产生成为可能，而生产资料私有制的形成则使这种可能变为现实：私有制使一部分人能够占有另一部分人的劳动，从而产生阶级。因此，生产资料私有制的形成是阶级产生的直接原因（根源）。A项暴力掠夺是阶级产生过程中的一种现象，B项社会产品的分配不均是由私有制决定的，都不能作为直接原因；C项只是提供了可能。故选 D。","tags":["一、马克思主义哲学","阶级　国家　革命"],"part":"一、马克思主义哲学","section":"阶级　国家　革命","subsection":"","origin":"考研真题 · 1996年理科第3题"},{"id":"ky-061","bank":"kaoyan","bankName":"考研政治真题精选","num":61,"type":"single","stem":"坚持以人民为中心，就必须坚持人民主体地位，坚持立党为公、执政为民，践行全心全意为人民服务的根本宗旨，把党的群众路线贯彻到治国理政全部活动之中，把人民对美好生活的向往作为奋斗目标，“坚持以人民为中心”的理论基础是唯物史观关于（）","options":[{"key":"A","text":"人的本质是一切社会关系的总和的原理"},{"key":"B","text":"人民群众是历史的创造者的原理"},{"key":"C","text":"人民群众的活动受到社会历史条件制约的原理"},{"key":"D","text":"总体的人在总体的历史过程中的主体地位的原理"}],"answer":["B"],"analysis":"“坚持以人民为中心”强调人民是历史的主体、是历史的创造者，坚持人民主体地位，把人民对美好生活的向往作为奋斗目标。其理论基础是唯物史观关于人民群众是历史的创造者的原理。A项人的本质是一切社会关系的总和，讲的是人的本质问题；C项人民群众的活动受到社会历史条件制约，讲的是历史活动的受制约性；D项总体的人在总体历史过程中的主体地位，都不是“以人民为中心”的直接理论基础。故选 B。","tags":["一、马克思主义哲学","人民群众和个人在历史上的作用"],"part":"一、马克思主义哲学","section":"人民群众和个人在历史上的作用","subsection":"","origin":"考研真题 · 2018年第3题"},{"id":"ky-062","bank":"kaoyan","bankName":"考研政治真题精选","num":62,"type":"multi","stem":"马克思说，人的本质“在其现实性上，它是一切社会关系的总和”。其内涵有（）","options":[{"key":"A","text":"人的本质是单个人所固有的抽象物"},{"key":"B","text":"人的本质在于人的社会性"},{"key":"C","text":"人的本质是自由"},{"key":"D","text":"人的本质形成于人的各种社会关系中"}],"answer":["B","D"],"analysis":"马克思关于人的本质“在其现实性上，它是一切社会关系的总和”的论断表明：人的本质在于人的社会性（B），人的本质形成于人的各种社会关系之中（D），并随着社会关系的变化而变化，是具体的、历史的。A项“人的本质是单个人所固有的抽象物”正是马克思所批判的费尔巴哈式的抽象人性论；C项把自由说成人的本质，属于唯心主义的观点，不是这一论断的内涵。故选 BD。","tags":["一、马克思主义哲学","人民群众和个人在历史上的作用"],"part":"一、马克思主义哲学","section":"人民群众和个人在历史上的作用","subsection":"","origin":"考研真题 · 2001年理科第18题"},{"id":"ky-063","bank":"kaoyan","bankName":"考研政治真题精选","num":63,"type":"single","stem":"卢梭在《论人类不平等的起源和基础》中说道：“我认为，在人类的一切知识中，最有用但也最不完善的知识就是关于人的知识。”马克思的唯物史观破解了人是什么这一“斯芬克斯之谜”，马克思在《关于费尔巴哈的提纲》中指出，人的本质在其现实性上是（）","options":[{"key":"A","text":"自然属性和社会属性的内在统一"},{"key":"B","text":"所有人共同属性的概括"},{"key":"C","text":"一切社会关系的总和"},{"key":"D","text":"自由理性的外化"}],"answer":["C"],"analysis":"马克思在《关于费尔巴哈的提纲》中指出：“人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和。”这既否定了抽象人性论，也否定了从自然属性或理性出发解释人的本质的唯心主义观点。A项自然属性和社会属性的内在统一、B项所有人共同属性的概括、D项自由理性的外化，都是抽象的人性论或唯心主义的表述。故选 C。","tags":["一、马克思主义哲学","人民群众和个人在历史上的作用"],"part":"一、马克思主义哲学","section":"人民群众和个人在历史上的作用","subsection":"","origin":"考研真题 · 2009年第4题"},{"id":"ky-064","bank":"kaoyan","bankName":"考研政治真题精选","num":64,"type":"multi","stem":"唯物史观第一次科学地解决了历史创造者的问题，认为人民群众是历史的创造者。人民群众（）","options":[{"key":"A","text":"从量上说是指社会人口中的绝大多数"},{"key":"B","text":"从质上说是社会中对社会历史发展起推动作用的人们"},{"key":"C","text":"在任何历史时期都不包括剥削阶级"},{"key":"D","text":"最稳定的主体部分始终是从事物质资料生产的劳动群众及其知识分子"}],"answer":["A","B","D"],"analysis":"人民群众是历史的创造者：从量上说，人民群众是指社会人口中的绝大多数（A）；从质上说，人民群众是指一切对社会历史发展起推动作用的人们（B）；其最稳定的主体部分始终是从事物质资料生产的劳动群众及其知识分子（D）。C项错误，人民群众在不同历史时期有不同内容，可以包括剥削阶级中的进步阶层，例如新兴地主阶级、民族资产阶级在一定历史时期就属于人民群众。故选 ABD。","tags":["一、马克思主义哲学","人民群众和个人在历史上的作用"],"part":"一、马克思主义哲学","section":"人民群众和个人在历史上的作用","subsection":"","origin":"考研真题 · 2013年第18题"},{"id":"ky-065","bank":"kaoyan","bankName":"考研政治真题精选","num":65,"type":"multi","stem":"社会形态的更替具有客观性和必然性，但这并不否定人们的历史活动的能动性，并不排斥人们在遵循社会发展规律的基础上，对于某种社会形态的历史选择性。人们历史活动的能动性和选择性主要体现在（）","options":[{"key":"A","text":"社会发展的客观必然性为人们的历史选择提供了基础、范围和可能性空间"},{"key":"B","text":"社会形态更替的过程是主体能动性与客观规律性相统一的过程"},{"key":"C","text":"人们的历史选择性归根结底是人民群众的选择性"},{"key":"D","text":"社会发展的客观过程由每一个参与历史活动的个人的主观意志所决定"}],"answer":["A","B","C"],"analysis":"人们历史活动的能动性和选择性主要体现在：社会发展的客观必然性为人们的历史选择提供了基础、范围和可能性空间（A）；社会形态更替的过程是主体能动性与客观规律性相统一的过程（B）；人们的历史选择性归根结底是人民群众的选择性（C）。D项错误，社会发展的客观过程是由物质资料生产方式决定的，不能由参与历史活动的个人的主观意志决定，这是唯心史观的观点。故选 ABC。","tags":["一、马克思主义哲学","社会进步和人的解放"],"part":"一、马克思主义哲学","section":"社会进步和人的解放","subsection":"","origin":"考研真题 · 2018年第18题"},{"id":"ky-066","bank":"kaoyan","bankName":"考研政治真题精选","num":66,"type":"multi","stem":"作家史铁生在《奶奶的星星》中讲道，奶奶告诉他的故事与通常的说法不同：一般人说，地上死一个人，天上就熄灭了一颗星星；而奶奶说，地上死一个人，天上又多了一个星星，人死了就会升到天空，变成星星给走夜道的人照个亮了。于是他“慢慢相信，每一个活过的人，都能给后人的路途上添些光亮，也许是一颗巨星，也许是一把火炬，也许只是一支含泪的烛光……”这对我们理解个人在社会历史的作用的启示有（）","options":[{"key":"A","text":"历史是无数个人相互作用的合力的结果"},{"key":"B","text":"杰出个人决定历史发展的走向"},{"key":"C","text":"人人都是历史的创造者"},{"key":"D","text":"每个人对社会发展都有或大或小的作用"}],"answer":["A","D"],"analysis":"史铁生由“每一个活过的人，都能给后人的路途上添些光亮”体会到，每个人对社会发展都有或大或小的作用（D），而历史是无数个人相互作用的合力的结果（A）。B项错误，杰出个人只能影响历史进程、加速或延缓历史发展，不能决定历史发展的走向；C项错误，“人人都是历史的创造者”混淆了个人与人民群众的作用，只有人民群众才是历史的创造者（这里的“创造者”指的是推动社会发展的决定性力量）。故选 AD。","tags":["一、马克思主义哲学","社会进步和人的解放"],"part":"一、马克思主义哲学","section":"社会进步和人的解放","subsection":"","origin":"考研真题 · 2014年第18题"},{"id":"ky-067","bank":"kaoyan","bankName":"考研政治真题精选","num":67,"type":"multi","stem":"马克思主义从必然性和偶然性的辩证统一中理解杰出人物的历史作用，认为（）","options":[{"key":"A","text":"杰出人物能够改变历史发展的基本方向"},{"key":"B","text":"杰出人物的历史作用受到一定历史条件的制约"},{"key":"C","text":"杰出人物历史作用的形成和发挥与其服务人民群众的意愿密不可分"},{"key":"D","text":"杰出人物们因其智慧性格因素对社会进程发生影响"}],"answer":["B","C","D"],"analysis":"马克思主义从必然性和偶然性的辩证统一中理解杰出人物的历史作用：杰出人物的历史作用受到一定历史条件的制约（B），他们只能在一定历史条件提供的舞台上活动；杰出人物历史作用的形成和发挥，与其服务人民群众的意愿密不可分（C）；杰出人物因其智慧、性格等因素对社会进程发生影响，能够加速或延缓历史进程、影响历史进程的面貌（D）。A项错误，杰出人物不能改变历史发展的基本方向，也不能决定历史发展的总进程。故选 BCD。","tags":["一、马克思主义哲学","社会进步和人的解放"],"part":"一、马克思主义哲学","section":"社会进步和人的解放","subsection":"","origin":"考研真题 · 2015年第19题"},{"id":"ky-068","bank":"kaoyan","bankName":"考研政治真题精选","num":68,"type":"multi","stem":"唯物史观在坚持人民群众是历史的创造者这一基本前提下，高度重视个人在历史上的作用。历史人物是一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物。下列关于历史人物历史作用的正确认识是（）","options":[{"key":"A","text":"历史人物不论发挥什么样的作用都不能决定和改变历史发展的总进程和总方向"},{"key":"B","text":"历史人物会因其智慧、性格等因素对社会进程发生影响"},{"key":"C","text":"具有进步意义的历史人物往往能够首先发现或提出历史进程中新的历史任务"},{"key":"D","text":"历史人物对历史发展的作用都是积极的"}],"answer":["A","B","C"],"analysis":"历史人物是一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物。历史人物不论发挥什么样的作用，都不能决定和改变历史发展的总进程和总方向（A）；历史人物会因其智慧、性格等因素对社会进程发生影响（B）；具有进步意义的历史人物往往能够首先发现或提出历史进程中新的历史任务（C）。D项错误，历史人物的作用有积极与消极之分，反动人物会阻碍历史发展，不能说其作用“都是积极的”。故选 ABC。","tags":["一、马克思主义哲学","社会进步和人的解放"],"part":"一、马克思主义哲学","section":"社会进步和人的解放","subsection":"","origin":"考研真题 · 2017年第18题"},{"id":"ky-069","bank":"kaoyan","bankName":"考研政治真题精选","num":69,"type":"multi","stem":"资本主义必然为社会主义所替代，并不意味着资本主义将在短期内自行消亡。资本主义向社会主义的过渡必然是一个复杂的、长期的历史过程，其原因在于（）","options":[{"key":"A","text":"任何社会形态的存在都有绝对稳定性"},{"key":"B","text":"资本主义的发展具有不平衡性"},{"key":"C","text":"资本主义社会具有一定的自我调节能力"},{"key":"D","text":"当代资本主义的发展还显示出生产关系对生产力容纳的空间"}],"answer":["B","C","D"],"analysis":"资本主义向社会主义的过渡之所以是一个复杂的、长期的历史过程，原因在于：任何社会形态的存在都有相对稳定性，从产生到衰亡都要经过相当长的时间跨度；资本主义的发展具有不平衡性，从世界范围看，过渡必然是一个从个别国家逐步向更多国家扩展的相当长的历史过程；当代资本主义的发展还显示出生产关系对生产力容纳的空间，资本主义社会具有一定的自我调节能力，因而资本主义为社会主义所代替尚需长期过程。B、C、D三项正确。A项错在把社会形态的稳定性绝对化——社会形态的存在具有的是相对稳定性而不是绝对稳定性。故选 BCD。","tags":["一、马克思主义哲学","社会进步和人的解放"],"part":"一、马克思主义哲学","section":"社会进步和人的解放","subsection":"","origin":"考研真题 · 2019年第20题"},{"id":"ky-070","bank":"kaoyan","bankName":"考研政治真题精选","num":70,"type":"single","stem":"在以私有制经济为基础的商品经济中，商品生产者的私人劳动生产的产品是否与社会的需求相适应，作为具体劳动的有用性质能否为社会所承认，商品的使用价值和价值之间的矛盾是否能得到解决，决定着商品生产者的命运。以私有制为基础的商品经济的基本矛盾是（）","options":[{"key":"A","text":"使用价值和价值之间的矛盾"},{"key":"B","text":"私人劳动和社会劳动之间的矛盾"},{"key":"C","text":"具体劳动和抽象劳动的矛盾"},{"key":"D","text":"脑力劳动和体力劳动的矛盾"}],"answer":["B"],"analysis":"以私有制为基础的商品经济的基本矛盾，是私人劳动和社会劳动的矛盾。在以私有制为基础的商品经济中，生产者的劳动首先是私人劳动，但社会分工又使生产商品的劳动具有社会性质，是社会劳动。私人劳动能否转化为社会劳动，取决于商品能否卖出去、生产商品的具体劳动能否为社会所承认，这一矛盾决定着商品生产者的命运。正是这一矛盾决定了商品的使用价值与价值的矛盾、具体劳动与抽象劳动的矛盾，因而是商品经济一切矛盾的根源。A项使用价值与价值的矛盾、C项具体劳动与抽象劳动的矛盾都是这一基本矛盾的具体表现；D项脑力劳动与体力劳动的矛盾不属于商品经济的基本矛盾。故选 B。","tags":["二、政治经济学",""],"part":"二、政治经济学","section":"","subsection":"","origin":"考研真题 · 2019年第4题"},{"id":"ky-071","bank":"kaoyan","bankName":"考研政治真题精选","num":71,"type":"multi","stem":"资本主义的生产目的是追逐利润最大化，为了获得尽可能多的利润，分布在不同部门（行业）的资本家之间必然展开激烈的竞争，而竞争的结果必将导致利润的平均化。利润率的平均化的过程意味着（）","options":[{"key":"A","text":"某企业工人创造的剩余价值有被其他资本家侵占的可能"},{"key":"B","text":"各部门内不同资本家的等量投资所得到的利润大体上均等"},{"key":"C","text":"各部门资本家在加强对工人阶级的剥削上有着共同的阶级利益"},{"key":"D","text":"不从事直接生产的银行资本家所获得的利润总是低于平均利润"}],"answer":["A","B","C"],"analysis":"利润率平均化是部门之间竞争的结果，其实质是剩余价值在各部门资本家之间的重新分配。A项正确，既然利润被平均化，某企业工人创造的剩余价值就有被其他资本家侵占的可能；B项正确，各部门内不同资本家的等量投资所得到的利润大体上均等；C项正确，各部门资本家在瓜分剩余价值、加强对工人阶级的剥削上有着共同的阶级利益。D项错误，银行资本也要参与利润率平均化，银行资本家所获得的利润同样要趋向平均利润，并不总是低于平均利润。故选 ABC。","tags":["二、政治经济学",""],"part":"二、政治经济学","section":"","subsection":"","origin":"考研真题 · 2019年第19题"}],"subjective":[{"id":"c1s23-m22","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","kind":"材料论述题","score":10,"title":"材料论述题（第22题）：黑天鹅/灰犀牛与辩证思维","prompt":"**材料1：**\n\n进入新时代，我国面临更为严峻的国家安全形势，外部压力前所未有，传统安全威胁和非传统安全威胁相互交织，“黑天鹅”、“灰犀牛”事件时有发生。同形势任务要求相比，我国维护国家安全能力不足，应对各种重大风险能力不强，维护国家安全的统筹协调机制不健全。党中央强调，国泰民安是人民群众最基本、最普遍的愿望。必须坚持底线思维、居安思危、未雨绸缪，坚持国家利益至上，以人民安全为宗旨，以政治安全为根本，以经济安全为基础，以军事、科技、文化、社会安全为保障，以促进国际安全为依托，统筹发展和安全，统筹开放和安全，统筹传统安全和非传统安全，统筹自身安全和共同安全，统筹维护国家安全和塑造国家安全。\n\n——摘自《中共中央关于党的百年奋斗重大成就和历史经验的决议》\n\n**材料2：**\n\n“黑天鹅”事件通常指现实生活中出现的“出乎预料”的小概率事件。在特定时间内发生的可能性相对较低的小概率事件，广泛存在于自然、经济、政治等各个领域，具有偶发性、难以预测性等特征。小概率事件虽然发生概率小，但并非零概率事件，若从长时段来看，只要具备相关因素和条件，就可能会发生。小概率事件的影响不局限于一时一地，一旦发生，就可能会形成多米诺骨牌效应，导致系统性风险，给整个人类社会发展带来深远影响。\n\n习近平总书记在庆祝中国共产党成立100周年大会上的讲话中指出，新的征程上，我们必须增强忧患意识、始终居安思危，深刻认识我国社会主要矛盾变化带来的新特征新要求，深刻认识错综复杂的国际环境带来的新挑战，敢于斗争，善于斗争，逢山开道、遇水架桥，勇于战胜一切风险挑战。应对我国发展环境深刻复杂变化，特别是其中隐藏的重大风险挑战，是向着全面建成社会主义现代化强国目标前进的必然要求。我国发展具有多方面优势和条件，但我国发展不平衡不充分问题仍然突出，重点领域关键环节改革任务仍然艰巨。发展环境的深刻复杂变化，既要求我们牢牢把握机遇发展自己，又要求我们树立辩证思维，提高驾驭复杂局面、处理复杂问题的本领。\n\n——摘自《人民日报》（2020年7月27日、2021年7月2日）\n\n**问题：**\n\n（1）运用必然与偶然辩证关系的原理，说明小概率事件并非零概率事件。（5分）\n\n（2）面对复杂局面应如何运用好辩证思维？（5分）","reference":"（1）必然和偶然是对立统一的关系。一方面，二者是有区别的：它们产生和形成的原因不同，必然产生于事物内部的根本矛盾，偶然产生于非根本矛盾和外部条件；它们的表现形式不同，必然在事物发展过程中比较稳定、时空上比较确定，是同类事物普遍具有的发展趋势，偶然则是不稳定的、暂时的、不确定的，是事物发展中的个别表现；它们在事物发展中的地位和作用不同，必然在事物发展中居于支配地位，决定着事物发展的方向，偶然居于从属地位，对发展的必然过程起促进或延缓作用，使发展的确定趋势带有一定的特点和偏差。另一方面，必然和偶然又是统一的：必然存在于偶然之中，通过大量的偶然表现出来，并为自己开辟道路；偶然背后隐藏着必然，受必然的支配，偶然是必然的表现形式和补充；必然和偶然在一定条件下可以相互转化。\n\n根据以上原理，结合材料可知小概率事件体现了偶然性，偶然背后隐藏着必然，因此小概率事件并非零概率事件。对于“黑天鹅”这种偶然的小概率事件，我们应该敏锐地识别和把握，防患于未然。\n\n（2）面对复杂局面，我们必须要用联系、发展、全面的观点看问题。学习和掌握唯物辩证法，要求我们在实际工作中不断增强辩证思维能力、系统思维能力、战略思维能力、底线思维能力、历史思维能力等。善于抓住矛盾，分析矛盾、抓住关键、找准重点、洞察事物的发展规律。唯物辩证法关于必然和偶然辩证关系的原理要求我们既要重视事物发展的必然，把握事物发展的总趋势，又要善于从偶然中发现必然，把握有利于事物发展的机遇。","rubric":"本题为材料论述题，两问分别考查必然与偶然的辩证关系原理和辩证思维方法，作答要点如下。\n\n第（1）问的答题结构是“原理＋结合材料”。先完整陈述必然与偶然的对立统一关系：二者的区别（产生原因、表现形式、地位作用三方面不同）与二者的统一（必然存在于偶然之中并通过偶然开辟道路，偶然背后隐藏着必然并受必然支配，二者在一定条件下相互转化）。再回到材料：小概率事件即“黑天鹅”事件具有偶发性、难以预测性，属于偶然性；但偶然背后隐藏着必然，只要具备相关因素和条件就一定会发生，所以“小概率”不等于“零概率”。最后落到方法论：要敏锐识别、把握这类偶然事件，做到防患于未然。答题时切忌只背原理而不结合材料，也不可把“偶然性”与“必然性”的关系写成“现象与本质”或“原因与结果”的关系。\n\n第（2）问要在“辩证思维”这一总要求下展开，可沿三个层次组织：一是根本观点，即坚持用联系、发展、全面的观点看问题，反对孤立、静止、片面地形而上学地看问题；二是思维能力，即增强辩证思维能力、系统思维能力、战略思维能力、底线思维能力、历史思维能力等，提高驾驭复杂局面、处理复杂问题的本领；三是具体方法，即善于抓主要矛盾和矛盾的主要方面，抓住关键、找准重点、洞察事物发展规律，并把必然与偶然辩证关系的原理落到实际工作中——既重视事物发展的必然、把握发展的总趋势，又善于从偶然中发现必然、把握有利于事物发展的机遇。","origin":"第一章第二&三节 · 课堂练习"},{"kind":"简答题","score":7,"title":"为什么说世界的统一性在于物质的统一性？","prompt":"","reference":"1. 世界的统一性问题回答世界万事万物有没有共同本原。马克思主义哲学认为，世界统一于物质，世界的真正统一性在于它的物质性。\n2. 第一，自然界是物质的。自然界一切事物都属于物质不同形态，无论宏观宇宙还是微观粒子，都具有客观物质性。意识并不是脱离物质独立存在的实体，意识是人脑这种特殊物质的机能，是对客观物质世界的反映。\n3. 第二，人类社会同样具有物质性。人类社会是物质世界长期发展产物；物质资料生产方式是社会存在发展的基础；社会历史发展本质是物质生产发展过程。\n4. 第三，人的精神意识现象根源于物质，不能脱离物质独立存在。\n5. 综上所述，自然界、人类社会以及人的意识，都统一于物质。世界上千差万别的事物，都是物质的具体表现形态，所以世界的统一性是物质的统一性。","rubric":"- 点明世界统一于物质（2分）\n- 论述自然界物质性（2分）\n- 论述人类社会物质性（2分）\n- 意识根源于物质总结（1分）","id":"final24-sub-1","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","origin":"2024秋期末 · 简答题"},{"kind":"简答题","score":7,"title":"为什么说唯物辩证法的认识论是能动的革命的反映论？","prompt":"","reference":"1. 唯物主义认识论坚持反映论，认为认识是人脑对客观世界的反映；而唯心主义坚持先验论，认为认识先于客观对象。唯物辩证法认识论首先坚持唯物主义反映论的基本立场，和唯心主义先验论划清界限。\n2. 旧唯物主义认识论是直观、消极被动的反映论。它把认识看成客体被动作用于人脑，如同照镜子，忽视实践，忽视辩证法。\n3. 辩证唯物主义认识论克服旧唯物主义缺陷：\n（1）把**实践引入认识论**。实践是认识的来源、动力、检验标准、目的。认识是主体在改造客体实践基础上对客体的反映，不是消极静观。\n（2）把**辩证法运用于反映论**。认识不是一次完成，而是从感性认识到理性认识，再回到实践，实践—认识—再实践—再认识无限发展辩证过程。认识不仅反映现象，还能够透过现象把握事物本质规律；认识主体具有能动性。\n4. 因此，辩证唯物主义认识论不是消极直观反映，而是能动的革命的反映论。能动性体现在主体主动改造客体基础上反映世界；革命性体现在认识最终要指导实践去变革客观世界。","rubric":"- 和唯心先验论区分（2分）\n- 指出旧唯物反映论缺陷（2分）\n- 实践引入认识论（1.5分）\n- 辩证法运用于认识，能动、革命含义（1.5分）","id":"final24-sub-2","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","origin":"2024秋期末 · 简答题"},{"kind":"简答题","score":7,"title":"简述生产商品的劳动二重性及其辩证关系","prompt":"","reference":"1. 生产商品的劳动具有二重属性：**具体劳动**和**抽象劳动**。劳动二重性是理解政治经济学的枢纽。\n2. 具体劳动：指生产一定使用价值，具有特定形式、目的、工具、操作方法的有用劳动。具体劳动创造商品的**使用价值**，反映人与自然之间物质变换关系，属于劳动的自然属性。\n3. 抽象劳动：撇开劳动具体形式，无差别的一般人类劳动，即人的脑力体力的耗费。抽象劳动形成商品的**价值**，体现商品生产者之间社会经济关系，属于劳动的社会属性。\n4. 辩证关系：\n（1）统一性：具体劳动与抽象劳动不是两次独立劳动，是**同一个劳动过程两个方面**。生产商品的时候，劳动者一方面进行具体劳动创造使用价值；同时耗费人类一般劳动即抽象劳动形成价值。二者不可分割。\n（2）对立性：具体劳动反映人与自然关系；抽象劳动反映人与人社会关系。二者具有不同属性。当商品交换出现矛盾时，使用价值和价值矛盾，也表现为具体劳动与抽象劳动矛盾。","rubric":"- 写出劳动二重性概念（2分）\n- 具体劳动含义、作用、属性（1.5分）\n- 抽象劳动含义、作用、属性（1.5分）\n- 对立统一辩证关系（2分）","id":"final24-sub-3","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","origin":"2024秋期末 · 简答题"},{"kind":"辨析题","score":8,"title":"人不能两次踏进同一条河流","prompt":"","reference":"**判断：该命题是正确的，属于辩证法观点。**\n1. 这句话是古希腊哲学家赫拉克利特的著名论断。\n2. 原理：运动是物质的根本属性，物质世界一切事物都处在永恒的运动、变化、发展之中；同时事物又具有相对静止。运动是绝对的，静止是相对的。\n3. “人不能两次踏进同一条河流”：河流处于不停流动变化之中，当人第二次踏进去的时候，河水已经不是原来河水，河流已经发生变化，承认事物绝对运动。\n4. 同时该论断没有完全否定相对静止。河流作为一条河仍然保持自身性质相对稳定，没有把事物看成瞬息万变无法把握。\n5. 补充：其学生“人连一次也不能踏入同一条河流”则是诡辩论，夸大绝对运动，否认相对静止。\n6. 总结：该观点正确把握绝对运动和相对静止辩证统一，是辩证法的命题。","rubric":"- 判断正确（1分）\n- 原理：运动绝对性、静止相对性（3分）\n- 分析题干句子含义（2分）\n- 对比诡辩论，总结（2分）","id":"final24-sub-4","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","origin":"2024秋期末 · 辨析题"},{"kind":"辨析题","score":8,"title":"人民群众是历史的剧中人，英雄人物是历史的副作人","prompt":"","reference":"**判断：该观点错误，属于英雄史观（历史唯心主义）。**\n1. “人民群众是历史的剧中人，英雄人物是历史的剧作者”是题目变体表述。\n2. 唯物史观认为：**人民群众是历史的创造者，是历史的剧作者，也是剧中人**。人民群众创造物质财富、精神财富，是社会变革决定力量。\n3. 英雄人物（杰出历史人物）是在人民群众实践基础上产生。杰出人物对历史发展起加速或者延缓作用，但**不能决定历史发展总方向总趋势**，不能充当历史的“剧作者”。英雄人物同样参与历史活动，也是历史剧中人。\n4. 题目把英雄当作历史的副作人（剧作者），把人民群众仅仅当作剧中演员，夸大英雄人物作用，贬低人民群众历史决定作用，属于历史唯心主义英雄史观。\n5. 总结：历史是人民群众创造；杰出人物受时代条件、人民实践制约。","rubric":"- 判断错误（1分）\n- 人民群众历史地位：既是剧中人也是剧作者（3分）\n- 杰出人物作用、局限性（2分）\n- 点明属于英雄史观，唯心史观（2分）","id":"final24-sub-5","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","origin":"2024秋期末 · 辨析题"},{"kind":"论述题","score":13,"title":"请运用“矛盾的基本属性”的相关知识，结合人口因素对社会发展的作用谈谈老龄化社会带来的机遇和挑战","prompt":"","reference":"#### 原理部分\n1. 矛盾基本属性是**同一性和斗争性**。矛盾同一性指矛盾双方相互依存、相互贯通，在一定条件下可以相互转化；矛盾斗争性指矛盾双方相互排斥、相互对立。矛盾双方既对立又统一，由此推动事物运动变化发展。\n2. 人口因素是重要社会物质生活条件。人口数量、结构、素质影响社会发展，可以加速或者延缓社会发展；但人口因素**不是社会发展的最终决定力量**，社会发展最终决定力量是生产力。\n\n#### 分析老龄化带来挑战（斗争性，对立一面）\n人口老龄化带来诸多现实挑战：\n1. 劳动力结构变化。老年人口占比上升，劳动年龄人口占比下降，劳动力供给压力加大，对社会生产带来压力。\n2. 社会保障压力加大。养老、医疗社会保障支出增加，给国家财政带来负担；家庭养老负担加重。\n3. 社会消费结构压力，养老公共服务供给不足，养老资源缺口。以上是老龄化带来的现实挑战，体现老龄化带来的矛盾对立方面。\n\n#### 分析老龄化带来机遇（同一性，矛盾双方依存、转化）\n矛盾具有同一性，挑战之中蕴含机遇，条件成熟挑战可以转化为发展机遇：\n1. 催生银发经济、养老产业发展。巨大老年群体需求带动养老服务、康养医疗、适老化产品产业发展，创造新经济增长点，拉动就业。\n2. 老年群体“银发力量”，大量退休老年人拥有丰富知识、技术、经验，可以继续参与社会建设，发挥余热，为社会贡献智力经验。\n3. 倒逼社会转型升级：倒逼科技创新发展智慧养老；倒逼完善社会保障体系，促进分配制度完善，促进社会公共服务体系更加公平完善。\n\n#### 总结\n1. 老龄化社会机遇与挑战二者对立统一。不能片面只看到挑战，也不能只看到机遇。机遇与挑战并存。\n2. 矛盾同一性告诉我们，发挥人的主观能动性，创造条件，可以把老龄化带来的挑战转化为发展机遇。\n3. 人口老龄化只是影响社会发展重要条件，社会发展根本依靠生产力进步。我们要立足生产力发展，完善制度，发展银发产业，积极应对人口老龄化。\n\n**评分要点（总分13）**\n1. 阐述矛盾同一性斗争性原理（4分）\n2. 阐述人口因素在社会发展当中地位作用（2分）\n3. 论述老龄化社会现实挑战（3分）\n4. 论述老龄化蕴含机遇，矛盾转化（3分）\n5. 总结，对立统一看待机遇挑战，发挥主观能动性转化矛盾（1分）","rubric":"1. 阐述矛盾同一性斗争性原理（4分）\n2. 阐述人口因素在社会发展当中地位作用（2分）\n3. 论述老龄化社会现实挑战（3分）\n4. 论述老龄化蕴含机遇，矛盾转化（3分）\n5. 总结，对立统一看待机遇挑战，发挥主观能动性转化矛盾（1分）","id":"final24-sub-6","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","origin":"2024秋期末 · 论述题"}],"chapters":{"id":"root","title":"马克思主义哲学笔记","level":0,"kind":"heading","notes":["# 马克思主义哲学笔记"],"children":[{"id":"root.1","title":"马克思主义的构成","level":1,"kind":"heading","notes":["## 一、马克思主义的构成"],"children":[{"id":"root.1.1","title":"本体论","level" <script>
/* assets/app.js */
/* ============================================================
   app.js — 应用内核
   职责：数据加载(DB) / 本地存档(Store) / 路由(Router) /
        通用工具 / 首页 / 主观题 / 关于页
   架构约定详见 DOCUMENTATION.md 第 3、5 节
   ============================================================ */
"use strict";

/* ---------------- 工具 ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const PORTRAIT_SRC = $(".ink-watermark")?.getAttribute("src") || "assets/marx-engels.png";
const TYPE_NAME = { judge: "判断题", single: "单选题", multi: "多选题" };

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/** 轻量 markdown：先转义，再支持 **粗体**、换行、"- "列表与 > 引用。 */
function mdLite(raw) {
  let s = escapeHtml(raw || "");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const lines = s.split(/\n+/).map(l => l.trim()).filter(Boolean);
  let html = "", inList = false;
  for (const l of lines) {
    const isItem = /^[-•]\s+/.test(l) || /^\d+[.、)]\s/.test(l);
    const isQuote = l.startsWith("&gt;") || l.startsWith(">");
    if (isItem) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${l.replace(/^[-•]\s+/, "")}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      html += isQuote
        ? `<p class="quote">${l.replace(/^&gt;|^>/, "")}</p>`
        : `<p>${l}</p>`;
    }
  }
  return html + (inList ? "</ul>" : "");
}
function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function dayKey(ts = Date.now()) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtDur(sec) {
  if (sec < 60) return `${sec}秒`;
  return `${Math.floor(sec / 60)}分${sec % 60 ? (sec % 60) + "秒" : ""}`;
}
function toast(msg) {
  $(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------------- 本地存档 Store ----------------
   localStorage 键：mayuan.study.v1
   结构约定见 DOCUMENTATION.md「localStorage 存档结构」 */
function isStudyObject(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value)
    && [Object.prototype, null].includes(Object.getPrototypeOf(value));
}

/** 只检查数据，不解释或执行内容；连未知字段内的危险键也拒绝。 */
function assertSafeStudyObject(value) {
  const pending = [value];
  let visited = 0;
  while (pending.length) {
    const item = pending.pop();
    if (++visited > 200000) throw new Error("备份内容过多，请选择本应用导出的学习备份。");
    if (item === null || typeof item !== "object") continue;
    if (!Array.isArray(item) && !isStudyObject(item)) throw new Error("备份包含不支持的数据类型。");
    for (const key of Object.keys(item)) {
      if (["__proto__", "prototype", "constructor"].includes(key)) {
        throw new Error("备份含有不安全的字段，已拒绝导入。");
      }
      pending.push(item[key]);
    }
  }
}

/** 存档校验与复制；knownIds 只在题库已加载后用于过滤旧题号。 */
function normalizeStudyData(raw, { requireComplete = false, knownIds = null } = {}) {
  assertSafeStudyObject(raw);
  if (!isStudyObject(raw)) throw new Error("学习存档应是一个 JSON 对象。");
  const fields = ["answers", "wrongBook", "attempts", "sessions", "levels", "days"];
  if (requireComplete && fields.some(key => !Object.hasOwn(raw, key))) {
    throw new Error("备份缺少学习记录字段，请选择本应用导出的 JSON 文件。");
  }
  const data = Store.defaults();
  const ignoredIds = new Set();
  const fail = field => { throw new Error(`学习存档中的 ${field} 格式不正确。`); };
  const object = (value, field) => { if (!isStudyObject(value)) fail(field); return value; };
  const number = (value, field, max = 1000000000, integer = true) => {
    if (typeof value !== "number" || !Number.isFinite(value) || value < 0 || value > max
      || (integer && !Number.isSafeInteger(value))) fail(field);
    return value;
  };
  const bool = (value, field) => { if (typeof value !== "boolean") fail(field); return value; };
  const text = (value, field, max = 500) => {
    if (typeof value !== "string" || value.length > max) fail(field);
    return value;
  };
  const timestamp = (value, field) => number(value, field, 8640000000000000);
  const questionId = (value, field) => {
    if (typeof value !== "string" || !/^[A-Za-z0-9:_-]{1,120}$/.test(value)) fail(field);
    if (knownIds && !knownIds.has(value)) { ignoredIds.add(value); return false; }
    return true;
  };
  const mode = (value, field) => {
    if (!["practice", "exam", "wrong", "subjective"].includes(value)) fail(field);
    return value;
  };

  for (const [qid, value] of Object.entries(object(raw.answers === undefined ? {} : raw.answers, "answers"))) {
    const a = object(value, "answers");
    const entry = {
      tries: number(a.tries, "answers.tries"), ok: number(a.ok, "answers.ok"),
      wrong: number(a.wrong, "answers.wrong"), lastOk: bool(a.lastOk, "answers.lastOk"),
      lastTs: timestamp(a.lastTs, "answers.lastTs")
    };
    if (entry.tries !== entry.ok + entry.wrong) fail("answers 的作答次数");
    if (questionId(qid, "answers 的题号")) data.answers[qid] = entry;
  }
  for (const [qid, value] of Object.entries(object(raw.wrongBook === undefined ? {} : raw.wrongBook, "wrongBook"))) {
    const w = object(value, "wrongBook");
    const entry = {
      ts: timestamp(w.ts, "wrongBook.ts"), count: number(w.count, "wrongBook.count"),
      mastered: bool(w.mastered, "wrongBook.mastered")
    };
    if (questionId(qid, "wrongBook 的题号")) data.wrongBook[qid] = entry;
  }
  if (raw.attempts !== undefined && !Array.isArray(raw.attempts)) fail("attempts");
  for (const value of raw.attempts ?? []) {
    const a = object(value, "attempts");
    const entry = {
      qid: a.qid, ok: bool(a.ok, "attempts.ok"), ts: timestamp(a.ts, "attempts.ts"),
      mode: mode(a.mode, "attempts.mode")
    };
    if (questionId(a.qid, "attempts.qid")) data.attempts.push(entry);
  }
  data.attempts = data.attempts.slice(-3000);
  if (raw.sessions !== undefined && !Array.isArray(raw.sessions)) fail("sessions");
  for (const value of raw.sessions ?? []) {
    const s = object(value, "sessions");
    const entry = {
      mode: mode(s.mode, "sessions.mode"), title: text(s.title, "sessions.title"),
      total: number(s.total, "sessions.total"), correct: number(s.correct, "sessions.correct"),
      pct: number(s.pct, "sessions.pct", 100, false), durSec: number(s.durSec, "sessions.durSec"),
      ts: timestamp(s.ts, "sessions.ts"), stars: s.stars == null ? null : number(s.stars, "sessions.stars", 3)
    };
    if (entry.correct > entry.total) fail("sessions.correct");
    if (entry.pct !== (entry.total ? Math.round(100 * entry.correct / entry.total) : 0)) fail("sessions.pct");
    data.sessions.push(entry);
  }
  for (const [id, value] of Object.entries(object(raw.levels === undefined ? {} : raw.levels, "levels"))) {
    if (!/^lv[1-9]\d{0,2}$/.test(id)) fail("levels 的关卡编号");
    const l = object(value, "levels");
    data.levels[id] = {
      stars: number(l.stars, "levels.stars", 3), bestPct: number(l.bestPct, "levels.bestPct", 100, false),
      plays: number(l.plays, "levels.plays")
    };
  }
  for (const [key, value] of Object.entries(object(raw.days === undefined ? {} : raw.days, "days"))) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !Number.isFinite(Date.parse(key + "T12:00:00Z"))
      || new Date(key + "T12:00:00Z").toISOString().slice(0, 10) !== key) fail("days 的日期");
    data.days[key] = number(value, "days 的作答次数");
  }
  if (raw.theme !== undefined && !["light", "dark"].includes(raw.theme)) fail("theme");
  data.theme = raw.theme ?? "light";
  return { data, ignoredIds: [...ignoredIds] };
}

const Store = {
  KEY: "mayuan.study.v1",
  data: null,
  persisted: true,
  notice: "",
  defaults() {
    return {
      answers: Object.create(null),   // qid -> {tries, ok, wrong, lastOk, lastTs}
      wrongBook: Object.create(null), // qid -> {ts, count, mastered}
      attempts: [],  // [{qid, ok, ts, mode}] 封顶 3000 条
      sessions: [],  // [{mode,title,total,correct,pct,durSec,ts,stars?}]
      levels: Object.create(null),    // 关卡 id -> {stars, bestPct, plays}
      days: Object.create(null),      // 'YYYY-MM-DD' -> 当日做题数
      theme: "light"
    };
  },
  normalize: normalizeStudyData,
  showNotice(message = "") {
    this.notice = message;
    const notice = $("#storageNotice");
    if (notice) { notice.textContent = message; notice.hidden = !message; }
  },
  unsaved() {
    this.persisted = false;
    this.showNotice("学习记录尚未持久保存，关闭页面后可能丢失。可继续学习，请及时到「成绩分析」导出备份。");
  },
  load() {
    this.data = this.defaults();
    let raw;
    try {
      raw = localStorage.getItem(this.KEY);
    } catch { this.unsaved(); return this.data; }
    try {
      if (raw !== null) this.data = this.normalize(JSON.parse(raw)).data;
      this.persisted = true; this.showNotice();
    } catch {
      this.persisted = false;
      this.showNotice("浏览器中的学习存档无法读取，本次以空记录开始。请到「成绩分析」导入已有备份，并及时导出本次学习记录。");
    }
    return this.data;
  },
  save() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.data));
      this.persisted = true; this.showNotice(); return true;
    } catch { this.unsaved(); return false; }
  },
  replace(raw) {
    this.data = this.normalize(raw, { requireComplete: true }).data;
    return this.save();
  },
  reset() {
    const theme = this.data?.theme || "light";
    this.data = this.defaults(); this.data.theme = theme;
    return this.save();
  },

  /** 记录一次作答。ok: boolean; mode: practice/exam/wrong */
  recordAnswer(qid, ok, mode) {
    const d = this.data;
    const a = d.answers[qid] || (d.answers[qid] = { tries: 0, ok: 0, wrong: 0, lastOk: false, lastTs: 0 });
    a.tries++; a.lastOk = ok; a.lastTs = Date.now();
    ok ? a.ok++ : a.wrong++;
    d.attempts.push({ qid, ok, ts: Date.now(), mode });
    if (d.attempts.length > 3000) d.attempts = d.attempts.slice(-3000);
    const k = dayKey();
    d.days[k] = (d.days[k] || 0) + 1;
    // 错题本联动：答错入册/加计数；答对若在册则标记可“掌握”
    if (!ok) {
      const w = d.wrongBook[qid] || (d.wrongBook[qid] = { ts: 0, count: 0, mastered: false });
      if (!w.ts) w.ts = Date.now();
      w.count++; w.mastered = false;
    }
    this.save();
  },
  markMastered(qid, mastered = true) {
    if (this.data.wrongBook[qid]) { this.data.wrongBook[qid].mastered = mastered; this.save(); }
  },
  removeWrong(qid) { delete this.data.wrongBook[qid]; this.save(); },
  addSession(s) { this.data.sessions.push(s); this.save(); },
  saveLevel(id, result) {
    const cur = this.data.levels[id] || { stars: 0, bestPct: 0, plays: 0 };
    cur.plays++;
    cur.stars = Math.max(cur.stars, result.stars);
    cur.bestPct = Math.max(cur.bestPct, result.pct);
    this.data.levels[id] = cur;
    this.save();
  },
  /** 连续学习天数（以今天为终点向前数） */
  streak() {
    let n = 0, t = Date.now();
    if (!this.data.days[dayKey(t)]) t -= 86400000; // 今天没学则从昨天算
    while (this.data.days[dayKey(t)] > 0) { n++; t -= 86400000; }
    return n;
  }
};

/* ---------------- 数据层 DB ---------------- */
const DB = {
  questions: [], subjective: [], chapters: null, banks: [],
  byId: Object.create(null),
  async load() {
    let data = window.MAYUAN_DATA;
    if (!data) {
      if (location.protocol === "file:") {
        throw new Error("未找到内置离线资料。请保留 data/offline-data.js 并重新打开完整的 Web/index.html，或使用 Offline 文件夹中的单文件成品。");
      }
      const [questions, subjective, chapters, banks] = await Promise.all([
        "data/questions.json", "data/subjective.json", "data/chapters.json", "data/banks.json"
      ].map(async url => {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`无法读取学习资料（HTTP ${response.status}）。`);
        return response.json();
      }));
      data = { questions, subjective, chapters, banks };
    }
    const { questions: q, subjective: s, chapters: c, banks: b } = data;
    if (!Array.isArray(q) || !q.length || !Array.isArray(s) || !isStudyObject(c) || !Array.isArray(b)
      || q.some(item => !isStudyObject(item) || typeof item.id !== "string")
      || new Set(q.map(item => item.id)).size !== q.length) {
      throw new Error("学习资料不完整，请重新打开完整的离线文件。");
    }
    this.questions = q; this.subjective = s; this.chapters = c; this.banks = b;
    this.byId = Object.assign(Object.create(null), Object.fromEntries(q.map(x => [x.id, x])));
  },
  ofBank(bankId) { return this.questions.filter(q => q.bank === bankId); },
  ofKaoyanSection(keywords) {
    const ks = Array.isArray(keywords) ? keywords : [keywords];
    return this.questions.filter(q =>
      q.bank === "kaoyan" && ks.some(k =>
        (q.section || "").includes(k) || (q.part || "").includes(k)));
  }
};

/** 万能选题器：{banks, kySections, tag, random} → 题目数组（供练习/闯关/针对训练共用） */
function pickQuestions(filter = {}) {
  let pool = [];
  if (filter.banks) pool = DB.questions.filter(q => filter.banks.includes(q.bank));
  else if (filter.kySections) pool = DB.ofKaoyanSection(filter.kySections);
  else pool = [...DB.questions];
  if (filter.tag) pool = pool.filter(q => (q.tags || []).some(t => t.includes(filter.tag)));
  if (filter.random && pool.length > filter.random) pool = shuffle(pool).slice(0, filter.random);
  return pool;
}

const Views = {}; // 各模块注册：Views.xxx = (params) => html 或渲染函数
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const [name, query] = hash.split("?");
  const params = Object.fromEntries(new URLSearchParams(query || ""));
  const view = Views[name || "home"] || Views.home;
  Views.map?.cleanup?.();
  $$("#nav a").forEach(a => a.classList.toggle("active", a.dataset.route === (name || "")));
  $("#view").innerHTML = "";
  $("#view").scrollTo?.(0, 0); window.scrollTo(0, 0);
  view(params);
}

/* ---------------- 启动 ---------------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
}
async function boot() {
  Store.load();
  applyTheme(Store.data.theme);
  $("#themeToggle").onclick = () => {
    Store.data.theme = Store.data.theme === "dark" ? "light" : "dark";
    Store.save(); applyTheme(Store.data.theme);
  };
  await DB.load();
  window.addEventListener("hashchange", route);
  document.addEventListener("click", event => {
    const link = event.target.closest?.("a[href^='#/']");
    if (link && link.getAttribute("href") === location.hash && !event.defaultPrevented
      && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
      event.preventDefault(); route();
    }
  });
  route();
}
function startApp() {
  boot().catch(e => {
    $("#view").innerHTML = `<div class="empty" role="alert">数据加载失败：${escapeHtml(e.message)}<br>
      请重新打开完整的离线文件；资料齐全时，直接双击即可使用。</div>`;
  });
}
// 必须等后续业务脚本注册 Views 后再路由，内置资料无需 fetch 也能正确启动。

  document.addEventListener("DOMContentLoaded", startApp, { once: true });
} else {

}

<script>
/* assets/quiz.js */
/* ============================================================
   quiz.js — 答题引擎
   两种模式：
   - practice 练习模式：单题作答立即判分，逐题阅读解析
   - exam    考试模式（闯关/模拟）：答题卡跳转，交卷统一出分
   产出结果 {total, correct, pct, durSec} 供调用方（如闯关）定级。
   作答行为统一写入 Store（见 DOCUMENTATION.md 存档结构）。
   ============================================================ */
"use strict";

/**
 * startQuiz({title, questions, mode, back, onFinish})
 *  - questions: 题目对象数组（DB.questions 的子集，允许乱序）
 *  - onFinish(result): 考试模式下交卷后回调；练习模式在结束时回调
 */
function startQuiz({ title, questions, mode = "practice", back = "#/", onFinish = null }) {
  if (!questions.length) { toast("该范围内暂无题目"); return; }
  const view = $("#view");
  const state = {
    i: 0,
    picks: questions.map(() => []),   // 每题已选字母
    locked: questions.map(() => false), // practice 模式：是否已判分
    startTs: Date.now(),
    finished: false,
  };

  const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const isRight = idx => sameSet(state.picks[idx], questions[idx].answer);

  function shell(inner) {
    view.innerHTML = `
      <div class="quiz-shell">
        <div class="quiz-topbar">
          <a class="btn small" href="${back}">‹ 返回</a>
          <strong style="font-size:14.5px">${escapeHtml(title)}</strong>
          <span class="chip" id="qPos"></span>
          <div class="quiz-progress"><i id="qBar"></i></div>
        </div>
        ${inner}
      </div>`;
  }

  /* ---------- practice 模式 ---------- */
  function renderPractice() {
    const q = questions[state.i];
    const picked = state.picks[state.i];
    const locked = state.locked[state.i];
    shell(`
      <div class="q-card">
        <div class="q-head">
          <span class="tag red">${TYPE_NAME[q.type]}</span>
          <span class="muted" style="font-size:12px">${escapeHtml(q.origin || q.bankName)}</span>
        </div>
        <div class="q-stem">${mdLite(q.stem)}</div>
        <div id="opts">
          ${q.options.map(o => `
            <button class="opt" data-key="${o.key}">
              <span class="key">${o.key}</span><span>${mdLite(o.text)}</span>
            </button>`).join("")}
        </div>
        <div id="fb"></div>
        <div class="q-actions">
          <button class="btn" id="prevQ" ${state.i === 0 ? "disabled" : ""}>‹ 上一题</button>
          <div>
            ${!locked && q.type === "multi" ? '<button class="btn primary" id="submitPick">提交答案</button>' : ""}
            ${locked
              ? (state.i === questions.length - 1
                  ? '<button class="btn primary" id="finishQ">查看成绩 ✓</button>'
                  : '<button class="btn primary" id="nextQ">下一题 ›</button>')
              : '<span class="muted" style="font-size:12px">' + (q.type === "multi" ? "多选题：选完后点提交" : "点击选项作答") + "</span>"}
          </div>
        </div>
      </div>`);

    $("#qPos").textContent = `第 ${state.i + 1} / ${questions.length} 题`;
    $("#qBar").style.width = `${100 * (state.i + 1) / questions.length}%`;

    const optBtns = $$("#opts .opt");
    function paint() {
      optBtns.forEach(b => {
        const k = b.dataset.key;
        b.classList.toggle("sel", picked.includes(k));
        if (locked) {
          b.disabled = true;
          if (q.answer.includes(k)) b.classList.add("right");
          else if (picked.includes(k)) b.classList.add("wrong-pick");
        }
      });
    }
    function judge() {
      state.locked[state.i] = true;
      const ok = isRight(state.i);
      Store.recordAnswer(q.id, ok, "practice");
      if (!ok) toast("已记入错题本");
      $("#fb").innerHTML = `
        <div class="q-feedback ${ok ? "ok" : "bad"}">
          <strong>${ok ? "✓ 回答正确" : "✗ 回答错误"}</strong>
          <span class="muted" style="margin-left:10px">正确答案：${q.answer.join("、")}</span>
        </div>
        <div class="q-analysis"><h4>解 析</h4>${mdLite(q.analysis || "（本题暂无解析）")}</div>`;
      paint();
      // 切换底部按钮
      const act = $(".q-actions div");
      act.innerHTML = state.i === questions.length - 1
        ? '<button class="btn primary" id="finishQ">查看成绩 ✓</button>'
        : '<button class="btn primary" id="nextQ">下一题 ›</button>';
      bindNav();
    }
    optBtns.forEach(b => b.onclick = () => {
      if (state.locked[state.i]) return;
      const k = b.dataset.key;
      if (q.type === "multi") {
        const p = picked.indexOf(k);
        p > -1 ? picked.splice(p, 1) : picked.push(k);
        paint();
      } else {
        state.picks[state.i] = [k];
        judge();
      }
    });
    function bindNav() {
      $("#prevQ")?.addEventListener("click", () => { state.i--; renderPractice(); });
      $("#nextQ")?.addEventListener("click", () => { state.i++; renderPractice(); });
      $("#finishQ")?.addEventListener("click", finish);
      $("#submitPick")?.addEventListener("click", () => {
        if (!state.picks[state.i].length) { toast("请先选择答案"); return; }
        judge();
      });
    }
    bindNav();
    if (locked) { // 回看已判分的题
      judge_noRecord();
    }
    function judge_noRecord() {
      paint();
      $("#fb").innerHTML = `
        <div class="q-feedback ${isRight(state.i) ? "ok" : "bad"}">
          <strong>${isRight(state.i) ? "✓ 回答正确" : "✗ 回答错误"}</strong>
          <span class="muted" style="margin-left:10px">正确答案：${q.answer.join("、")}</span>
        </div>
        <div class="q-analysis"><h4>解 析</h4>${mdLite(q.analysis || "（本题暂无解析）")}</div>`;
    }
  }

  /* ---------- exam 模式 ---------- */
  function renderExam() {
    const q = questions[state.i];
    const picked = state.picks[state.i];
    const answered = state.picks.filter(p => p.length).length;
    shell(`
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span class="muted" style="font-size:12.5px">已答 ${answered} / ${questions.length}（点击题号跳转）</span>
          <button class="btn primary small" id="handin">交 卷</button>
        </div>
        <div class="answer-sheet">
          ${questions.map((_, i) => `
            <button data-jump="${i}" class="${state.picks[i].length ? "done" : ""} ${i === state.i ? "cur" : ""}">${i + 1}</button>`).join("")}
        </div>
      </div>
      <div class="q-card">
        <div class="q-head">
          <span class="tag red">${TYPE_NAME[q.type]}</span>
          <span class="muted" style="font-size:12px">${escapeHtml(q.origin || q.bankName)}</span>
        </div>
        <div class="q-stem">${mdLite(q.stem)}</div>
        ${q.options.map(o => `
          <button class="opt ${picked.includes(o.key) ? "sel" : ""}" data-key="${o.key}">
            <span class="key">${o.key}</span><span>${mdLite(o.text)}</span>
          </button>`).join("")}
        <div class="q-actions">
          <button class="btn" id="prevQ" ${state.i === 0 ? "disabled" : ""}>‹ 上一题</button>
          <span class="muted" style="font-size:12px">${q.type === "multi" ? "多选题" : ""}</span>
          <button class="btn" id="nextQ" ${state.i === questions.length - 1 ? "disabled" : ""}>下一题 ›</button>
        </div>
      </div>`);

    $("#qPos").textContent = `第 ${state.i + 1} / ${questions.length} 题`;
    $("#qBar").style.width = `${100 * answered / questions.length}%`;

    $$("[data-jump]").forEach(b => b.onclick = () => { state.i = +b.dataset.jump; renderExam(); });
    $$(".opt").forEach(b => b.onclick = () => {
      const k = b.dataset.key;
      if (q.type === "multi") {
        const p = picked.indexOf(k);
        p > -1 ? picked.splice(p, 1) : picked.push(k);
      } else state.picks[state.i] = [k];
      renderExam();
    });
    $("#prevQ").onclick = () => { state.i--; renderExam(); };
    $("#nextQ").onclick = () => { state.i++; renderExam(); };
    $("#handin").onclick = () => {
      const un = questions.length - answered;
      if (un > 0 && !confirm(`还有 ${un} 题未作答，确定交卷？（未答按错误计）`)) return;
      finish();
    };
  }

  /* ---------- 结算 ---------- */
  function finish() {
    if (state.finished) return;
    state.finished = true;
    const durSec = Math.max(1, Math.round((Date.now() - state.startTs) / 1000));
    let correct = 0;
    questions.forEach((q, i) => {
      const ok = isRight(i);
      if (ok) correct++;
      if (mode === "exam") Store.recordAnswer(q.id, ok, "exam"); // practice 已逐题记录
    });
    const pct = Math.round(100 * correct / questions.length);
    const result = { total: questions.length, correct, pct, durSec };
    const extra = onFinish ? onFinish(result) : null; // 闯关回调星级等
    Store.addSession({
      mode, title, total: result.total, correct, pct, durSec,
      ts: Date.now(), stars: extra?.stars ?? null,
    });

    const dash = 2 * Math.PI * 52;
    shell(`
      <div class="card score-hero">
        <svg class="score-ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--bg-2)" stroke-width="10"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="${pct >= 60 ? "var(--red)" : "var(--mut)"}"
            stroke-width="10" stroke-linecap="round" transform="rotate(-90 60 60)"
            stroke-dasharray="${dash}" stroke-dashoffset="${dash * (1 - pct / 100)}"/>
          <text x="60" y="58" text-anchor="middle" class="pct" fill="var(--ink)" font-size="26" font-weight="800">${pct}%</text>
          <text x="60" y="78" text-anchor="middle" fill="var(--mut)" font-size="11">正确率</text>
        </svg>
        ${extra?.stars != null
          ? `<div class="stars">${[1, 2, 3].map(n => `<span class="${n <= extra.stars ? "" : "off"}">★</span>`).join("")}</div>`
          : ""}
        ${extra?.message ? `<p class="muted">${escapeHtml(extra.message)}</p>` : ""}
        <p style="font-size:15px">共 ${result.total} 题 · 答对 <strong style="color:var(--green)">${correct}</strong> ·
           答错 <strong style="color:var(--red)">${result.total - correct}</strong> · 用时 ${fmtDur(durSec)}</p>
        <div class="bank-actions" style="justify-content:center">
          <button class="btn" id="reviewWrong">回顾错题 (${result.total - correct})</button>
          <button class="btn" id="reviewAll">全部回顾</button>
          <a class="btn primary" href="${back}">完成，返回</a>
        </div>
      </div>
      <div id="reviewZone"></div>`);
    $("#qPos").textContent = "已交卷";
    $("#qBar").style.width = "100%";

    const renderReview = onlyWrong => {
      const items = questions.map((q, i) => ({ q, i, ok: isRight(i) }))
        .filter(x => !onlyWrong || !x.ok);
      $("#reviewZone").innerHTML = items.length ? items.map(({ q, i, ok }) => `
        <div class="card q-card" style="margin-top:14px">
          <div class="q-head">
            <span class="tag ${ok ? "green" : "red"}">第${i + 1}题 · ${ok ? "正确" : "错误"}</span>
            <span class="tag blue">${TYPE_NAME[q.type]}</span>
            <span class="muted" style="font-size:12px">${escapeHtml(q.origin || "")}</span>
          </div>
          <div class="q-stem">${mdLite(q.stem)}</div>
          ${q.options.map(o => {
            const pick = state.picks[i].includes(o.key);
            const cls = q.answer.includes(o.key) ? "right" : (pick ? "wrong-pick" : "");
            return `<button class="opt ${cls}" disabled><span class="key">${o.key}</span><span>${mdLite(o.text)}</span></button>`;
          }).join("")}
          <div class="q-feedback ${ok ? "ok" : "bad"}">
            你的作答：${state.picks[i].join("、") || "（未答）"}　正确答案：${q.answer.join("、")}
          </div>
          <div class="q-analysis"><h4>解 析</h4>${mdLite(q.analysis || "（本题暂无解析）")}</div>
        </div>`).join("")
        : '<div class="empty" style="margin-top:14px">没有错题，满分通过！</div>';
      $("#reviewZone").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    $("#reviewWrong").onclick = () => renderReview(true);
    $("#reviewAll").onclick = () => renderReview(false);
  }

  (mode === "exam" ? renderExam : renderPractice)();
}

</script>

   challenge.js — 闯关模式
   规则（详见 DOCUMENTATION.md 第 4.3 节）：
   - 共 10 关线性解锁：上一关正确率 ≥60%（★）解锁下一关
   - 星级：≥60% ★ / ≥85% ★★ / 100% ★★★，取历史最佳
   - 考试模式作答（答题卡 + 交卷出分），多选少选不得分
   ============================================================ */
"use strict";

const LEVELS = [
  { id: "lv1", name: "哲学起航", sub: "第一章第一节 · 课堂小测1",
    filter: { banks: ["c1s1-q1"] }, intro: "唯物论基础概念热身。" },
  { id: "lv2", name: "物质与意识", sub: "第一章第一节 · 课堂小测2",
    filter: { banks: ["c1s1-q2"] }, intro: "哲学基本问题与物质范畴。" },
  { id: "lv3", name: "辩证之法", sub: "第一章第二&三节 · 课堂练习",
    filter: { banks: ["c1s23"] }, intro: "联系、发展与三大规律。" },
  { id: "lv4", name: "期末试炼", sub: "2024秋期末真题 · 客观题",
    filter: { banks: ["final-2024"] }, intro: "一校三区回忆版原题，全真检验。" },
  { id: "lv5", name: "考研 · 本体论", sub: "考研真题 · 绪论 / 世界物质性 / 规律与能动性",
    filter: { kySections: ["绪论", "世界的物质性", "客观规律性"] }, intro: "考研首轮：唯物论板块。" },
  { id: "lv6", name: "考研 · 辩证法", sub: "考研真题 · 三大规律 / 联系和发展",
    filter: { kySections: ["三大规律", "联系和发展"] }, intro: "量变、否定、对立统一。" },
  { id: "lv7", name: "考研 · 认识论", sub: "考研真题 · 认识和实践 / 真理",
    filter: { kySections: ["认识和实践", "真理"] }, intro: "实践是检验真理的唯一标准。" },
  { id: "lv8", name: "考研 · 历史观", sub: "考研真题 · 历史唯物主义",
    filter: { kySections: ["历史唯物主义", "社会基本矛盾", "阶级", "人民群众", "社会进步"] },
    intro: "社会存在、基本矛盾与人民群众。" },
  { id: "lv9", name: "考研 · 政经初探", sub: "考研真题 · 政治经济学",
    filter: { kySections: ["政治经济学"] }, intro: "商品经济与价值规律。" },
  { id: "lv10", name: "终极挑战", sub: "全题库随机混编",
    filter: { random: 20 }, intro: "融会贯通，冲击满星！" },
];

const starOf = pct => pct >= 100 ? 3 : pct >= 85 ? 2 : pct >= 60 ? 1 : 0;

Views.challenge = function () {
  const d = Store.data;
  const totalStars = LEVELS.reduce((s, l) => s + ((d.levels[l.id] || {}).stars || 0), 0);
  // 第一个未通关关卡的索引：它本身及其之前全部解锁（首关恒解锁）
  const firstUndone = LEVELS.findIndex(l => !((d.levels[l.id] || {}).stars > 0));
  const unlockedUpTo = firstUndone === -1 ? LEVELS.length : firstUndone + 1;

  $("#view").innerHTML = `
    <h2 class="section-title">闯关模式 <small>CHALLENGE · ${totalStars}/${LEVELS.length * 3} ★</small></h2>
    <p class="muted" style="margin-top:-8px">
      规则：考试模式作答，交卷按正确率评星 —— ≥60% 得 ★ 并解锁下一关、≥85% ★★、满分 ★★★；多选题与期末判分标准一致，少选/多选均不得分。</p>
    <div class="level-path">
      ${LEVELS.map((l, i) => {
        const rec = d.levels[l.id] || { stars: 0, bestPct: 0, plays: 0 };
        const unlocked = i < unlockedUpTo;
        const qn = pickQuestions(l.filter).length;
        const isNext = i === firstUndone; // 当前待攻关卡（脉冲指引）
        return `
        <div class="level-item ${unlocked ? "unlocked" : "locked"} ${isNext ? "next" : ""}">
          <div class="level-node" data-lv="${i}">${unlocked ? i + 1 : "🔒"}</div>
          <div class="level-body">
            <h3>${escapeHtml(l.name)} ${rec.stars ? "" : '<span class="tag blue" style="font-size:10px">NEW</span>'}</h3>
            <div class="sub">${escapeHtml(l.sub)} · ${qn} 题</div>
            <div class="sub muted" style="font-size:11.5px">${escapeHtml(l.intro)}</div>
            <div class="level-foot">
              <span class="level-stars">${[1, 2, 3].map(n =>
                `<span class="${n <= rec.stars ? "" : "off"}" style="${n <= rec.stars ? "" : "color:var(--line-2)"}">★</span>`).join("")}</span>
              ${rec.plays ? `<span class="level-best">最佳 ${rec.bestPct}% · 已挑战 ${rec.plays} 次</span>` : ""}
              ${unlocked ? `<button class="btn small primary" data-lv="${i}" style="margin-left:auto">
                ${rec.plays ? "再次挑战" : "开始挑战"} ⚑</button>` : `<span class="muted" style="font-size:11.5px;margin-left:auto">通关上一关解锁</span>`}
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>`;

  $$("#view [data-lv]").forEach(btn => btn.onclick = () => {
    const lv = LEVELS[+btn.dataset.lv];
    if (+btn.dataset.lv >= unlockedUpTo) return;
    const qs = pickQuestions(lv.filter);
    startQuiz({
      title: `闯关 · ${lv.name}`,
      questions: qs, mode: "exam", back: "#/challenge",
      onFinish: res => {
        const stars = starOf(res.pct);
        Store.saveLevel(lv.id, { stars, pct: res.pct });
        const next = LEVELS[+btn.dataset.lv + 1];
        return {
          stars,
          message: stars
            ? (next ? `恭喜通关！已解锁下一关「${next.name}」${stars < 3 ? "，可重刷冲击更高星级" : "，满分太棒了！"}`
                      : "恭喜通关全部关卡！")
            : "未达到 60% 通关线，建议回思维导图查漏补缺后再来。",
        };
      },
    });
  });
};

</script>
<script>
/* assets/wrongbook.js */
/* ============================================================
   wrongbook.js — 错题本
   规则（详见 DOCUMENTATION.md 第 4.4 节）：
   - 任意模式答错 → 自动入册（计数 +1），答错时重置“已掌握”
   - 在错题重练中答对 → 可标记「已掌握」（条目保留，置灰沉淀）
   - 支持按题库筛选、手动移除、整卷重练
   主观题自评「还需努力」会以 S: 前缀条目入册。
   ============================================================ */
"use strict";

let wrongTab = "active"; // active | mastered | all
let wrongBankFilter = "all";

Views.wrong = function () {
  const d = Store.data;
  const book = d.wrongBook;

  function info(qid) {
    if (qid.startsWith("S:")) {
      const s = DB.subjective.find(x => "S:" + x.id === qid);
      return s ? { title: s.title, kind: s.kind, bank: s.bankName, isSub: true, raw: s } : null;
    }
    const q = DB.byId[qid];
    return q ? { title: q.stem, kind: TYPE_NAME[q.type], bank: q.bankName, isSub: false, raw: q } : null;
  }

  const entries = Object.entries(book)
    .map(([qid, w]) => ({ qid, ...w, meta: info(qid) }))
    .filter(e => e.meta)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));

  const active = entries.filter(e => !e.mastered);
  const mastered = entries.filter(e => e.mastered);
  let shown = wrongTab === "active" ? active : wrongTab === "mastered" ? mastered : entries;
  if (wrongBankFilter !== "all") shown = shown.filter(e => e.meta.bank === wrongBankFilter);

  const bankNames = [...new Set(entries.map(e => e.meta.bank))];

  $("#view").innerHTML = `
    <h2 class="section-title">错题本 <small>WRONG BOOK · ${active.length} 待攻克 / ${mastered.length} 已掌握</small></h2>
    <div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="tabs" style="margin:0">
        <button class="${wrongTab === "active" ? "on" : ""}" data-tab="active">待攻克 (${active.length})</button>
        <button class="${wrongTab === "mastered" ? "on" : ""}" data-tab="mastered">已掌握 (${mastered.length})</button>
        <button class="${wrongTab === "all" ? "on" : ""}" data-tab="all">全部 (${entries.length})</button>
      </div>
      <select id="bankFilter" class="btn small" style="appearance:auto">
        <option value="all">全部题库</option>
        ${bankNames.map(b => `<option ${wrongBankFilter === b ? "selected" : ""}>${escapeHtml(b)}</option>`).join("")}
      </select>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn primary small" id="drill" ${active.filter(e => !e.meta.isSub).length ? "" : "disabled"}>
          ⚑ 错题重练（${active.filter(e => !e.meta.isSub).length}）</button>
      </div>
    </div>
    <div class="subj-list" style="margin-top:16px">
      ${shown.length ? shown.map(e => `
        <div class="card wrong-item ${e.mastered ? "mastered" : ""}">
          <div class="wi-body">
            <div class="wi-stem">${escapeHtml(e.meta.title.slice(0, 90))}${e.meta.title.length > 90 ? "…" : ""}</div>
            <div class="wi-meta">
              <span class="tag ${e.meta.isSub ? "gold" : "blue"}">${e.meta.kind}</span>
              <span>${escapeHtml(e.meta.bank)}</span>
              <span>错 ${e.count} 次</span>
              ${e.ts ? `<span>入册 ${fmtDate(e.ts)}</span>` : ""}
              ${e.mastered ? '<span class="tag green">已掌握</span>' : ""}
            </div>
          </div>
          <div class="wi-act">
            ${e.meta.isSub
              ? `<a class="btn small" href="#/subjective">去复习</a>`
              : `<button class="btn small" data-redo="${e.qid}">重做</button>`}
            ${!e.mastered && !e.meta.isSub ? `<button class="btn small" data-master="${e.qid}">标记掌握</button>` : ""}
            <button class="btn small" data-del="${e.qid}">移除</button>
          </div>
        </div>`).join("")
      : `<div class="empty">${entries.length ? "当前筛选下没有错题" : "错题本空空如也 —— 去做几组题，答错的题会自动归集到这里。"}</div>`}
    </div>`;

  $$("#view [data-tab]").forEach(b => b.onclick = () => { wrongTab = b.dataset.tab; Views.wrong(); });
  $("#bankFilter").onchange = e => { wrongBankFilter = e.target.value; Views.wrong(); };
  $$("#view [data-del]").forEach(b => b.onclick = () => { Store.removeWrong(b.dataset.del); toast("已移除"); Views.wrong(); });
  $$("#view [data-master]").forEach(b => b.onclick = () => { Store.markMastered(b.dataset.master, true); toast("已标记掌握"); Views.wrong(); });
  $$("#view [data-redo]").forEach(b => b.onclick = () => {
    const q = DB.byId[b.dataset.redo];
    startQuiz({
      title: "错题重做（1题）", questions: [q], mode: "practice", back: "#/wrong",
      onFinish: () => null,
    });
  });
  $("#drill")?.addEventListener("click", () => {
    const qs = active.filter(e => !e.meta.isSub).map(e => DB.byId[e.qid]).filter(Boolean);
    startQuiz({
      title: "错题重练 · 整卷", questions: shuffle(qs), mode: "practice", back: "#/wrong",
      onFinish: res => {
        // 重练全对自动标记掌握（以本次逐题记录为准）
        if (res.pct === 100) {
          qs.forEach(q => Store.markMastered(q.id, true));
          return { stars: null, message: "全部答对！这批错题已自动标记为已掌握。" };
        }
        return null;
      },
    });
  });
};

</script>
<script>
/* assets/stats.js */
/* ============================================================
   stats.js — 成绩分析
   维度：总览 / 近14天作答趋势 / 题库正确率 / 题型正确率 /
        薄弱知识点 TOP5（含针对训练）/ 最近成绩记录
   图表为零依赖手写 SVG（详见 DOCUMENTATION.md 第 4.5 节）
   ============================================================ */
"use strict";

const MAX_STUDY_BACKUP_BYTES = 10 * 1024 * 1024;

function studyDataFeedback(message) {
  const feedback = $("#dataFeedback");
  if (feedback) feedback.textContent = message;
}

/** 新包装格式与旧版裸 Store.data 均只作为 JSON 数据读取。 */
function parseLearningBackup(source) {
  let raw;
  try { raw = JSON.parse(source); }
  catch { throw new Error("文件不是有效的 JSON，请选择导出的学习备份。"); }
  assertSafeStudyObject(raw);
  if (!isStudyObject(raw)) throw new Error("文件不是本应用的学习备份。");
  let data = raw;
  if (Object.hasOwn(raw, "format") || Object.hasOwn(raw, "data")) {
    if (raw.format !== "mayuan.study.backup" || raw.version !== 1 || !isStudyObject(raw.data)) {
      throw new Error("备份格式或版本不受支持，请选择本应用导出的文件。");
    }
    if (raw.exportedAt !== undefined && (typeof raw.exportedAt !== "string"
      || !Number.isFinite(Date.parse(raw.exportedAt)))) {
      throw new Error("备份的导出时间格式不正确。");
    }
    data = raw.data;
  }
  const knownIds = new Set([
    ...DB.questions.map(q => q.id), ...DB.subjective.map(s => "S:" + s.id)
  ]);
  return Store.normalize(data, { requireComplete: true, knownIds });
}

Views.stats = function () {
  const d = Store.data;
  const att = d.attempts.filter(a => !String(a.qid).startsWith("S:"));

  /* ---- 总览 ---- */
  const totalDone = att.length;
  const totalOk = att.filter(a => a.ok).length;
  const totalPct = totalDone ? Math.round(100 * totalOk / totalDone) : 0;
  const stars = Object.values(d.levels).reduce((s, l) => s + (l.stars || 0), 0);
  const passed = Object.values(d.levels).filter(l => l.stars > 0).length;
  const wrongActive = Object.values(d.wrongBook).filter(w => !w.mastered).length;

  /* ---- 近 14 天 ---- */
  const days14 = [...Array(14)].map((_, i) => {
    const t = Date.now() - (13 - i) * 86400000;
    const k = dayKey(t);
    const list = att.filter(a => dayKey(a.ts) === k);
    return { k, n: list.length, ok: list.filter(a => a.ok).length,
             label: `${new Date(t).getMonth() + 1}/${new Date(t).getDate()}` };
  });
  const maxN = Math.max(1, ...days14.map(x => x.n));

  /* ---- 按题库正确率 ---- */
  const perBank = DB.banks.map(b => {
    const ids = new Set(DB.ofBank(b.id).map(q => q.id));
    const list = att.filter(a => ids.has(a.qid));
    const ok = list.filter(a => a.ok).length;
    return { name: b.name, n: list.length, pct: list.length ? Math.round(100 * ok / list.length) : null };
  });

  /* ---- 按题型正确率 ---- */
  const perType = ["judge", "single", "multi"].map(t => {
    const ids = new Set(DB.questions.filter(q => q.type === t).map(q => q.id));
    const list = att.filter(a => ids.has(a.qid));
    const ok = list.filter(a => a.ok).length;
    return { name: TYPE_NAME[t], n: list.length, pct: list.length ? Math.round(100 * ok / list.length) : null };
  });

  /* ---- 薄弱知识点（按末层标签聚合，样本≥3 才上榜） ---- */
  const tagMap = {};
  for (const q of DB.questions) {
    const key = q.bank === "kaoyan" ? `考研 · ${q.section}` : q.bankName;
    tagMap[key] = tagMap[key] || { n: 0, ok: 0 };
  }
  for (const a of att) {
    const q = DB.byId[a.qid]; if (!q) continue;
    const key = q.bank === "kaoyan" ? `考研 · ${q.section}` : q.bankName;
    if (tagMap[key]) { tagMap[key].n++; if (a.ok) tagMap[key].ok++; }
  }
  const weak = Object.entries(tagMap)
    .filter(([, v]) => v.n >= 3)
    .map(([k, v]) => ({ k, ...v, pct: Math.round(100 * v.ok / v.n) }))
    .sort((a, b) => a.pct - b.pct)
    .slice(0, 5);

  const recent = [...d.sessions].reverse().slice(0, 8);

  $("#view").innerHTML = `
    <h2 class="section-title">成绩分析 <small>ANALYTICS</small></h2>

    <div class="stats-grid">
      ${[
        [totalDone, "累计作答(题)", ""], [totalPct + "%", "总正确率", ""],
        [Store.streak() + " 天", "连续学习", ""],
        [`${passed}/${typeof LEVELS !== "undefined" ? LEVELS.length : 10} 关`, `闯关进度 · ★${stars}`, ""],
        [wrongActive, "待攻克错题", ""],
      ].map(([n, l]) => `<div class="stat-tile card"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join("")}
    </div>

    <div class="grid" style="grid-template-columns:1.4fr 1fr;margin-top:16px">
      <div class="card chart-card">
        <h3>近 14 天作答趋势</h3>
        <svg viewBox="0 0 560 170" style="width:100%;margin-top:8px">
          ${[0, 1, 2, 3].map(i => {
            const y = 20 + i * 35;
            return `<line x1="34" y1="${y}" x2="545" y2="${y}" stroke="var(--line)" stroke-width="1" ${i === 3 ? 'stroke-dasharray="0"' : 'stroke-dasharray="3 4"'}/>
                    <text x="30" y="${y + 4}" text-anchor="end" font-size="9" fill="var(--mut)">${Math.round(maxN * (3 - i) / 3)}</text>`;
          }).join("")}
          ${days14.map((x, i) => {
            const bw = 22, gap = (545 - 34 - 14 * bw) / 13;
            const px = 34 + i * (bw + gap), h = x.n ? Math.max(3, 110 * x.n / maxN) : 2;
            const y = 130 - h;
            const okH = x.n ? h * x.ok / x.n : 0;
            return `
              <rect x="${px}" y="${y}" width="${bw}" height="${h}" rx="4" fill="var(--red-soft)"/>
              <rect x="${px}" y="${130 - okH}" width="${bw}" height="${okH}" rx="4" fill="var(--red)"/>
              <text x="${px + bw / 2}" y="${y - 5}" text-anchor="middle" font-size="9" fill="var(--ink-2)">${x.n || ""}</text>
              <text x="${px + bw / 2}" y="146" text-anchor="middle" font-size="8.5" fill="var(--mut)">${x.label}</text>
              <title>${x.label}：作答 ${x.n}，答对 ${x.ok}</title>`;
          }).join("")}
        </svg>
        <p class="muted" style="font-size:11.5px;margin-top:2px">
          <span style="color:var(--red)">■</span> 答对数　<span style="color:var(--red-soft)">■</span> 作答总数（鼠标悬停看明细）</p>
      </div>

      <div class="card chart-card">
        <h3>题型正确率</h3>
        <svg viewBox="0 0 260 150" style="width:100%;margin-top:8px">
          ${perType.map((t, i) => {
            const h = t.pct == null ? 0 : Math.max(3, 100 * t.pct / 100);
            const x = 34 + i * 74, w = 42;
            return `
              <rect x="${x}" y="${120 - h}" width="${w}" height="${h}" rx="6"
                    fill="${["var(--gold)", "var(--red)", "var(--blue)"][i]}" opacity="${t.pct == null ? .15 : .9}"/>
              <text x="${x + w / 2}" y="${112 - h}" text-anchor="middle" font-size="12" font-weight="700"
                    fill="var(--ink)">${t.pct == null ? "–" : t.pct + "%"}</text>
              <text x="${x + w / 2}" y="136" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${t.name}</text>
              <text x="${x + w / 2}" y="148" text-anchor="middle" font-size="9" fill="var(--mut)">${t.n} 次作答</text>`;
          }).join("")}
        </svg>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px">
      <div class="card chart-card">
        <h3>题库正确率</h3>
        <div style="margin-top:12px">
          ${perBank.map(b => `
            <div class="hbar-row">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(b.name)}">${escapeHtml(b.name)}</span>
              <div class="bar"><i style="width:${b.pct ?? 0}%"></i></div>
              <span class="val">${b.pct == null ? "未开始" : b.pct + "% · " + b.n + "次"}</span>
            </div>`).join("")}
        </div>
        <h3 style="margin-top:22px">薄弱知识点 TOP5 <span class="tag red" style="font-size:10px">按正确率升序 · 样本≥3</span></h3>
        ${weak.length ? `<ul class="weak-list" style="margin-top:10px;padding-left:0;list-style:none">
          ${weak.map(w => `
            <li>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span>${escapeHtml(w.k.replace(/　/g, " "))}</span>
                <span class="${w.pct < 60 ? "" : "muted"}" style="color:${w.pct < 60 ? "var(--red)" : ""};font-weight:${w.pct < 60 ? 700 : 400}">
                  ${w.pct}%（${w.ok}/${w.n}）</span>
              </div>
              <div class="progressline" style="margin-top:4px"><i style="width:${w.pct}%"></i></div>
            </li>`).join("")}
        </ul>
        <button class="btn primary" id="drillWeak">⚑ 针对训练（覆盖以上全部考点）</button>
        ` : '<p class="muted" style="margin-top:8px">作答样本还太少（每个考点≥3次作答后上榜），先去刷题吧。</p>'}
      </div>

      <div class="card chart-card">
        <h3>最近成绩记录</h3>
        ${recent.length ? `
        <table class="sess-table">
          <thead><tr><th>时间</th><th>内容</th><th>模式</th><th>成绩</th><th>用时</th></tr></thead>
          <tbody>
            ${recent.map(s => `
              <tr>
                <td class="muted">${fmtDate(s.ts)}</td>
                <td>${escapeHtml((s.title || "").slice(0, 18))}${(s.title || "").length > 18 ? "…" : ""}</td>
                <td>${s.mode === "exam" ? "闯关/考试" : s.mode === "practice" ? "练习" : "自评"}</td>
                <td><strong style="color:${s.pct >= 60 ? "var(--green)" : "var(--red)"}">${s.pct}%</strong>
                  <span class="muted">(${s.correct}/${s.total})</span>
                  ${s.stars ? " ★".repeat(s.stars) : ""}</td>
                <td class="muted">${fmtDur(s.durSec)}</td>
              </tr>`).join("")}
          </tbody>
        </table>` : '<p class="muted">还没有成绩记录，去完成一组练习或一次闯关吧。</p>'}
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn small" id="exportData">导出学习数据(JSON)</button>
          <button class="btn small" id="importData">导入学习备份</button>
          <input id="importFile" type="file" accept=".json,application/json" hidden aria-label="选择学习备份 JSON 文件">
          <button class="btn small" id="resetData" style="color:var(--red)">清空全部学习记录</button>
        </div>
        <p class="muted" style="font-size:12px;margin-top:8px">更换浏览器、移动页面或清理数据前请导出备份。导入会覆盖当前记录，支持本应用旧版 JSON 备份。</p>
        <p id="dataFeedback" role="status" aria-live="polite" aria-atomic="true" style="font-size:12.5px;margin-top:8px"></p>
      </div>
    </div>`;

  $("#drillWeak")?.addEventListener("click", () => {
    const keys = weak.map(w => w.k);
    const pool = DB.questions.filter(q => keys.includes(q.bank === "kaoyan" ? `考研 · ${q.section}` : q.bankName));
    startQuiz({
      title: "薄弱知识点 · 针对训练",
      questions: shuffle(pool).slice(0, 20), mode: "practice", back: "#/stats",
    });
  });
  $("#exportData").onclick = () => {
    let url = null;
    const a = document.createElement("a");
    try {
      const backup = {
        format: "mayuan.study.backup", version: 1,
        exportedAt: new Date().toISOString(), data: Store.data
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      url = URL.createObjectURL(blob);
      a.href = url;
      a.download = `mayuan-study-backup-${dayKey()}.json`;
      document.body.appendChild(a); a.click();
      studyDataFeedback("已发起备份下载，请确认文件已保存。");
      toast("已发起备份下载");
    } catch {
      studyDataFeedback("备份下载失败，请检查浏览器的下载设置后重试。");
    } finally {
      a.remove();
      if (url) setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  };
  $("#importData").onclick = () => $("#importFile").click();
  $("#importFile").onchange = async event => {
    const input = event.target;
    const file = input.files?.[0];
    if (!file) return;
    const importButton = $("#importData");
    importButton.disabled = true;
    studyDataFeedback("正在检查备份…");
    try {
      if (!file.size || file.size > MAX_STUDY_BACKUP_BYTES) {
        throw new Error("请选择 10 MB 以内的非空 JSON 学习备份。");
      }
      const source = await file.text();
      if (!input.isConnected) return;
      const { data, ignoredIds } = parseLearningBackup(source);
      const ignored = ignoredIds.length ? `\n${ignoredIds.length} 个当前题库未收录的题号将被忽略。` : "";
      const summary = `备份含 ${data.attempts.length} 条作答记录、${data.sessions.length} 次练习成绩、${Object.keys(data.wrongBook).length} 道错题。`;
      if (!confirm(`导入将覆盖当前学习记录及主题。\n${summary}${ignored}\n请先导出需要保留的当前进度。确定覆盖并导入？`)) {
        studyDataFeedback("已取消导入。"); return;
      }
      const saved = Store.replace(data);
      applyTheme(Store.data.theme);
      route();
      const message = saved ? "备份已导入并保存。" : "备份已导入，关闭页面前请重新导出备份。";
      studyDataFeedback(message
        + (ignoredIds.length ? ` 已忽略 ${ignoredIds.length} 个当前题库未收录的题号。` : ""));
      toast(saved ? "学习记录已恢复" : "学习记录已恢复，请及时备份");
    } catch (error) {
      studyDataFeedback(`导入失败：${error.message}`);
    } finally {
      input.value = "";
      importButton.disabled = false;
    }
  };
  $("#resetData").onclick = () => {
    if (!confirm("确定清空全部学习记录？此操作不可撤销（可先导出备份）。")) return;
    const saved = Store.reset();
    route();
    studyDataFeedback(saved ? "学习记录已清空。" : "本次页面的学习记录已清空，但浏览器中原有记录未能更新。");
    toast(saved ? "已清空，重新开始" : "本次记录已清空，浏览器保存失败");
  };
};

</script>
</body>
</html>
