<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>马原研习社 · 马克思主义基本原理学习平台</title>
<style>
/* assets/style.css */
/* ============================================================
   马原研习社 · 设计系统
   风格主题：「书斋纸感 × 思政朱红」
   - 纸质暖底 / 朱砂主色 / 鎏金点缀 / 衬线标题
   - 亮暗双主题（CSS 变量驱动）
   详见 DOCUMENTATION.md 第 2 节「视觉风格规范」
   ============================================================ */

/* ---------- 设计令牌（Design Tokens） ---------- */
:root {
  --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;

  --bg: #f5efe3;
  --bg-2: #efe7d6;
  --card: #fffdf7;
  --card-2: #faf5ea;
  --ink: #2b2418;
  --ink-2: #5f5545;
  --mut: #9a8c76;
  --line: #e4d9c3;
  --line-2: #d3c6ab;

  --red: #b3402f;
  --red-deep: #8c2f22;
  --red-soft: #f7e5df;
  --gold: #b98a2e;
  --gold-soft: #f8edd4;
  --green: #3f7d4e;
  --green-soft: #e5efe6;
  --blue: #38618f;
  --blue-soft: #e4ecf6;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 3px rgba(90, 66, 28, .07);
  --shadow: 0 2px 8px rgba(90, 66, 28, .08), 0 14px 34px rgba(90, 66, 28, .09);
  --maxw: 1120px;
}

html[data-theme="dark"] {
  --bg: #171411;
  --bg-2: #1f1a15;
  --card: #25201a;
  --card-2: #2d2720;
  --ink: #ede4d3;
  --ink-2: #c9bda5;
  --mut: #8f8270;
  --line: #3c352a;
  --line-2: #4d4436;

  --red: #e07655;
  --red-deep: #c05137;
  --red-soft: #40271f;
  --gold: #d9a94e;
  --gold-soft: #403420;
  --green: #6fae7d;
  --green-soft: #24382a;
  --blue: #7ba4d8;
  --blue-soft: #22303f;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .35);
  --shadow: 0 2px 8px rgba(0, 0, 0, .4), 0 14px 34px rgba(0, 0, 0, .35);
}

/* ---------- 基础 ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(179, 64, 47, .05), transparent 60%),
    radial-gradient(900px 420px at -10% 30%, rgba(185, 138, 46, .06), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
/* 纸面颗粒纹理：极淡的噪点覆盖层，营造"宣纸"质感（v1.2） */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  background-size: 160px 160px;
  opacity: .045; mix-blend-mode: multiply;
}
html[data-theme="dark"] body::before { mix-blend-mode: screen; opacity: .05; }

/* ---------- 全局质感细节（v1.2） ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--mut); }
html { scrollbar-color: var(--line-2) var(--bg); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
@keyframes viewIn { from { opacity: 0; transform: translateY(12px); } }
.view > * { animation: viewIn .42s cubic-bezier(.21,.7,.3,1) both; }
.view > *:nth-child(2) { animation-delay: .04s; }
.view > *:nth-child(3) { animation-delay: .08s; }
.view > *:nth-child(4) { animation-delay: .12s; }
.view > *:nth-child(n+5) { animation-delay: .16s; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; line-height: 1.3; margin: 0 0 .5em; }
a { color: var(--red); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
code {
  background: var(--card-2); border: 1px solid var(--line);
  padding: .1em .4em; border-radius: 6px; font-size: .9em;
}
::selection { background: rgba(179, 64, 47, .25); }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
/* 顶栏底部朱金渐变细线 */
.topbar::after {
  content: ""; display: block; height: 2px;
  background: linear-gradient(90deg, var(--red), var(--gold) 45%, transparent 80%);
  opacity: .75;
}
.topbar-inner {
  max-width: var(--maxw); margin: 0 auto; padding: 10px 18px;
  display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: baseline; gap: 9px; color: var(--red); flex-shrink: 0; }
/* 朱砂印章徽标：白字方印，微倾斜，如钤印落款 */
.brand-seal {
  align-self: center; width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center; transform: rotate(-4deg);
  background: linear-gradient(150deg, var(--red), var(--red-deep));
  color: #fff8ee; font-family: var(--font-display); font-size: 17px; font-weight: 800;
  box-shadow: 0 3px 8px rgba(140, 47, 34, .35), inset 0 0 0 1.5px rgba(255, 246, 234, .35);
  transition: transform .25s;
}
.brand:hover .brand-seal { transform: rotate(3deg) scale(1.06); }
.brand-name { font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: 1px; }
.brand-sub { font-size: 10px; color: var(--mut); letter-spacing: .18em; text-transform: uppercase; }
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav a {
  color: var(--ink-2); font-size: 14px; padding: 7px 12px; border-radius: 99px;
  white-space: nowrap; transition: all .18s;
}
.nav a:hover { background: var(--red-soft); color: var(--red); }
.nav a.active { background: var(--red); color: #fff8ee; font-weight: 600; }
.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card); color: var(--gold); font-size: 17px; flex-shrink: 0;
  display: grid; place-items: center; transition: transform .2s;
}
.theme-toggle:hover { transform: rotate(25deg) scale(1.08); }
.theme-toggle::before { content: "☾"; }
html[data-theme="dark"] .theme-toggle::before { content: "☀"; }

/* ---------- 通用组件 ---------- */
.view { max-width: var(--maxw); margin: 0 auto; padding: 26px 18px 60px; min-height: 70vh; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 22px;
}
.section-title {
  display: flex; align-items: center; gap: 10px; font-size: 19px; margin: 34px 0 14px;
}
.section-title::before {
  content: ""; width: 4px; height: 20px; border-radius: 2px;
  background: linear-gradient(var(--red), var(--gold));
}
.section-title::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--line-2), transparent);
}
.section-title small {
  font-family: var(--font-body); font-size: 10.5px; color: var(--gold);
  font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
}
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line-2); background: var(--card); color: var(--ink);
  padding: 9px 18px; border-radius: 99px; font-size: 14px; transition: all .18s;
}
.btn:hover { border-color: var(--red); color: var(--red); transform: translateY(-1px); }
.btn.primary {
  background: linear-gradient(135deg, var(--red), var(--red-deep));
  border-color: transparent; color: #fff6ea; font-weight: 600;
  box-shadow: 0 4px 14px rgba(166, 52, 38, .26);
}
.btn.primary:hover { background: linear-gradient(135deg, var(--red-deep), var(--red)); color: #fff;
  transform: translateY(-2px); box-shadow: 0 8px 20px rgba(166, 52, 38, .34); }
.btn.gold { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.btn.small { padding: 5px 13px; font-size: 12.5px; }
.btn:active { transform: translateY(0) scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--card-2); border: 1px solid var(--line); color: var(--ink-2);
  padding: 3px 11px; border-radius: 99px; font-size: 12px;
}
.tag { font-size: 11px; padding: 2px 9px; border-radius: 4px; letter-spacing: .5px; }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.gold { background: var(--gold-soft); color: var(--gold); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.muted { color: var(--mut); }
.empty {
  text-align: center; color: var(--mut); padding: 60px 20px;
  border: 1.5px dashed var(--line-2); border-radius: var(--radius);
}
.grid { display: grid; gap: 16px; }
.toast {
  position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
  background: color-mix(in srgb, var(--ink) 90%, transparent); color: var(--bg);
  padding: 10px 22px; border-radius: 99px;
  border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  backdrop-filter: blur(6px);
  font-size: 13.5px; box-shadow: var(--shadow); z-index: 99;
  animation: fadeUp .25s ease; pointer-events: none;
}
@keyframes fadeUp { from { opacity: 0; transform: translate(-50%, 10px); } }

/* ---------- 首页 ---------- */
.hero {
  display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; align-items: center;
  background: linear-gradient(135deg, var(--card) 60%, var(--red-soft));
  border: 1px solid var(--line); border-radius: 20px; padding: 40px 36px;
  box-shadow: var(--shadow); overflow: hidden; position: relative;
}
/* 马恩双人素描（版画线刻风，白底已转透明 PNG）：
   - 页级水印 .ink-watermark：全站固定于右下，沉浸式衬底（v1.1 新增）
   - 主视觉 .hero-portrait：首页 Hero 右侧，较明显但不抢文字 */
.ink-watermark {
  position: fixed; right: -3vw; bottom: -10vh; width: clamp(300px, 36vw, 540px);
  opacity: .055; pointer-events: none; user-select: none; z-index: -1;
}
html[data-theme="dark"] .ink-watermark { filter: invert(.92); opacity: .085; }
.hero-portrait {
  position: absolute; right: -38px; bottom: -46px; height: 138%;
  opacity: .15; pointer-events: none; user-select: none;
}
html[data-theme="dark"] .hero-portrait { filter: invert(.92); opacity: .17; }
@media (max-width: 920px) { .hero-portrait { height: 100%; right: -70px; opacity: .1; } }
.hero h1 { font-size: 36px; letter-spacing: 1px; margin-bottom: 6px; }
/* 手绘感朱色笔刷下划线 */
.hero h1 em {
  color: var(--red); font-style: normal;
  background: linear-gradient(transparent 60%, rgba(179, 64, 47, .26) 60%);
  background: linear-gradient(transparent 62%, color-mix(in srgb, var(--red) 28%, transparent) 62%);
  padding: 0 2px;
}
.hero .slogan { color: var(--ink-2); margin: 8px 0 24px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
/* 资料徽章带 */
.hero-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.hero-badges span {
  font-size: 11px; padding: 4px 12px; border-radius: 99px; letter-spacing: .5px;
  border: 1px solid var(--line-2); color: var(--ink-2);
  background: color-mix(in srgb, var(--card) 65%, transparent);
}
/* 名言引言带（金线左侧、衬线体） */
.hero-quote {
  margin: 24px 0 0; padding: 12px 18px; max-width: 460px;
  border-left: 3px solid var(--gold); border-radius: 0 12px 12px 0;
  background: color-mix(in srgb, var(--gold-soft) 60%, transparent);
  font-family: var(--font-display); font-size: 14.5px; color: var(--ink-2); line-height: 1.85;
}
.hero-quote span { display: block; font-size: 11px; color: var(--mut); margin-top: 4px; font-family: var(--font-body); }
.stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat-tile {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 10px; text-align: center; transition: all .22s;
}
.stat-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--gold); }
.stat-tile .ic { display: block; font-size: 13px; opacity: .75; margin-bottom: 2px; }
.stat-tile .num {
  font-family: var(--font-display); font-size: 26px; font-weight: 800;
  background: linear-gradient(135deg, var(--red), var(--gold));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.stat-tile .lbl { font-size: 11.5px; color: var(--mut); margin-top: 2px; }
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.feature-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; transition: all .22s; position: relative; overflow: hidden;
  display: block; color: var(--ink);
}
/* 悬停时顶部亮起的朱金光带 */
.feature-card::before {
  content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 3px;
  border-radius: 0 0 99px 99px;
  background: linear-gradient(90deg, var(--red), var(--gold));
  opacity: 0; transform: scaleX(.3); transition: all .25s;
}
.feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--red); }
.feature-card:hover::before { opacity: 1; transform: scaleX(1); }
.feature-card .fi { transition: transform .22s; }
.feature-card:hover .fi { transform: scale(1.12) rotate(-4deg); }
.feature-card .fi {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  font-size: 20px; margin-bottom: 12px;
}
.feature-card h3 { font-size: 16.5px; margin-bottom: 4px; }
.feature-card p { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.feature-card .go { font-size: 12.5px; color: var(--red); font-weight: 600; }
.next-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

/* ---------- 思维导图 ---------- */
.map-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
.map-canvas-wrap {
  background:
    radial-gradient(circle at 1px 1px, var(--line-2) 1px, transparent 0) 0 0 / 26px 26px,
    var(--card);
  border: 1px solid var(--line); border-radius: var(--radius);
  height: 68vh; min-height: 480px; overflow: hidden; position: relative; cursor: grab;
}
.map-canvas-wrap:active { cursor: grabbing; }
.map-tools { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
.map-tools button {
  width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink-2); font-size: 16px; box-shadow: var(--shadow-sm);
}
.map-tools button:hover { color: var(--red); border-color: var(--red); }
.map-node rect {
  fill: var(--card); stroke: var(--line-2); stroke-width: 1.2; rx: 10;
  transition: all .18s; cursor: pointer;
}
.map-node:hover rect { stroke: var(--red); filter: drop-shadow(0 3px 8px rgba(179, 64, 47, .25)); }
.map-node text { font-size: 12.5px; fill: var(--ink); pointer-events: none; }
.map-node .node-pct { font-size: 9.5px; fill: var(--mut); }
.map-node.lv0 rect { fill: var(--red); stroke: var(--red); }
.map-node.lv0 text { fill: #fff4e4; font-weight: 700; font-size: 14px; }
.map-node.lv1 rect { fill: var(--gold-soft); stroke: var(--gold); }
.map-node.has-link rect { stroke-dasharray: 0; }
.map-node .badge-dot { fill: var(--green); }
.map-link { fill: none; stroke: var(--line-2); stroke-width: 1.4; }
.map-toggle { cursor: pointer; }
.map-toggle circle { fill: var(--card-2); stroke: var(--line-2); }
.map-toggle:hover circle { stroke: var(--red); fill: var(--red-soft); }
.map-toggle text { fill: var(--ink-2); font-size: 11px; text-anchor: middle; pointer-events: none; }
.map-panel { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow-y: auto; }
.map-panel h3 { color: var(--red); font-size: 17px; }
.map-panel .notes { font-size: 13px; color: var(--ink-2); max-height: 320px; overflow-y: auto;
  border-left: 3px solid var(--gold-soft); padding-left: 12px; margin: 12px 0; }
.map-panel .notes li { margin-bottom: 5px; }
.map-panel .notes p { margin: 4px 0; }

/* ---------- 刷题 / 题目卡片 ---------- */
.bank-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.bank-card h3 { font-size: 16.5px; margin-bottom: 3px; }
.bank-card .desc { font-size: 12.5px; color: var(--ink-2); min-height: 34px; }
.bank-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.bank-actions { display: flex; gap: 8px; margin-top: 12px; }
.progressline { height: 6px; background: var(--bg-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progressline i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); border-radius: 99px; }

.quiz-shell { max-width: 780px; margin: 0 auto; }
.quiz-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.quiz-progress { flex: 1; height: 5px; background: var(--bg-2); border-radius: 99px; overflow: hidden; min-width: 100px; }
.quiz-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); transition: width .3s; }
.q-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 26px; position: relative; overflow: hidden; }
/* 题卡左侧朱金细缨 */
.q-card::before {
  content: ""; position: absolute; left: 0; top: 22px; bottom: 22px; width: 3.5px;
  border-radius: 0 4px 4px 0; background: linear-gradient(var(--red), var(--gold));
}
.q-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.q-stem { font-size: 16.5px; font-weight: 600; line-height: 1.75; margin: 6px 0 18px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
  background: var(--card-2); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 10px; font-size: 14.5px; color: var(--ink);
  transition: all .16s;
}
.opt:hover:not(:disabled) { border-color: var(--red); background: var(--red-soft); }
.opt .key {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-2);
  background: var(--card);
}
.opt.sel { border-color: var(--red); background: var(--red-soft); }
.opt.sel .key { background: var(--red); border-color: var(--red); color: #fff; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .key { background: var(--green); border-color: var(--green); color: #fff; }
.opt.wrong-pick { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
.opt:disabled { cursor: default; opacity: .92; }
@keyframes shake { 25% { transform: translateX(-4px);} 75% { transform: translateX(4px);} }
.q-feedback { border-radius: var(--radius-sm); padding: 14px 16px; margin: 14px 0 0; font-size: 14px; }
.q-feedback.ok { background: var(--green-soft); border: 1px solid var(--green); }
.q-feedback.bad { background: var(--red-soft); border: 1px solid var(--red); }
.q-analysis { margin-top: 14px; border-top: 1.5px dashed var(--line-2); padding-top: 12px; font-size: 13.5px; color: var(--ink-2); }
.q-analysis h4 { font-size: 13px; color: var(--gold); letter-spacing: 2px; margin-bottom: 6px; }
.q-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }

/* 答题卡模式（闯关/考试） */
.answer-sheet { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0; }
.answer-sheet button {
  width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--card); font-size: 12px; color: var(--ink-2); transition: all .15s;
}
.answer-sheet button.done { background: var(--red); border-color: var(--red); color: #fff; }
.answer-sheet button.cur { outline: 2px solid var(--gold); }

.mm-spiral text { font-size: 13px; fill: var(--red); font-family: var(--font-body); }
.mm-spiral .mm-spiral-sub { font-size: 10px; fill: var(--ink-2); }
.mm-sublation { display: flex; justify-content: center; gap: 12px; color: var(--gold); font-size: 12px; border-top: 1px solid var(--line); padding-top: 9px; margin-top: 10px; font-weight: 600; }
.mm-sublation span { font-size: 11px; font-weight: 400; color: var(--ink-2); }
.mm-traits { display: grid; grid-template-columns: 1fr 1fr 10px 42px; align-items: center; gap: 4px; font-size: 9.5px; }
.mm-traits > span { border: 1px solid var(--gold); background: var(--gold-soft); padding: 6px 2px; text-align: center; border-radius: 4px; }
.mm-traits > div { display: grid; gap: 4px; }
.mm-traits > div span { border: 1px solid var(--line); padding: 5px 3px; text-align: center; border-radius: 4px; }
.mm-traits b { color: var(--red); font-size: 39px; font-weight: 300; }
.mm-traits strong { color: var(--red); text-align: center; }
@media (min-width: 1400px) { .view:has(.mm-workspace) { max-width: 1280px; } .mm-layout { grid-template-columns: minmax(0,1fr) 370px; } }
@media (max-width: 1050px) { .mm-layout { grid-template-columns: minmax(0,1fr) 310px; } .mm-reader-head { flex-wrap: wrap; } .mm-expand-tools { margin-left: auto; } }
@media (max-width: 850px) { .mm-layout { grid-template-columns: minmax(0,1fr); } .mm-panel { position: static; max-height: none; } .mm-panel h3 { font-size: 21px; } .mm-notes { font-size: 14px; } .mm-note-branch > summary { font-size: 14px; } .mm-process small { font-size: 10px; } .mm-negation-process { grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; } .mm-negation-process > span { max-width: 90px; } .mm-negation-process small { display: block; margin-left: 0; } .mm-diagram { max-width: 600px; } .mm-spiral { max-width: 420px; margin: 12px auto 0; } .mm-traits { font-size: 12px; grid-template-columns: 1fr 1fr 15px 65px; } }
@media (max-width: 600px) { .mm-heading { flex-wrap: wrap; gap: 8px; margin-bottom: 14px; } .mm-heading h2 { font-size: 23px; } .mm-total { font-size: 10px; } .mm-controls { flex-wrap: wrap; gap: 9px; } .mm-search-field { flex-basis: 100%; } .mm-search-field input { font-size: 12px; } .mm-mode { width: 100%; } .mm-mode button { flex: 1; min-height: 40px; } .mm-branches { gap: 6px; margin: 12px 0; } .mm-branches button { font-size: 11px; padding: 7px 9px; flex: 1 0 40%; justify-content: center; } .mm-reader-head { padding: 12px; } .mm-expand-tools { width: 100%; margin: 0; } .mm-expand-tools button { flex: 1; min-height: 38px; font-size: 11px; } .mm-canvas { height: 480px; min-height: 480px; } .mm-zoom-tools .mm-fit { font-size: 10px; padding: 0 7px; } .mm-canvas-help { font-size: 9px; } .mm-outline { max-height: 62vh; min-height: 350px; padding: 7px; } .mm-outline ul { padding-left: 13px; } .mm-outline li > ul { margin-left: 12px; } .mm-outline-label { font-size: 13px; } .mm-panel { padding: 18px 15px; } .mm-panel h3 { font-size: 19px; } .mm-note-branch { padding-left: 8px; } .mm-note-body .mm-note-branch { margin-left: 0; } .mm-result-items { grid-template-columns: minmax(0,1fr); } .mm-results-head { flex-wrap: wrap; gap: 5px; } .mm-results-head > span { font-size: 9px; } .mm-results-head > button { min-height: 32px; } .mm-negation-process { grid-template-columns: 1fr; } .mm-negation-process > span { max-width: none; } .mm-negation-process small { display: inline; margin-left: 5px; } .mm-traits { font-size: 10px; grid-template-columns: 1fr 1.2fr 10px 46px; } }
@media (prefers-reduced-motion: reduce) { .mm-workspace * { scroll-behavior: auto; } }
@media (min-width: 601px) and (max-width: 850px) { .mm-negation-process { --mm-flow-arrow: "→"; } }
@media (max-width: 600px) { .mm-search-field input { font-size: 16px; } }

window.MAYUAN_DATA = {"questions":[{"id":"c1s1-q1-01","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":1,"type":"judge","stem":"朴素唯物主义把物质等同于物质的微观结构层次——原子。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"analysis":"- 朴素唯物主义认为世界的本原是某种具体的物质形态（如水、火、气、土等），它把物质等同于具体的物质形态。\n- 近代形而上学唯物主义（机械唯物主义）才把物质等同于物质的微观结构层次——原子，认为原子的属性就是物质的属性。\n- 题干将\"朴素唯物主义\"与\"近代形而上学唯物主义\"混淆了，故判断为错误。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-02","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":2,"type":"single","stem":"恩格斯总结和概括了哲学发展特别是近代哲学发展的历史事实，第一次明确指出，哲学的基本问题是（）","options":[{"key":"A","text":"社会存在和社会意识的关系问题"},{"key":"B","text":"思维与存在的关系问题"},{"key":"C","text":"主体与客体的关系问题"},{"key":"D","text":"内在世界和外在世界的关系问题"}],"answer":["B"],"analysis":"- 恩格斯在《路德维希·费尔巴哈和德国古典哲学的终结》中明确指出：\"全部哲学，特别是近代哲学的重大的基本问题，是思维和存在的关系问题。\"\n- A 项\"社会存在和社会意识的关系问题\"是历史观的基本问题，而非整个哲学的基本问题。\n- B 项\"思维与存在的关系问题\"正是哲学基本问题的标准表述。\n- C、D 项不是哲学基本问题的标准表述。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-03","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":3,"type":"single","stem":"对哲学基本问题第二个方面的不同回答，可划分为（）的对立。","options":[{"key":"A","text":"唯物主义和唯心主义"},{"key":"B","text":"一元论和二元论"},{"key":"C","text":"辩证法与形而上学"},{"key":"D","text":"可知论和不可知论"}],"answer":["D"],"analysis":"哲学基本问题包括两个方面：\n1. 第一方面：思维和存在何者为本原的问题。对这一方面的不同回答，划分为**唯物主义和唯心主义**的对立。\n2. 第二方面：思维和存在有没有同一性的问题（即思维能否正确认识存在的问题）。对这一方面的不同回答，划分为**可知论和不可知论**的对立。\n\nA 项是第一方面的划分，D 项是第二方面的划分，故选 D。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-04","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":4,"type":"single","stem":"恩格斯关于辩证唯物主义\"物质\"范畴的来源时说\"物质无非是各种物的总和，而这个概念就是从这一总和中抽象出来的\"，这一来源是通过（）来界定的。","options":[{"key":"A","text":"哲学与具体科学"},{"key":"B","text":"物质与意识"},{"key":"C","text":"主体与客体"},{"key":"D","text":"一般与个别"}],"answer":["D"],"analysis":"- 恩格斯的这句话表明，\"物质\"这个哲学范畴是从各种具体事物（各种物的总和）中抽象出来的共同本质。\n- 这里的\"各种物\"是个别、具体，\"物质\"是一般、抽象，因此这是通过**一般与个别**的关系来界定的。\n- A 项\"哲学与具体科学\"的关系虽与此相关，但最直接、最贴切的是\"一般与个别\"。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-05","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":5,"type":"single","stem":"唐代诗人王勃说\"天波易谢，寸暑难留\"；曾国藩也用\"日月既往，不可复追\"劝勉人们。从哲学的角度，他们的这些话都说明了（）","options":[{"key":"A","text":"时间的客观性"},{"key":"B","text":"时间的绝对性"},{"key":"C","text":"时间的相对性"},{"key":"D","text":"时间的一维性"}],"answer":["D"],"analysis":"- \"天波易谢，寸暑难留\"与\"日月既往，不可复追\"均强调时间一旦流逝便无法挽回，突出时间的**不可逆性**与**一去不返**。\n- 在哲学范畴中，时间的**一维性**正是指时间只能沿着一个方向（从过去到未来）单向流动，不能倒流或重复，这与两句诗文的核心含义完全契合。\n- A 项客观性、B 项绝对性、C 项相对性都不能准确概括\"不可复追\"的核心含义。\n\n故正确答案为 D. 时间的一维性。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-06","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":6,"type":"single","stem":"著名肿瘤专家、上海中医药大学何裕民教授说:“工作中遇到很多病人,没查出癌症之前一切都好好的,当得知自己得了癌症,身体反而一天不如一天。”据介绍,临床至少有两三成的病症患者是死于严重的心理休克和极度的恐惧、悲观、绝望等恶劣情感的。这反映出意识具有（）","options":[{"key":"A","text":"目的性和计划性"},{"key":"B","text":"创造性"},{"key":"C","text":"指导实践改造客观世界的作用"},{"key":"D","text":"调控人的行为和生理活动的作用"}],"answer":["D"],"analysis":"- 题干中恶劣情感（意识）导致身体（生理活动）变差，体现了意识对人体生理活动的调节和控制作用。\n- A 项目的性和计划性、B 项创造性、C 项指导实践改造客观世界的作用，均不符合题意。\n- D 项\"调控人的行为和生理活动的作用\"完全契合。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-07","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":7,"type":"single","stem":"一切从实际出发，是（）在现实生活和实际工作中的生动体现。","options":[{"key":"A","text":"物质和意识的辩证关系原理"},{"key":"B","text":"世界的物质统一性原理"},{"key":"C","text":"发展原理"},{"key":"D","text":"矛盾的特殊性原理"}],"answer":["B"],"analysis":"- 世界的物质统一性原理是马克思主义哲学的基石，一切从实际出发是唯物主义的根本要求，也是世界物质统一性原理在现实生活和实际工作中的生动体现。\n- A 项物质和意识的辩证关系原理侧重于方法论，其根本基础仍是物质统一性。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-08","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":8,"type":"multi","stem":"明末清初思想家王夫之认为\"静者静动，非不动也\"，\"静即含动，动不舍静\"，这在哲学上表达了（）","options":[{"key":"A","text":"静止是事物的根本属性"},{"key":"B","text":"运动是绝对的，静止是相对的"},{"key":"C","text":"静止是运动的特殊状态"},{"key":"D","text":"运动与静止相互依赖、相互渗透"}],"answer":["B"],"analysis":"- 这句话强调了运动和静止的辩证统一关系。\n- A 项错误，运动才是事物的根本属性，而非静止。\n- B 项正确，体现了运动是绝对的、静止是相对的。\n- C 项正确，\"静者静动\"说明静止是运动的特殊状态。\n- D 项正确，\"静即含动，动不舍静\"说明二者相互依赖、相互渗透。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-09","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":9,"type":"multi","stem":"人类历史上的每一次科技革命都与材料的发展息息相关，而新材料的研制却是颇为不易的。人工智能可以借助数据共享,对先进材料的物理化学性质进行预测、筛选,从而加快新材料的合成和生产。作为人工智能的一个分支，机器学习算法在辅助新材料设计时尤为“得力”，其工作过程主要包括“描述符”生成、模型构建和验证、材料预测、实验验证等步骤。人工智能辅助新材料研发的过程表明（）","options":[{"key":"A","text":"科学研究能够任意改变物质的性质和结构"},{"key":"B","text":"人工智能够取代人类对物质世界的认识"},{"key":"C","text":"人类对物质的认识是一个不断深化的过程"},{"key":"D","text":"具体的物质结构和性质的变化并不改变世界的物质性"}],"answer":["C"],"analysis":"- A 项错误，\"任意改变\"违背了客观规律。\n- B 项错误，人工智能不能取代人类的认识。\n- C 项正确，借助人工智能研发新材料，说明人类对物质的认识在不断深化。\n- D 项正确，新材料的合成及其性质变化依然是物质世界的变化，并不改变世界的物质性。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q1-10","bank":"c1s1-q1","bankName":"第一章第一节 · 课堂小测1","num":10,"type":"multi","stem":"虚拟现实技术是一种运用计算机仿真系统创建多源信息融合的交互式三维动态实景以及动作仿真的技术,可以给使用者提供沉浸性、多感知性、交互性的互动体验,虚拟现实技术所构造的虚拟环境说明（）","options":[{"key":"A","text":"物质世界不再具有客观实在性"},{"key":"B","text":"物质世界存在形式具有多样性"},{"key":"C","text":"信息是独立于物质和意识的第三种存在状态"},{"key":"D","text":"人们可以通过实践创造出自然界原本不存在的现实状态"}],"answer":["B"],"analysis":"- A 项错误，物质世界依然具有客观实在性，虚拟环境不能否定这一点。\n- B 项正确，虚拟环境是物质世界存在形式多样性的体现（人化自然）。\n- C 项错误，信息不是独立于物质和意识的第三种状态，它依赖于物质。\n- D 项正确，虚拟现实技术通过实践创造出自然界原本不存在的现实状态（虚拟世界是客观存在的特殊形态）。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测1"},{"id":"c1s1-q2-01","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":1,"type":"single","stem":"基于哲学基本问题,哲学的基本派别是( )","options":[{"key":"A","text":"唯物主义与唯心主义"},{"key":"B","text":"一元论与多元论"},{"key":"C","text":"辩证法与形而上学"},{"key":"D","text":"能动论与机械论 正确答案：A"}],"answer":["A"],"analysis":"1. 哲学的基本问题是**思维和存在的关系问题**，包含两方面：第一，思维和存在何者为本原（第一性）；第二，思维和存在有无同一性。\n2. 根据思维与存在何者是本原这一划分依据，划分出哲学两大基本派别：**唯物主义（物质第一性，意识第二性）和唯心主义（意识第一性，物质第二性）**。\n3. B选项一元论/多元论是讨论世界本原是一个还是多个；C选项辩证法和形而上学回答世界“怎么样”（世界是否运动发展），不是哲学基本问题划分出来的基本派别；D能动论、机械论是旧唯物主义内部关于意识作用的区分。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s1-q2-02","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":2,"type":"single","stem":"中国古代的八卦说认为,自然界中的八种东西作为世界的本原,天(乾)地(坤)雷(震)风(巽)水(坎)火(离)山(艮)泽(兑)八种东西两两组合,构成64卦384爻,由此派生出世间万物。这种观点是( )","options":[{"key":"A","text":"机械唯物主义"},{"key":"B","text":"朴素唯物主义"},{"key":"C","text":"主观唯心主义"},{"key":"D","text":"客观唯心主义 正确答案：B"}],"answer":["B"],"analysis":"1. **古代朴素唯物主义**：把世界本原归结为一种或者几种具体的实物（金木水火土、八卦的八种自然事物等），是古代人的朴素看法。\n2. 本题把天地雷风水火山泽这八种具体自然物质当作万物本原，属于朴素唯物主义。\n3. A机械唯物主义（近代形而上学唯物主义）把本原归结为原子；C主观唯心主义把本原归为人的主观感觉、心灵；D客观唯心主义把本原归结为理念、绝对精神、天命，均不符合题意。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s1-q2-03","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":3,"type":"single","stem":"马克思主义哲学关于物质范畴的正确理解是()","options":[{"key":"A","text":"物质是各种实物的总和"},{"key":"B","text":"物质范畴是从各种物的总和中抽象出来的"},{"key":"C","text":"物质的唯一特性是它可以被感知"},{"key":"D","text":"物质是自然界中具体的物质形态 正确答案：B"}],"answer":["B"],"analysis":"1. 马克思主义的**物质范畴是哲学上的抽象概念**，不是一个个具体实物简单相加总和；是从无数具体物质形态当中抽象概括出来共同的本质——**客观实在性**。\n2. A错误：不是实物简单相加的总和；B正确，物质是从全部具体事物总和抽象得到哲学概念。\n3. C错误：物质的唯一特性是**客观实在性**，不是可以被感知；可以被感知是人的认识能力。\n4. D错误：混淆哲学物质范畴和自然界具体物质形态；哲学物质概括整个世界（自然界+人类社会）的共同本质，不等同于某一类具体物质形态。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s1-q2-04","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":4,"type":"single","stem":"中国古代哲学家荀子说:“心不使焉,则白黑在前而目不见,雷鼓在侧而耳不闻。”这句话表明人的意识具有( )","options":[{"key":"A","text":"客观性"},{"key":"B","text":"能动性"},{"key":"C","text":"对象性"},{"key":"D","text":"任意性 正确答案：B"}],"answer":["B"],"analysis":"1. 译文：如果人的心智（心思、意识）不去发动、不去主动发挥作用，就算黑白颜色摆在眼前，眼睛也看不见；雷声鼓响就在耳边，耳朵也听不见。\n2. 这句话体现**意识的能动性（自觉选择性）**：人的意识不是被动接收外界刺激；意识活动具有目的性、选择性，需要意识主动调动，人才会去感知对象。\n3. A错误：意识属于主观范畴，不具有客观性；C对象性不是意识的特性；D任意性错误，意识不能随心所欲任意发挥，意识受客观事物制约。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s1-q2-05","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":5,"type":"multi","stem":"关于物质的存在方式,以下理解正确的有( )","options":[{"key":"A","text":"物质的根本属性是运动"},{"key":"B","text":"相对静止体现了物质运动的稳定性"},{"key":"C","text":"绝对运动和相对静止是绝对对立的关系"},{"key":"D","text":"时间和空间是运动着的物质的基本存在形式 正确答案：A,B,D"}],"answer":["A"],"analysis":"1. A 正确：运动是物质的根本属性和存在方式，物质离不开运动。\n2. B 正确：相对静止是运动的特殊状态，指事物在一定条件下暂时的稳定，体现运动当中的稳定性。\n3. C 错误：绝对运动与相对静止**是对立统一，不是绝对对立**；动中有静，静中有动。\n4. D 正确：马克思主义观点：时间、空间是运动着的物质的基本存在形式；时空离不开运动的物质。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s1-q2-06","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":6,"type":"multi","stem":"时间是万事万物存在的刻度。1秒钟,电影放映24帧画面,猎豹在草原上飞奔28米,蜂鸟振动翅膀55次;1分钟,登山队员攀登珠峰顶峰58.3厘米,“复兴号”前进5833米。时间创造无限可能。有人努力奔跑,用全力以赴的冲刺突破极限;有人砥砺前行,以日复一日的坚守辛勤耕耘。原本匀速流动的时间,正是在生生不息的奋斗中,在昂扬奋发的进取中,确定意义、体现价值,进而定义生命的精彩、定格历史的脉动。人们在奋斗中“定义时间”,说明时间是( )","options":[{"key":"A","text":"测量事物运动的客观尺度"},{"key":"B","text":"物质运动的存在形式"},{"key":"C","text":"事物运动的主观联想"},{"key":"D","text":"与物质运动不可分割的 正确答案：A,B,D"}],"answer":["A"],"analysis":"1. A 正确：时间是事物运动延续性的客观刻度，可以衡量运动持续多久。题目列举1秒、1分钟不同物体运动距离，体现时间作为客观测量尺度。\n2. B 正确：时间是运动着的物质的存在形式，属于马原基本结论。\n3. C 错误：错误，时间具有客观性，**不是人的主观联想**，不以人的想法转移。\n4. D 正确：时间离不开物质运动；时间和物质运动不可分割，没有脱离物质运动纯粹的时间。\n>补充：题目“奋斗中定义时间”指人在实践奋斗赋予时间**价值意义**，并没有否定时间本身的客观性。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s1-q2-07","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":7,"type":"multi","stem":"长江的年龄到底有多大?这里说的长江“年龄”,是指从青藏高原奔流而下注入东海的“贯通东流”水系的形成年代。如果说上游的沉积物从青藏高原、四川盆地顺流而下能到达下游,这就表明长江贯通了,这就是物源示踪。我国科学家采用这一方法,研究长江中下游盆地沉积物的来源,从而判别长江上游的物质何时到达下游,间接指示了长江贯通东流的时限。他们经过10多年的研究,提出长江贯通东流的时间距今约2300多万年。这一研究成果从一个侧面显示出( )","options":[{"key":"A","text":"时间和空间是有限的,物质运动是永恒的"},{"key":"B","text":"时间和空间是通过物质运动的变化表现出来的"},{"key":"C","text":"时间和空间是指标示物质运动的观念形式"},{"key":"D","text":"时间和空间是物质运动的存在形式 正确答案：B,D"}],"answer":["B"],"analysis":"1. A 错误：表述混淆。**具体事物的时空有限；整个物质世界的时空是无限的**；选项笼统说“时间和空间是有限的”错误。\n2. B 正确：科学家依靠沉积物（物质运动）去推断长江形成的时间；说明时间、空间要借助物质运动变化才能表现出来。\n3. C 错误：错误，时空是**客观存在的物质运动存在形式，不是人的观念形式**；观念形式属于唯心主义看法。\n4. D 正确：时间空间是物质运动的存在形式，长江水系（物质运动）有自己形成发展的时间，印证这个原理。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s1-q2-08","bank":"c1s1-q2","bankName":"第一章第一节 · 课堂小测2","num":8,"type":"multi","stem":"自1995年起在黄海、东海,1999年起在南海,三大海区连续实行伏季休渔制度。伏季休渔保护了主要经济鱼类的亲体和幼鱼资源,使海洋渔业资源得到休养生息;同时各地区还根据情况进行鱼苗增殖放流,助力鱼类种群数量的恢复和海洋生物群落结构的完善,具有明显的生态效益。渔船在休渔期间节约了成本,休渔结束后,渔获物产量与质量明显得以提升。这说明()","options":[{"key":"A","text":"人们经过努力可以创造出有利于事物发展所需要的条件"},{"key":"B","text":"人们可以认识并利用规律以达到自己的目的"},{"key":"C","text":"自然规律因人的出现而发生改变"},{"key":"D","text":"改造自然的活动需要以尊重自然规律为前提 正确答案：A,B,D"}],"answer":["A"],"analysis":"1. A 正确：实行休渔、人工放流鱼苗，人为创设条件，帮助渔业资源恢复；人可以实践创造有利条件（注意：人不能创造规律，但可以创造条件）。\n2. B 正确：人类认识海洋鱼类繁殖生长的客观规律，实施休渔，最后收获更好渔获，说明可以认识、利用客观规律实现人的实践目的。\n3. C 错误：规律是客观的！**规律不能被人改变、废除或者创造**；自然规律不会因为人出现就改变。\n4. D 正确：想要改造海洋渔业资源，先要尊重鱼类繁殖的自然规律；尊重客观规律是发挥主观能动性的前提。","tags":["第一章","第一节","世界的物质性"],"origin":"第一章第一节 · 课堂小测2"},{"id":"c1s23-01","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":1,"type":"single","stem":"一稻济天下，袁隆平院士所研究的海水稻种植技术克服了水分、土壤等不利条件，为缓解人类水资源、可耕地和粮食三大危机作出了不朽贡献，由此可见（ ）","options":[{"key":"A","text":"自在事物的联系是客观的，不以人的意志为转移"},{"key":"B","text":"联系促进了事物的发展，要善于利用联系推动事物的发展"},{"key":"C","text":"把握事物的联系是人们认识世界和改造世界的根本方法"},{"key":"D","text":"人为事物的联系具有“人化”的特点，是主观的"}],"answer":["B"],"analysis":"海水稻技术把原本不利于水稻生长的水分、土壤条件，通过人的实践活动改造为有利于人类的条件，说明联系促进事物的发展，人应当善于利用联系推动事物发展。A项“自在事物的联系是客观的”本身正确，但题干强调的是人对联系的利用，与题意不符；C项错误，认识世界和改造世界的根本方法是矛盾分析法（对立统一规律），不是“把握事物的联系”；D项错误，人为事物的联系虽然具有“人化”特点，但一经形成便独立于人的意识之外，仍然是客观的，不能说是主观的。故选 B。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第1题 · 单选题"},{"id":"c1s23-02","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":2,"type":"single","stem":"中国探月工程经历了多个重要阶段。嫦娥一号至嫦娥五号探测器分别实现了绕月探测、月球软着陆、自动巡视勘测和月球样品自动取样返回等目标。2024年6月25日，嫦娥六号在人类历史上首次实现月球背面采样返回。20多年来，中国航天人久久为功，创造了一个又一个奇迹，我们正迈向航天强国。中国探月工程的推进说明了（ ）","options":[{"key":"A","text":"事物的发展就是一个量的不断积累的过程"},{"key":"B","text":"要在辩证否定中实现事物的发展"},{"key":"C","text":"要善于突破规律，根据需要建立新的联系"},{"key":"D","text":"离开了人的主观能动性，量变不会引起质变"}],"answer":["B"],"analysis":"从绕月探测、软着陆、巡视勘测到月球背面采样返回，每一个新阶段都既继承了前一阶段的技术积累，又突破了原有局限、实现了新的飞跃，是辩证否定即“扬弃”的过程，说明事物的发展要在辩证否定中实现。A项片面，事物发展是量变与质变的统一，不只是量的积累；C项错误，规律是客观的，不能“突破规律”，人只能在尊重客观规律的基础上建立新的具体联系；D项错误，量变引起质变是客观规律，不依赖于人的主观能动性。故选 B。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第2题 · 单选题"},{"id":"c1s23-03","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":3,"type":"single","stem":"《吕氏春秋·荡兵》中写道：“夫有以噎死者，欲禁天下之食，悖。”此举悖在（ ）","options":[{"key":"A","text":"否定旧事物"},{"key":"B","text":"辩证的否定观"},{"key":"C","text":"错误地肯定一切"},{"key":"D","text":"形而上学的否定观"}],"answer":["D"],"analysis":"因为有人吃饭噎死就要禁止天下人吃饭，这是抓住事物的一方面弊端就全盘否定、要么肯定一切要么否定一切的典型表现，属于形而上学的否定观。B项辩证的否定观是马克思主义的主张，与题干“悖”（荒谬、错误）的定性相悖；A项否定旧事物、C项错误地肯定一切均与题意不符——此处错在“错误地否定一切”。故选 D。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第3题 · 单选题"},{"id":"c1s23-04","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":4,"type":"single","stem":"习近平强调，要“树立大农业观、大食物观，向耕地草原森林海洋、向植物动物微生物要热量、要蛋白，全方位多途径开发食品资源”，“既向陆地要食物，也向海洋要食物，耕海牧渔，建设海上牧场、蓝色粮仓”，构建多元化食物供给体系。“大农业观”“大食物观”突出体现的思维方式是（ ）","options":[{"key":"A","text":"极限思维"},{"key":"B","text":"历史思维"},{"key":"C","text":"系统思维"},{"key":"D","text":"逆向思维"}],"answer":["C"],"analysis":"“大农业观”“大食物观”把耕地、草原、森林、海洋与植物、动物、微生物看作一个相互联系的有机整体，强调全方位多途径开发、构建多元化食物供给体系，着眼于整体功能和整体优化，体现的正是用系统观点看问题、统筹全局的系统思维。A项极限思维、B项历史思维、D项逆向思维均不符合题干主旨。故选 C。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第4题 · 单选题"},{"id":"c1s23-05","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":5,"type":"single","stem":"一个地方的气候主要取决于纬度、海陆位置、地形以及大气环流和洋流等因素。纬度、海陆位置、地形等因素在一定时期内基本保持不变。大气环流和洋流二者相互作用就形成相对稳定的气候状态。但当其中一个因素突然“掉链子”，就会发生厄尔尼诺之类的异常现象。厄尔尼诺现象不仅推高全球变暖幅度，更可能导致频次更多、范围更广、强度更大的极端天气，进而影响全球气候。厄尔尼诺现象对全球气候的影响表明，偶然因素是（ ）","options":[{"key":"A","text":"决定事物发展趋势的根本性因素"},{"key":"B","text":"事物发展中可有可无的影响因素"},{"key":"C","text":"事物发展中不可忽视的影响因素"},{"key":"D","text":"事物发展中确定不移的因素"}],"answer":["C"],"analysis":"大气环流和洋流中某一因素突然“掉链子”引发厄尔尼诺，属于偶然因素，但它能推高全球变暖幅度、导致更多更强的极端天气，说明偶然因素虽然在事物发展中处于从属地位，却会影响发展的进程和特点，是不可忽视的影响因素。A项错误，决定事物发展趋势的是必然因素，即事物内部的根本矛盾；B项错误，偶然因素会使发展的确定趋势带有特点和偏差，并非可有可无；D项“确定不移”描述的是必然因素。故选 C。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第5题 · 单选题"},{"id":"c1s23-06","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":6,"type":"single","stem":"“橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”橘逾淮为枳说明了（ ）","options":[{"key":"A","text":"事物的发展变化以时间地点和条件为转移"},{"key":"B","text":"事物的普遍联系是通过中介来实现的"},{"key":"C","text":"任何实体事物都是普遍联系之网上的一个网络"},{"key":"D","text":"事物的变化和发展是一个过程"}],"answer":["A"],"analysis":"同样是橘树，生在淮南结橘、生在淮北成枳，味道由甘甜变为酸涩，原因在于“水土异也”——时间、地点和条件发生了变化，事物也随之变化，说明事物的发展变化以时间、地点和条件为转移，联系具有条件性。B项强调联系的中介、C项强调事物是联系之网上的网络、D项强调变化发展是一个过程，三者本身表述都正确，但都没有点出条件变化导致事物性质改变这一关键，与题意不符。故选 A。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第6题 · 单选题"},{"id":"c1s23-07","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":7,"type":"single","stem":"“马者所以命形也；白者所以命色也，命色者非命形也，故曰白马非马。”从唯物辩证法的观点看，“白马非马”这一命题的错误在于（ ）","options":[{"key":"A","text":"颠倒了事物形态的功能之间的关系"},{"key":"B","text":"割裂了事物共性和个性之间的联系"},{"key":"C","text":"混淆了事物内容和形式之间的区别"},{"key":"D","text":"模糊了事物本质和现象之间的联系"}],"answer":["B"],"analysis":"“白马”是个性、个别，“马”是共性、一般。公孙龙只看到二者的差别而否认二者的联系，把共性与个性割裂开来。共性寓于个性之中，一般只能通过个别而存在，没有脱离个性的纯粹共性，因此“白马非马”是错误的。A项形态与功能、C项内容与形式、D项本质与现象三对范畴与题意均不相干。故选 B。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第7题 · 单选题"},{"id":"c1s23-08","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":8,"type":"single","stem":"《百喻经》中有一则寓言，有一个愚人到别人家去做客，他嫌菜没有味道，主人就给他加了点盐。菜里加了盐以后，味道好极了，愚人就想：“菜之所以鲜美，是因为有了盐，加一点点就如此鲜美，如果加更多的盐岂不是更加好吃？”回家以后，他把一把盐放进嘴里，结果又苦又咸，这则寓言给我们的启示是（ ）","options":[{"key":"A","text":"持续的量变会引起事物发生质的变化"},{"key":"B","text":"在认识和处理问题时要掌握适度的原则"},{"key":"C","text":"在事物的发展过程中要时时注意事物的自我否定"},{"key":"D","text":"不可能通过一些现象而去认识某个事物的本质"}],"answer":["B"],"analysis":"盐能调味，但用量超过一定的度，鲜美就变成了又苦又咸，说明任何事物的存在都有一个度的界限，在认识和处理问题时必须把握事物的度、掌握适度原则。A项虽然涉及量变质变，但寓言强调的是“过了度”而不是“持续积累”，且量变只有积累到一定程度才引起质变，A项表述不严谨；C项事物的自我否定、D项现象与本质的关系均与题意无关。故选 B。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第8题 · 单选题"},{"id":"c1s23-09","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":9,"type":"multi","stem":"近年来，很多工业遗址“变身”创意园区、景观公园、博物馆，成为火爆一时的网红打卡地。文化的力量、温度，使那些被岁月侵蚀的斑驳“锈带”，因吸收时代元素而焕发崭新容颜，成为宜业、宜居、宜乐、宜游的多彩“秀带”。这启示我们要（ ）","options":[{"key":"A","text":"发挥意识的主动创造性，赋予物质新的属性"},{"key":"B","text":"把吸收、改造旧事物的合理因素作为创新的基础"},{"key":"C","text":"把握和利用事物的多样价值，满足人们的需求"},{"key":"D","text":"坚持了辩证否定观，在事物之间的否定与扬弃中发展"}],"answer":["B","C"],"analysis":"工业遗址的“锈带”之所以能变成“秀带”，是在保留原有风貌这一合理因素的基础上融入时代元素实现的，说明创新要以吸收、改造旧事物中的合理因素为基础（B）；同时把工业遗址改造为创意园区、景观公园、博物馆，发挥其多种功能，说明要把握和利用事物的多样价值，满足人们的需要（C）。A项错误，物质的属性是客观的，意识不能凭空“赋予物质新的属性”，只能在尊重客观规律的基础上加以利用；D项错误，辩证否定是事物自身的否定即自我否定，表述为“事物之间的否定与扬弃”不准确，且与题干主旨不符。故选 BC。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第9题 · 多选题"},{"id":"c1s23-10","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":10,"type":"multi","stem":"人的成长，没有永远的“顺境”，也没有绝对的“逆境”。面对困难挫折，是一蹶不振、消极“躺平”，还是保持振作、迎难而上；取得成绩后，是沾沾自喜、骄傲自满，还是谦虚谨慎、砥砺前行，决定着发展的稳健和长远。“躺平”不会“躺赢”，奋斗才是良方，这启示我们（ ）","options":[{"key":"A","text":"要在尊重客观规律的基础上发挥主观能动性"},{"key":"B","text":"只要发挥主观能动性、努力作为就能取得成功"},{"key":"C","text":"对未来充满信心，不断克服前进道路上的困难"},{"key":"D","text":"坚持自我肯定与自我否定，在二者统一中实现发展"}],"answer":["A","C","D"],"analysis":"面对顺境逆境都保持振作、迎难而上，说明事物发展是前进性与曲折性的统一，要对未来充满信心，不断克服前进道路上的困难（C）；取得成绩仍谦虚谨慎，说明要坚持自我肯定与自我否定的统一，在二者统一中实现发展（D）；“奋斗才是良方”则要求在尊重客观规律的基础上正确发挥主观能动性（A）。B项错误，发挥主观能动性、努力作为是取得成功的必要条件而非充分条件，还须尊重客观规律、具备一定的客观条件。故选 ACD。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第10题 · 多选题"},{"id":"c1s23-11","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":11,"type":"multi","stem":"2017年6月，我国科学家利用“墨子号”量子科学实验卫星在国际上率先成功实现了千公里级的星地双向量子纠缠分发。“量子纠缠”就是两个（或多个）粒子共同组成的量子状态，无论粒子之间相隔多远，测量其中一个粒子必然会影响其他粒子。“量子纠缠”现象虽然未被完全认知，但它仍然能够说明（ ）","options":[{"key":"A","text":"世界的真正统一性在于它的物质性"},{"key":"B","text":"事物联系的主观性和偶然性"},{"key":"C","text":"事物联系的复杂性和多样性"},{"key":"D","text":"物质世界联系的客观性和普遍性"}],"answer":["A","C","D"],"analysis":"量子纠缠现象表明，无论相隔多远，对其中一个粒子的测量都会影响其他粒子，这说明物质世界之间的联系是客观的、普遍的（D），联系的形式是复杂多样的（C），而这一切的载体都是客观存在的物质，世界的真正统一性在于它的物质性（A）。B项错误，联系是客观的，不以人的意志为转移，把联系归结为“主观性和偶然性”是唯心主义观点。故选 ACD。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第11题 · 多选题"},{"id":"c1s23-12","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":12,"type":"single","stem":"货币，作为商品交换的媒介，在生活中充当着非常重要的角色。中国是世界上最早使用货币的国家之一，在漫长的岁月中，货币的表现形式从最早的贝币，到铜制海贝，再到北宋时期的交子，经历了由原始货币到金属货币再到纸币的演变。随着现代信用制度和电子技术的发展，货币形式的发展从有形到无形。2022年数字人民币逐渐走入公众的视野。和纸币一样，数字货币有面额、可支付。不同的是，数字人民币更为便捷、安全、发行成本更低、利于保护隐私、计算流动需求避免货币超发、跨境交易且不受网络连通的限制更加稳定，因而具有更广阔的应用前景。在可预见的未来，随着数字人民币推广进程加快，我们将再一次感受货币变革带来的便利与惊喜。将本案例结合辩证法的发展原理，理解不正确的是（ ）","options":[{"key":"A","text":"发展是事物变化中前进的、上升的运动"},{"key":"B","text":"新事物有新的要素、结构和功能，能适应已经变化了的环境和条件"},{"key":"C","text":"新事物否定了旧事物中消极腐朽的东西，保留了旧事物中合理的、适应新条件的因素"},{"key":"D","text":"新出现的事物充满时代特征，必然是新事物"}],"answer":["D"],"analysis":"本题要求选出“理解不正确”的一项。货币形态由贝币到金属货币、再到纸币和数字人民币，是由低级到高级、由有形到无形的前进上升运动（A正确）；数字人民币在保留货币交换媒介这一本质的同时，具备更便捷、安全、成本更低等新要素和新功能，适应了数字经济时代的环境和条件（B正确）；它克服了纸币的某些局限又保留了货币的一般职能，体现了辩证否定即“扬弃”（C正确）。D项错误，新事物是指符合事物发展的必然趋势、具有强大生命力的事物，不能以出现时间的先后判断新旧，“新出现的事物”未必是新事物。故选 D。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第12题 · 单选题"},{"id":"c1s23-13","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":13,"type":"single","stem":"西方有一首描述战争的童谣：“钉子缺，蹄铁卸；蹄铁卸，战马蹶；战马蹶，骑士绝；骑士绝，战事折；战事折，国家灭。”这首童谣包含的哲学原理是（ ）","options":[{"key":"A","text":"事物是不断变化的"},{"key":"B","text":"事物的量变引起质变"},{"key":"C","text":"事物的现象表现事物的本质"},{"key":"D","text":"事物之间普遍联系"}],"answer":["D"],"analysis":"一颗钉子缺失，引发蹄铁脱落、战马跌倒、骑士阵亡、战事失利直至国家灭亡的连锁反应，说明事物之间以及事物内部各要素之间是相互影响、相互制约的，即事物之间普遍联系，要求我们用联系的观点看问题。B项量变引起质变虽有一定相关性，但童谣突出的是环环相扣的“链条式”传递，其主旨是联系的普遍性而非数量的积累；A、C两项与题意无关。故选 D。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第13题 · 单选题"},{"id":"c1s23-14","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":14,"type":"single","stem":"下列关于联系的多样性，表述正确的是（ ）","options":[{"key":"A","text":"联系的形式是单一的"},{"key":"B","text":"联系的形式是多样的"},{"key":"C","text":"联系的形式是可以被主观决定的"},{"key":"D","text":"联系的形式是可以被主观改变的"}],"answer":["B"],"analysis":"事物的联系是复杂多样的，有直接联系与间接联系、内部联系与外部联系、本质联系与非本质联系、必然联系与偶然联系等，联系的形式是多样的。A项错误，联系的形式不是单一的；C、D两项错误，联系是客观的，不以人的意志为转移，既不能由人主观决定，也不能由人主观改变，人只能改变联系的具体条件。故选 B。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第14题 · 单选题"},{"id":"c1s23-15","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":15,"type":"single","stem":"中国共产党人深刻认识到，只有把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，坚持运用辩证唯物主义和历史唯物主义，才能正确回答时代和实践提出的重大问题，才能始终保持马克思主义的蓬勃生机和旺盛活力。这一认识的哲学依据是（ ）","options":[{"key":"A","text":"现象与本质的辩证关系原理"},{"key":"B","text":"矛盾的普遍性和特殊性辩证关系原理"},{"key":"C","text":"内因和外因的辩证关系原理"},{"key":"D","text":"主观能动性与客观规律性的辩证关系原理"}],"answer":["B"],"analysis":"马克思主义基本原理揭示的是事物发展的普遍规律，属于矛盾的普遍性；中国具体实际和中华优秀传统文化是具体的、特殊的，属于矛盾的特殊性。把二者相结合，就是在普遍性原理的指导下研究特殊性，实现共性与个性、一般与个别具体的历史的统一，这正是矛盾普遍性和特殊性辩证关系原理的运用。A、C、D三项均与题干主旨不符。故选 B。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第15题 · 单选题"},{"id":"c1s23-16","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":16,"type":"single","stem":"现代诗人卞之琳《断章》中写道：“你站在桥上看风景／看风景的人在楼上看你／明月装饰了你的窗子／你装饰了别人的梦。”诗中的“你”既是看风景的人，又是被看的风景；既被装饰，也装饰别人。这包含的哲理主要是（ ）","options":[{"key":"A","text":"事物的联系是客观的、无条件的"},{"key":"B","text":"事物之间你中有我，我中有你"},{"key":"C","text":"事物之间没有严格的界限"},{"key":"D","text":"矛盾双方在一定条件下可以相互转化"}],"answer":["D"],"analysis":"同一个“你”，相对于“风景”是观看者，相对于“楼上的人”又是被观看的风景；既被明月装饰，又装饰着别人的梦。看与被看、装饰与被装饰这些对立着的双方相互依存、相互贯通，在一定条件下相互转化，体现的是矛盾双方在一定条件下可以相互转化的哲理。A项错误，联系是客观的但也是有条件的，不是无条件的；B项只讲相互依存，未点出相互转化这一主要哲理；C项错误，事物之间既相互联系又有严格区别，抹杀界限会导致相对主义。故选 D。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第16题 · 单选题"},{"id":"c1s23-17","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":17,"type":"single","stem":"现代医学鼻祖、希腊医生巴拉塞尔萨斯有一句名言：“万物皆有毒，关键在剂量”。这在哲学上的启示我们在想问题办事情时应当坚持（ ）","options":[{"key":"A","text":"适度原则"},{"key":"B","text":"联系的观点"},{"key":"C","text":"发展的眼光"},{"key":"D","text":"战略思维"}],"answer":["A"],"analysis":"“万物皆有毒，关键在剂量”是说任何药物超过一定剂量都会由“药”变“毒”，起作用的是剂量的界限。这在哲学上要求把握事物的度，把量控制在度的范围内，坚持适度原则。B项联系的观点、C项发展的眼光、D项战略思维均不是题干所强调的哲理。故选 A。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第17题 · 单选题"},{"id":"c1s23-18","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":18,"type":"single","stem":"二十大报告中指出要：“全方位夯实粮食安全根基，全面落实粮食安全党政同责，牢牢守住十八亿亩耕地红线，逐步把永久基本农田全部建成高标准农田，深入实施种业振兴行动，强化农业科技和装备支撑，健全种粮农民收益保障机制和主产区利益补偿机制，确保中国人的饭碗牢牢端在自己手中。”这一战略部署体现了中国共产党的（ ）","options":[{"key":"A","text":"辩证思维能力"},{"key":"B","text":"历史思维能力"},{"key":"C","text":"创新思维能力"},{"key":"D","text":"底线思维能力"}],"answer":["D"],"analysis":"牢牢守住十八亿亩耕地红线、确保中国人的饭碗牢牢端在自己手中，体现的是从最坏处着眼、设定不可逾越的底线、争取最好结果的思维方法，属于底线思维能力。A项辩证思维能力强调矛盾分析、全面看问题；B项历史思维能力强调以史为鉴、把握历史规律；C项创新思维能力强调突破常规、开拓创新，均不符合题干主旨。故选 D。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第18题 · 单选题"},{"id":"c1s23-19","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":19,"type":"multi","stem":"对立统一规律是唯物辩证法的实质与核心，这是因为对立统一规律（ ）","options":[{"key":"A","text":"是揭示事物普遍联系的根本内容与变化发展的内在动力"},{"key":"B","text":"是贯穿量变质变规律、否定之否定规律以及唯物辩证法基本范畴的中心线索"},{"key":"C","text":"是事物自身固有的客观的规律"},{"key":"D","text":"提供人们认识世界和改造世界的根本方法"}],"answer":["A","B","D"],"analysis":"对立统一规律之所以是唯物辩证法的实质与核心，原因有三：它揭示了事物普遍联系的根本内容和变化发展的内在动力（A）；它是贯穿量变质变规律、否定之否定规律以及唯物辩证法基本范畴的中心线索（B）；它提供了人们认识世界和改造世界的根本方法，即矛盾分析法（D）。C项“是事物自身固有的客观的规律”本身表述正确，但它说明的是规律的客观性，并不是对立统一规律成为唯物辩证法实质与核心的原因。故选 ABD。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第19题 · 多选题"},{"id":"c1s23-20","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":20,"type":"multi","stem":"习近平主席指出：“要继承和弘扬我国人民在长期实践中培育和形成的传统美德，坚持马克思主义道德观、坚持社会主义道德观，在去粗取精、去伪存真的基础上，坚持古为今用、推陈出新……”这句话包含的思想是（ ）","options":[{"key":"A","text":"对中华民族传统文化应采取批判和继承相统一的态度"},{"key":"B","text":"对中华民族传统文化应采取辩证的否定态度"},{"key":"C","text":"要坚持运用辩证法，力避形而上学、孤立、静止地看待中国传统文化"},{"key":"D","text":"要实现中华民族传统文化的创造性转化和创新性发展"}],"answer":["A","B","C","D"],"analysis":"“去粗取精、去伪存真”要求对传统文化取其精华、去其糟粕，即批判与继承相统一（A），这本质上就是辩证的否定即“扬弃”的态度（B）；“古为今用、推陈出新”要求用发展的、联系的眼光看待传统文化，避免孤立、静止地形而上学地对待传统文化（C），并实现中华优秀传统文化的创造性转化和创新性发展（D）。四个选项均符合题意。故选 ABCD。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第20题 · 多选题"},{"id":"c1s23-21","bank":"c1s23","bankName":"第一章第二&三节 · 课堂练习","num":21,"type":"multi","stem":"“如果偶然性不起任何作用的话，那么世界历史就会带有非常神秘的性质。”这一观点（ ）","options":[{"key":"A","text":"夸大了偶然性的作用，是唯心主义非决定论"},{"key":"B","text":"把偶然性和必然性的作用相混同，是相对主义的观点"},{"key":"C","text":"既承认偶然性的作用，又承认必然性的作用"},{"key":"D","text":"说明事物发展是必然性和偶然性综合作用的结果"}],"answer":["C","D"],"analysis":"这句名言的意思是：偶然性在世界历史发展中确实起着作用，如果否认偶然性的作用，历史就会显得神秘莫测。因此这一观点既承认偶然性的作用，又承认必然性的作用（C），说明事物的发展是必然性和偶然性综合作用的结果（D）。A项错误，这一观点是承认而非夸大了偶然性的作用，也不是唯心主义非决定论；B项错误，它并未把偶然性与必然性的作用混同，更未陷入相对主义。故选 CD。","tags":["第一章","第二&三节","唯物辩证法"],"origin":"第21题 · 多选题"},{"id":"final24-s01","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":1,"type":"single","stem":"马克思主义原理的实际运用，随时随地都要以当时、当地的历史条件、现实条件为转移。这一论断( )。","options":[{"key":"A","text":"否定了马克思主义的真理性"},{"key":"B","text":"否定了马克思主义对具体实际的指导作用"},{"key":"C","text":"肯定了马克思主义实事求是的理论品质"},{"key":"D","text":"肯定了马克思主义的阶级性"}],"answer":["C"],"analysis":">马克思主义原理的实际运用，随时随地都要以当时、当地的历史条件、现实条件为转移。\n\nA错误：该论断没有否定马克思主义真理性，恰恰强调真理要具体运用。\nB错误：并未否定指导作用，而是强调不能教条套用，要结合实际发挥指导作用。\nC正确：马克思主义实事求是，一切从实际出发，理论具体问题具体分析，这是马克思主义最重要的理论品质。\nD错误：题干没有涉及马克思主义的阶级立场、阶级性相关内容。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第1题"},{"id":"final24-s02","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":2,"type":"single","stem":"近年来，在对待马克思主义与中华优秀传统文化的关系上，出现了“以儒代马论” 和“以马废儒论”。“以儒代马论”企图用中华优秀传统文化代替马克思主义，“以马废儒论”认为马克思主义不能与中华优秀传统文化相结合，两种观点( )。","options":[{"key":"A","text":"属于客观唯心主义"},{"key":"B","text":"犯了形而上学错误"},{"key":"C","text":"犯了历史唯心主义错误"},{"key":"D","text":"犯了历史虚无主义错误"}],"answer":["B"],"analysis":"“以儒代马论”用儒学完全取代马克思主义；“以马废儒论”割裂马克思主义和中华优秀传统文化，二者都是**片面、孤立看问题**。\n\nA错误：客观唯心主义把客观精神当作世界本原，和题干无关。\nB正确：形而上学思维方式，片面对立二者，看不到二者可以结合，割裂事物之间联系，属于形而上学错误。\nC错误：历史唯心主义是把精神、英雄意志当作历史发展决定力量，本题不涉及。\nD错误：历史虚无主义主要表现为歪曲、否定历史，和本题两种观点内涵不同。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第2题"},{"id":"final24-s03","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":3,"type":"single","stem":"宋朝画家文与可在宅周围有很多竹子，他一年四季注意观察竹子的变化，对竹子的形态、姿态看得很仔细，因而画出的竹子生动逼真。有诗云：“与可画竹时，胸中有成竹”。这一事实体现的哲学道理是( )。","options":[{"key":"A","text":"物质是不依赖于意识的客观存在"},{"key":"B","text":"意识是物质长期发展的产物"},{"key":"C","text":"意识是人脑的机能"},{"key":"D","text":"意识是对客观世界的能动反映"}],"answer":["D"],"analysis":"“胸有成竹”：文与可长期观察竹子，在头脑中形成竹子形象，画出逼真竹子。\n\nA错误：强调物质客观存在，但题干重点是意识如何反映物质，不是物质客观性。\nB错误：讲意识的起源，意识是物质世界长期发展产物，材料未体现。\nC错误：意识是人脑机能，强调人脑是意识的物质器官，材料没有侧重人脑生理机能。\nD正确：意识是人脑对客观世界的能动反映。先观察客观竹子（客观对象），头脑形成竹子观念，体现意识对客观对象的加工反映。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第3题"},{"id":"final24-s04","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":4,"type":"single","stem":"“海水稻”是耐盐碱水稻。2016年袁隆平院士入驻青岛国际院士港成立青岛海水稻研发中心，2017年5月在海水稻研发基地进行第一代海水稻插秧，经过半年多的精心培育，9月28日迎来实地测产。最终测得编号为0045的水稻材料亩产量为620.95公斤，远超预期产量。袁隆平院士研发海水稻的过程，说明了( )。","options":[{"key":"A","text":"联系具有客观性，不以人的意志为转移"},{"key":"B","text":"旧的规律可以被打破，建立起新的联系"},{"key":"C","text":"联系的观点是人们认识和改造世界的基本方法"},{"key":"D","text":"人造事物的联系是主观的"}],"answer":["C"],"analysis":"袁隆平团队研发海水稻，利用盐碱地条件培育耐盐碱水稻，发挥联系观点改造世界。\n\nA错误：联系客观性本身表述正确，但题干重点不是说明联系不以人的意志转移，而是人类利用联系改造世界。\nB错误：**规律不能被打破**，人只能认识、利用规律，该选项本身说法错误。\nC正确：联系的观点是认识改造世界基本方法，人们把握水稻、盐碱环境之间联系，培育海水稻。\nD错误：人为事物的联系同样是客观的，不是主观，表述错误。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第4题"},{"id":"final24-s05","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":5,"type":"single","stem":"2004年，中国正式开展月球探测工程，从2007年10月24日嫦娥一号发射起，嫦娥二号、嫦娥三号、嫦娥四号发射运行，嫦娥五号返回器携带月球样品返回地球，2024年6月25日嫦娥六号发射并采样返回。中国计划在2030年前实现中国人首次登月。中国登月工程体现了( )。","options":[{"key":"A","text":"事物的发展过程，就是一个量变积累的过程"},{"key":"B","text":"离开了人的主观能动性，量变不会引起质变"},{"key":"C","text":"辩证否定推动事物发展"},{"key":"D","text":"打破规律才能进步"}],"answer":["A"],"analysis":"嫦娥系列一步步开展探月，从绕月、落月到采样返回，逐步积累，目标2030载人登月，体现量变积累推动发展。\n\nA正确：事物发展是量变到质变过程，探月工程一步一步积累，不断实现阶段性突破。\nB错误：量变达到一定程度就会引起质变，不需要人的主观能动性参与也会发生，该观点错误。\nC错误：辩证否定是“扬弃”，题干没有体现新旧事物之间的辩证否定关系。\nD错误：规律客观，不能打破，人只能尊重利用规律，说法错误。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第5题"},{"id":"final24-s06","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":6,"type":"single","stem":"爱因斯坦曾说：“逻辑只能让你从A到B，而想象力能带你去任何地方。”这句话体现了( )。","options":[{"key":"A","text":"逻辑证明的局限性在于只能回答结论是否符合客观实际的问题"},{"key":"B","text":"非理性因素在认识活动中起主导作用"},{"key":"C","text":"感性认识以理性认识为基础"},{"key":"D","text":"在认识过程中既要重视理性因素的作用也不可忽视非理性因素的重要作用"}],"answer":["D"],"analysis":"“逻辑只能让你从A到B，想象力能带你去任何地方”。逻辑属于理性因素；想象力属于非理性因素（想象、直觉、灵感等）。\n\nA错误：逻辑证明不能回答结论是否符合客观实际，**实践才是检验认识真理性唯一标准**。\nB错误：认识活动中，**理性因素起主导作用**，非理性因素起重要作用，不起主导。\nC错误：**理性认识以感性认识为基础**，选项颠倒二者关系。\nD正确：认识过程既要重视逻辑等理性因素，也不能忽视想象力这类非理性因素作用。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第6题"},{"id":"final24-s07","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":7,"type":"single","stem":"17世纪伽利略宣传“日心说”被宗教裁判所压制。随着社会的进步和科学的发展，1980年10月罗马教皇不得不公开为伽利略平反，这说明( )。","options":[{"key":"A","text":"谬误在一定条件下可以转化为真理"},{"key":"B","text":"真理是不断发展的"},{"key":"C","text":"真理终将战胜谬误"},{"key":"D","text":"真理在一定条件下可以转化为谬误"}],"answer":["C"],"analysis":"日心说一开始被教会压制，经过科学发展，最终教会为伽利略平反，真理最终战胜谬误。\n\nA错误：谬误转化为真理指条件变化谬误变成正确认识；本题不是谬误变真理，是曾经被打压的真理得到承认。\nB错误：真理不断发展侧重真理随实践丰富完善，材料重点不是真理自身发展，而是真理战胜谬误。\nC正确：真理具有客观性，终将战胜谬误。\nD错误：没有体现真理转化为谬误。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第7题"},{"id":"final24-s08","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":8,"type":"single","stem":"《咬文嚼字》公布的“2024十大流行语”包括“数智化、松弛感、银发力量”等，这些流行语反映了社会热点和时代变迁，流行语( )。","options":[{"key":"A","text":"能对社会发展产生积极影响"},{"key":"B","text":"是社会存在，具有相对独立性"},{"key":"C","text":"具有能动创新性"},{"key":"D","text":"会随着时代发展的变化而改变"}],"answer":["D"],"analysis":"流行语属于**社会意识**，反映社会热点时代变迁。\n\nA错误：流行语有好有坏，不一定都产生积极影响。\nB错误：流行语属于**社会意识**，不是社会存在；社会存在指社会物质生活条件。\nC错误：意识具有能动创造性，但是流行语本身不具备能动创造性，能动创造性是人意识的特点。\nD正确：社会存在决定社会意识，时代变迁（社会存在变化），流行语随之发生改变。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第8题"},{"id":"final24-s09","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":9,"type":"single","stem":"下列选项中关于社会发展的描述，正确的是( )。","options":[{"key":"A","text":"有些国家在发展中超越了一个社会形态跨越式地向前，这否定了社会发展基本规律"},{"key":"B","text":"有些国家生产关系和生产力状况并不完全适应，这否定了社会发展的基本规律"},{"key":"C","text":"社会基本矛盾是人类社会发展和进步的最终决定力量"},{"key":"D","text":"各个国家发展状况的不同表现了社会形态更替的统一性和多样性"}],"answer":["D"],"analysis":"A错误：社会形态跨越体现社会形态更替多样性，**没有否定社会发展一般规律**，仍然受社会基本矛盾制约。\nB错误：现实社会生产关系和生产力不完全适应是常态，通过改革调整，不否定社会发展基本规律。\nC错误：**生产力才是人类社会发展进步最终决定力量**；社会基本矛盾是社会发展根本动力。\nD正确：社会形态更替是统一性（人类社会总体大致经历几种社会形态）和多样性（不同国家可以跨越、发展进度不同）的统一。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第9题"},{"id":"final24-s10","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":10,"type":"single","stem":"垄断价格和垄断利润的出现，( )。","options":[{"key":"A","text":"说明价值规律被否定了"},{"key":"B","text":"说明价值规律的作用被限制了"},{"key":"C","text":"改变了价值规律的作用形式"},{"key":"D","text":"改变了价值规律的内容"}],"answer":["C"],"analysis":"垄断条件下产生垄断价格与垄断利润。**价值规律内容没有变，但是作用形式发生改变**：自由竞争时期，价格围绕价值上下波动；垄断阶段，市场价格围绕垄断价格上下波动。\n\nA错误：价值规律没有被否定。\nB错误：不是作用被限制，而是改变发挥作用的形式。\nC正确：垄断价格出现改变价值规律作用形式。\nD错误：价值规律内容（商品价值量由社会必要劳动时间决定，商品交换等价交换）没有改变。","tags":["期末真题","单选题"],"origin":"2024秋期末 · 单选题第10题"},{"id":"final24-m01","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":1,"type":"multi","stem":"“物质的两种存在形式离开了物质当然都是无，都是只存在于我们头脑中存在的观念抽象。”这段话说明( )。","options":[{"key":"A","text":"时间和空间是客观的"},{"key":"B","text":"时间和空间是物质运动的存在形式"},{"key":"C","text":"时间和空间是绝对的，又是相对的"},{"key":"D","text":"时间和空间离开物质只是形式"}],"answer":["A","B","D"],"analysis":"引文：物质的两种存在形式（时间、空间）离开物质当然都是无，只是头脑中的观念抽象。\n\nA正确：时间空间是客观的，不能脱离物质存在。\nB正确：时间和空间是物质运动的存在形式，离开物质运动，时空只是抽象概念。\nC错误：这句话只强调时空对物质的依赖性，没有涉及时空绝对性与相对性。\nD正确：时间空间一旦离开物质，就只剩下头脑中的观念形式，现实中不存在。","tags":["期末真题","多选题"],"origin":"2024秋期末 · 多选题第1题"},{"id":"final24-m02","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":2,"type":"multi","stem":"瑞卡斯说：“我们总喜欢拿顺其自然来敷衍人生道路上的荆棘坎坷，却很少承认，真正的顺其自然，其实是竭尽所能之后的不强求，而非两手一摊的不作为。”对这句话理解正确的是( )。","options":[{"key":"A","text":"“顺其自然”和“竭尽所能”的统一体现了尊重客观规律性与发挥主观能动性的统一"},{"key":"B","text":"“两手一摊的不作为”是机械决定论在人生态度上的体现"},{"key":"C","text":"“顺其自然”表明人不能创造和消灭规律，只能受规律的制约和支配"},{"key":"D","text":"“不强求”是因为主观能动性受客观规律性和社会历史条件的制约"}],"answer":["A","B","D"],"analysis":"真正顺其自然是竭尽所能之后不强求，不是两手一摊不作为。体现尊重客观规律与发挥主观能动性统一。\n\nA正确：竭尽所能是发挥主观能动性；顺其自然是尊重客观规律，二者统一。\nB正确：机械决定论夸大客观规律作用，否定人的主观能动性，认为一切命中注定，对应“两手一摊不作为”。\nC错误：规律制约人，但人可以在尊重规律基础上利用规律改造世界，不是只能被动受规律支配。\nD正确：不强求，因为主观能动性发挥受客观规律、社会历史条件制约，不是想做什么就能做到什么。","tags":["期末真题","多选题"],"origin":"2024秋期末 · 多选题第2题"},{"id":"final24-m03","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":3,"type":"multi","stem":"近年来，很多工业遗产“变身”创意园区、景观公园、博物馆，成为火爆一时的网红打卡地。文化的力量、温度，使被岁月侵蚀的斑驳“锈带”，因吸收时代元素而焕发崭新容颜，成为宜居、宜乐、宜游的多彩“秀带”。这启示我们要( )","options":[{"key":"A","text":"发挥意识的主动创造性，赋予物质新的属性"},{"key":"B","text":"把吸收、改造旧事物的合理因素作为创新的基础"},{"key":"C","text":"把握和利用事物的多样价值，满足人们的需求"},{"key":"D","text":"以人民群众的新需求为基础创造条件，建立新联系"}],"answer":["B","C"],"analysis":"工业遗产改造为创意园区、博物馆，改造旧事物，赋予时代新价值。\n\nA错误：物质的属性是客观的，意识不能赋予物质新的属性；人只能发掘、利用物质本身多样属性。\nB正确：辩证否定实质是扬弃，创新要吸收改造旧事物合理因素作为基础。工业遗产保留历史价值，加入时代元素。\nC正确：工业遗产既有工业历史价值，又可以成为文旅打卡地，把握事物多样价值满足人民多元需求。\nD错误：**联系建立的基础是客观事物固有联系**，不是人民群众新需求。不能以需求为基础建立联系。","tags":["期末真题","多选题"],"origin":"2024秋期末 · 多选题第3题"},{"id":"final24-m04","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":4,"type":"multi","stem":"随着科技化进程的不断推进，可穿戴智能设备将是手机之后一个全新时代的电子产品。例如智能眼镜，将眼镜、智能手机和摄像机集于一体，能在人眼前形成一个虚拟屏幕，将信息和数据展现出来，同时在眼镜上集成麦克风和耳机，可以通过语音指令进行操作。智能眼镜( )。","options":[{"key":"A","text":"作为新的实践主体，将深刻改变人类生活"},{"key":"B","text":"具备了一定的能动创造性和较强操作能力"},{"key":"C","text":"延伸了人类的认识器官，促进了认识发展"},{"key":"D","text":"具有“人化”的特点，是人类实践的产物"}],"answer":["C","D"],"analysis":"智能眼镜属于人造工具，人类实践产物。\n\nA错误：**实践主体只能是人**，工具不能成为实践主体。\nB错误：能动创造性是人意识特有的，智能眼镜没有意识，不具备能动创造性。\nC正确：工具延伸人类认识器官，拓展人的认识能力，促进认识发展。\nD正确：智能眼镜是人类实践创造出来，属于“人化”的客观事物，是实践产物。","tags":["期末真题","多选题"],"origin":"2024秋期末 · 多选题第4题"},{"id":"final24-m05","bank":"final-2024","bankName":"2024秋期末真题（一校三区）","num":5,"type":"multi","stem":"中共中央、国务院印发的《关于加快建设全国统一大市场的意见》，从全局和战略高度对加快建设全国统一大市场作出部署。建设全国统一大市场，持续推动国内市场高效畅通，形成供需互促、产销并进、畅通高效的国内大循环，将推动国内市场由大到强，促进我国经济高质量发展。从哲学上看，持续推动国内市场高效畅通，是因为( )。","options":[{"key":"A","text":"经济基础决定上层建筑，上层建筑要与经济基础状况相适合"},{"key":"B","text":"联系是客观的和普遍的，任何事物之间都存在着必然的联系"},{"key":"C","text":"通过调整和完善生产关系，可以更好地促进生产力的发展"},{"key":"D","text":"发展是渐进性和飞跃性的统一，事物的量变必然引起质变"}],"answer":["A","C"],"analysis":"建设全国统一大市场，畅通国内大循环，调整市场生产关系层面内容，促进生产力高质量发展。\n\nA正确：完善市场体系属于调整经济基础范畴；上层建筑要适合经济基础，统一大市场建设也需要配套上层建筑制度相匹配。\nB错误：联系具有普遍性，但**不是任何事物之间都存在必然联系**，联系是有条件的。\nC正确：市场关系属于生产关系范畴，调整完善生产关系，解放发展生产力，推动经济高质量发展。\nD错误：量变达到**一定程度**才会引起质变，量变不会必然带来质变。","tags":["期末真题","多选题"],"origin":"2024秋期末 · 多选题第5题"},{"id":"ky-001","bank":"kaoyan","bankName":"考研政治真题精选","num":1,"type":"single","stem":"1984年1月3日，意大利人卡内帕给恩格斯写信，请求他为即将在日内瓦出版的《新纪元》周刊的创刊号题词，而且要求尽量用简短的字句来表述未来的社会主义纪元的基本思想，以区别于伟大诗人但丁的对旧纪元所作的“一些人统治，另一些人受苦难”的界定。恩格斯回答说，这就是：“代替那存在着阶级和阶级对立的资产阶级旧社会的，将是这样一个联合体，在那里，每个人的自由发展是一切人的自由发展的条件。”这段话表明，马克思主义追求的根本价值目标是（）","options":[{"key":"A","text":"实现人的自由而全面的发展"},{"key":"B","text":"实现人类永恒不变的普适价值"},{"key":"C","text":"建立一个四海之内皆兄弟的大同世界"},{"key":"D","text":"建立一个自由，平等，博爱的理性王国"}],"answer":["A"],"analysis":"恩格斯的这段话出自他为《新纪元》周刊创刊号所作的题词，表述的正是《共产党宣言》中“自由人联合体”的思想。马克思主义以无产阶级和人类解放为主题，其追求的根本价值目标是实现人的自由而全面的发展——共产主义社会是“以每个人的全面而自由的发展为基本原则的社会形式”，在那里，每个人的自由发展是一切人的自由发展的条件。B项“永恒不变的普适价值”是抽象人性论的说法，价值总是具体的、历史的；C项“大同世界”是中国古代的社会理想，缺乏科学基础；D项“自由、平等、博爱的理性王国”是资产阶级启蒙思想家提出的理想国，实质是资产阶级共和国。故选 A。","tags":["一、马克思主义哲学","绪论　马克思主义是关于无产阶级和人类解放的科学"],"part":"一、马克思主义哲学","section":"绪论　马克思主义是关于无产阶级和人类解放的科学","subsection":"","origin":"考研真题 · 2010年第1题"},{"id":"ky-002","bank":"kaoyan","bankName":"考研政治真题精选","num":2,"type":"single","stem":"马克思、恩格斯始终站在革命斗争的最前沿，他们的一生是为推翻旧世界，建立新世界而不息战斗的一生。马克思恩格斯领导创建的世界上第一个无产阶级政党是（）","options":[{"key":"A","text":"国际工人协会"},{"key":"B","text":"正义者联盟"},{"key":"C","text":"共产主义者同盟"},{"key":"D","text":"社会主义工人国际"}],"answer":["C"],"analysis":"共产主义者同盟是马克思、恩格斯领导创建的世界上第一个无产阶级政党。1847年，他们接受“正义者同盟”的邀请，将其改组为“共产主义者同盟”，并为之起草了党纲《共产党宣言》。B项正义者同盟是共产主义者同盟的前身，属国际性工人组织而非政党；A项国际工人协会（第一国际）成立于1864年，是国际工人联合组织，时间上晚于共产主义者同盟；D项社会主义工人国际成立于1923年，是改良主义政党的国际联合组织。故选 C。","tags":["一、马克思主义哲学","绪论　马克思主义是关于无产阶级和人类解放的科学"],"part":"一、马克思主义哲学","section":"绪论　马克思主义是关于无产阶级和人类解放的科学","subsection":"","origin":"考研真题 · 2019年第1题"},{"id":"ky-003","bank":"kaoyan","bankName":"考研政治真题精选","num":3,"type":"single","stem":"马克思主义的产生具有深刻的社会根源、阶级基础和思想渊源。其创始人马克思1818年5月5日出生在德国特利尔城的一个律师家庭，恩格斯1820年11月28日出生在德国巴门市的一个工厂主家庭，他们放弃了舒适安逸的生活，毅然选择了充满荆棘坎坷的革命道路，创立了科学社会主义。马克思、恩格斯之所以能够创立科学社会主义，主要是因为（）","options":[{"key":"A","text":"他们对时代有着超常人的认知能力"},{"key":"B","text":"他们拥有优良的家庭背景和教育经历"},{"key":"C","text":"社会历史条件和个人努力的相互作用"},{"key":"D","text":"德国是当时最为发达的资本主义国家"}],"answer":["C"],"analysis":"本题考查科学社会主义创立的客观条件与主观条件的统一。马克思、恩格斯之所以能够创立科学社会主义，是19世纪资本主义的发展和工人运动的兴起这一社会历史条件，与他们自身的理论探索和革命实践这一主观努力相互作用的结果。A项把原因归结为个人超常的认知能力，B项归结为家庭背景和教育经历，都属于唯心主义英雄史观；D项不符合史实，当时最发达的资本主义国家是英国而不是德国。故选 C。","tags":["一、马克思主义哲学","绪论　马克思主义是关于无产阶级和人类解放的科学"],"part":"一、马克思主义哲学","section":"绪论　马克思主义是关于无产阶级和人类解放的科学","subsection":"","origin":"考研真题 · 2018年第1题"},{"id":"ky-004","bank":"kaoyan","bankName":"考研政治真题精选","num":4,"type":"single","stem":"唯物主义一元论同唯心主义一元论对立的根本点在于（）","options":[{"key":"A","text":"世界发展动力问题"},{"key":"B","text":"意识本质问题"},{"key":"C","text":"世界本质问题"},{"key":"D","text":"实践本质问题"}],"answer":["C"],"analysis":"唯物主义一元论与唯心主义一元论都承认世界只有一个本原，二者的分歧在于这个本原是什么：唯物主义认为是物质，唯心主义认为是精神。因此，二者对立的根本点是世界本质（本原）问题。A项世界发展动力问题、B项意识本质问题、D项实践本质问题虽然都是哲学问题，但都不是划分唯物主义与唯心主义的标准。故选 C。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 1995年理科第2题"},{"id":"ky-005","bank":"kaoyan","bankName":"考研政治真题精选","num":5,"type":"single","stem":"恩格斯认为，全部哲学、特别是近代哲学的重大的基本问题是（）","options":[{"key":"A","text":"哲学与人类生存活动之间的内在联系问题"},{"key":"B","text":"人与周围世界的基本联系问题"},{"key":"C","text":"思维和存在的关系问题"},{"key":"D","text":"关于人的本质问题"}],"answer":["C"],"analysis":"恩格斯在《路德维希·费尔巴哈和德国古典哲学的终结》中明确指出：“全部哲学，特别是近代哲学的重大的基本问题，是思维和存在的关系问题。”它包括两个方面：一是思维和存在何者为本原，二是二者有无同一性。A、B、D三项虽属哲学问题，但都不是对哲学基本问题的规范表述。故选 C。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 1997年理科第1题"},{"id":"ky-006","bank":"kaoyan","bankName":"考研政治真题精选","num":6,"type":"single","stem":"相信“意念移物”，甚至相信可以用意念来直接改变物质结构，就是信奉（）","options":[{"key":"A","text":"主张精神主宰客观物质世界的主观唯心论"},{"key":"B","text":"主张精神是脱离人脑独立存在的客观唯心论"},{"key":"C","text":"认为人的思想是特殊物质的机械唯物主义"},{"key":"D","text":"认为人具有主观能动性的实践唯物主义"}],"answer":["A"],"analysis":"“意念移物”主张人的精神可以直接改变物质结构、主宰客观物质世界，这是把人的主观精神当作世界的本原，属于主观唯心主义。B项客观唯心论把精神归结为脱离人脑而独立存在的“绝对精神”“理念”之类；C项机械唯物主义承认物质第一性，只是在方法论上有片面性；D项“实践唯物主义”以实践为基础，不属于唯心主义。故选 A。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2000年文科第2题"},{"id":"ky-007","bank":"kaoyan","bankName":"考研政治真题精选","num":7,"type":"single","stem":"物质和意识的对立只有在非常有限的范围内才有绝对的意义，超过这个范围便是相对的了，这个范围是指（）","options":[{"key":"A","text":"物质和意识何者为第一性"},{"key":"B","text":"物质和意识是否具有统一性"},{"key":"C","text":"物质和意识何者更为重要"},{"key":"D","text":"物质和意识何者与社会生活的关系更密切"}],"answer":["A"],"analysis":"列宁指出，物质和意识的对立只有在“何者为第一性”这一认识论基本问题的范围内才有绝对的意义，即谁是本原、谁是派生的，二者的对立是绝对的；超出这个范围（如二者有无同一性、何者更重要、何者与社会生活关系更密切），二者的对立便是相对的。故选 A。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2009年第1题"},{"id":"ky-008","bank":"kaoyan","bankName":"考研政治真题精选","num":8,"type":"single","stem":"哲学上的物质范畴与自然科学上的物质范畴的关系是（）","options":[{"key":"A","text":"本源和派生的关系"},{"key":"B","text":"普遍和特殊的关系"},{"key":"C","text":"本质和现象的关系"},{"key":"D","text":"形式和内容的关系"}],"answer":["B"],"analysis":"哲学上的物质范畴是对一切具体物质形态共同本质的抽象概括，属于共性、一般；自然科学上的物质范畴指的是具体的物质形态、结构和属性，属于个性、特殊。二者的关系是普遍与特殊（共性与个性）的关系。A项本原与派生描述的是物质与意识的关系；C项本质与现象、D项形式与内容描述的是事物内部的两对范畴，均不符合题意。故选 B。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 1992年文科第6题"},{"id":"ky-009","bank":"kaoyan","bankName":"考研政治真题精选","num":9,"type":"single","stem":"列宁对辩证唯物主义物质范畴的定义是通过（）","options":[{"key":"A","text":"物质与意识的关系界定的"},{"key":"B","text":"个别与一般的关系界定的"},{"key":"C","text":"哲学与具体科学的关系界定的"},{"key":"D","text":"认识与实践的关系界定的"}],"answer":["A"],"analysis":"列宁给物质下的定义是：“物质是标志客观实在的哲学范畴，这种客观实在是人通过感觉感知的，它不依赖于我们的感觉而存在，为我们的感觉所复写、摄影、反映。”这一界定是从物质与意识的关系（谁第一性、谁被反映）入手的，从而同唯心主义和不可知论划清了界限。B项个别与一般、C项哲学与具体科学、D项认识与实践的关系都不是列宁定义物质范畴的角度。故选 A。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 1994年理科第1题"},{"id":"ky-010","bank":"kaoyan","bankName":"考研政治真题精选","num":10,"type":"single","stem":"《坛经》中记载：“时有风吹幡动，一僧曰风动，一僧曰幡动，议论不已。惠能进曰：不是风动，不是幡动，仁者心动。”这段话表明惠能关于运动的基本观点是（）","options":[{"key":"A","text":"运动是物质的根本属性"},{"key":"B","text":"运动与物质是不可分割的"},{"key":"C","text":"精神运动是物质运动的一种形式"},{"key":"D","text":"精神是运动的主体"}],"answer":["D"],"analysis":"慧能认为不是风动、不是幡动，而是“仁者心动”，即把运动的主体归结为精神（心），认为精神在运动而物质本身不动，属于唯心主义运动观。A项运动是物质的根本属性、B项运动与物质不可分割都是辩证唯物主义的正确观点；C项精神运动是物质运动的一种形式，虽表述正确，但不符合慧能的原意——他是把物质运动归结为精神运动，而不是相反。故选 D。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 1996年理科第1题"},{"id":"ky-011","bank":"kaoyan","bankName":"考研政治真题精选","num":11,"type":"single","stem":"世界上唯一不变的是变化，这一论断的含义是（）","options":[{"key":"A","text":"变是世界的本质"},{"key":"B","text":"世界上只有变，没有不变"},{"key":"C","text":"变是绝对的，不变是相对的"},{"key":"D","text":"变与不变是绝对对立的"}],"answer":["C"],"analysis":"“世界上唯一不变的是变化”是说运动、变化是绝对的、无条件的、永恒的，而静止是相对的、有条件的、暂时的，静中有动。A项把“变”当作世界的本质，混淆了运动观与世界本原问题；B项否认相对静止的存在，会导致相对主义和诡辩论；D项把变与不变绝对对立起来，是形而上学的观点。故选 C。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2006年第1题"},{"id":"ky-012","bank":"kaoyan","bankName":"考研政治真题精选","num":12,"type":"single","stem":"有一幅对联，上联“桔子洲，洲旁舟，舟行洲不行，”下联“天心阁，阁中鸽，鸽飞阁不飞。”这形象地说明了运动和静止是相互依存的，静止是（）","options":[{"key":"A","text":"运动的衡量尺度"},{"key":"B","text":"运动的内在原因"},{"key":"C","text":"运动的普遍状态"},{"key":"D","text":"运动的存在方式"}],"answer":["A"],"analysis":"对联以洲、阁的不动衬托舟、鸽的动，“舟行洲不行”“鸽飞阁不飞”说明运动和静止相互依存：静止是运动的衡量尺度，离开相对静止就无法确定和描述运动。B项运动的内在原因是事物内部的矛盾；C项运动的普遍状态、D项运动的存在方式都不是静止在运动与静止关系中的定位。故选 A。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2013年第1题"},{"id":"ky-013","bank":"kaoyan","bankName":"考研政治真题精选","num":13,"type":"single","stem":"“观念的东西不外是移入人的头脑并在人的头脑中改造的物质的东西而已。”这个命题表明（）","options":[{"key":"A","text":"意识是客观存在的主观映象"},{"key":"B","text":"人脑是意识的源泉"},{"key":"C","text":"观念的东西和物质的东西并没有本质上的区别"},{"key":"D","text":"意识是人脑中特有的物质"}],"answer":["A"],"analysis":"这是马克思在《资本论》第一卷中的名言。“移入人的头脑”说明意识的内容来自客观物质世界；“在人的头脑中改造”说明意识要经过人脑的加工改造。合起来即意识是客观存在的主观映象，是客观内容与主观形式的统一。B项错误，人脑是意识的器官而不是意识的源泉，源泉是客观存在；C项抹杀了观念的东西与物质的东西的本质区别；D项把意识说成“人脑中特有的物质”，混淆了物质与意识。故选 A。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 1999年理科第1题"},{"id":"ky-014","bank":"kaoyan","bankName":"考研政治真题精选","num":14,"type":"multi","stem":"长江的年龄有多大？这里说的长江“年龄”，是指从青藏高原奔流而下注入东海的“贯通东流”水系的形成年代。如果说上游的沉积物从青藏高原、四川盆地顺延而下能到达下游，这就表明长江贯通了，这就是物源示踪。我国科学家采用这一方法，研究长江中下游盆地沉积物的来源，从而判别长江上游的物质何时到达下游，间接指示了长江贯通东流的时限。他们经过10多年的研究，提出长江贯通东流的时间距今2300多万年。这一研究成果从一个侧面显示出（）","options":[{"key":"A","text":"时间和空间是通过物质运动的变化表现出来的"},{"key":"B","text":"时间和空间是标示物质运动的观念形式"},{"key":"C","text":"时间和空间是有限的，物质运动是永恒的"},{"key":"D","text":"时间和空间是物质运动的存在形式"}],"answer":["A","D"],"analysis":"题干中科学家正是通过研究沉积物的来源与运动，间接测定了长江贯通东流的时间，说明时间和空间与物质运动不可分离。A项正确，时间和空间通过物质运动的变化表现出来；D项正确，时间和空间是物质运动的存在形式。B项错误，时间和空间是客观的，不是标示物质运动的观念形式；C项错误，时空既具有有限性又具有无限性，不能笼统地说“时间和空间是有限的”。故选 AD。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2014年第17题"},{"id":"ky-015","bank":"kaoyan","bankName":"考研政治真题精选","num":15,"type":"multi","stem":"母质、气候、生物、地形、时间是土壤形成的五大关键成土因素。母质是土壤形成物质基础的初始无机养分的最初来源。气候导致矿物的风化和合成，有机质的形成和积累，土壤中物质的迁移，分解和合成。生物包括植物、动物和微生物等，是促进土壤发生发展最活跃的因素。地形可以使物质在地表进行再分配，使土壤及母质在接受光、热、水等条件方面发生差异。时间是阐明土壤形成发展的历史动态过程，母质、气候、生物和地形等对成土过程的作用随着时间延续而加强。土壤的生产过程说明（）","options":[{"key":"A","text":"事物总是作为过程而存在"},{"key":"B","text":"时间是物质运动的存在形式"},{"key":"C","text":"事物的发展总是呈现出线性上升的态势"},{"key":"D","text":"事物的产生是多重因素相互作用的结果"}],"answer":["A","B","D"],"analysis":"题干指出土壤的形成是母质、气候、生物、地形、时间五大因素长期相互作用的结果。A项正确，事物总是作为过程而存在；B项正确，时间是阐明土壤形成发展历史动态过程的因素，是物质运动的存在形式；D项正确，事物的产生是多重因素相互作用的结果。C项错误，事物的发展是前进性与曲折性的统一，并非线性上升。故选 ABD。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2015年第17题"},{"id":"ky-016","bank":"kaoyan","bankName":"考研政治真题精选","num":16,"type":"multi","stem":"意识和物质的对立只是在非常有限的范围内才有绝对的意义，超出这个范围，其对立便是相对的。这是因为（）","options":[{"key":"A","text":"意识根源于物质"},{"key":"B","text":"意识是物质的反映"},{"key":"C","text":"意识是物质的固有属性"},{"key":"D","text":"意识是物质的存在形式"},{"key":"E","text":"意识可以转化为物质"}],"answer":["A","B","E"],"analysis":"物质和意识的对立只在“何者为第一性”的范围内才有绝对意义，超出这个范围，二者的对立就是相对的，即意识依赖于物质并能在一定条件下转化为物质。A项意识根源于物质、B项意识是物质的反映，说明意识对物质的依赖性；E项意识可以转化为物质，说明二者在实践基础上相互贯通。C项错误，意识不是物质的固有属性，物质的固有属性是运动；D项错误，意识不是物质的存在形式，时空才是物质运动的存在形式。故选 ABE。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2002年文科第16题"},{"id":"ky-017","bank":"kaoyan","bankName":"考研政治真题精选","num":17,"type":"multi","stem":"关于龙的形象，自古以来就有“角似鹿、头似驼、眼似兔、项似蛇、腹似蜃、鳞似鱼、爪似鹰、掌似虎、耳似牛”的说法。这表明（）","options":[{"key":"A","text":"观念的东西是移入人脑并在人脑中改造过的物质的东西"},{"key":"B","text":"一切观念都是现实的模仿"},{"key":"C","text":"虚幻的观念也是对事物本质的反映"},{"key":"D","text":"任何观念都可以从现实世界中找到其物质“原型”"}],"answer":["A","D"],"analysis":"龙是现实中不存在的虚幻形象，但构成龙的形象的各种要素（角、头、眼、鳞、爪等）都取自现实中的动物，这说明观念的东西不外是移入人脑并在人脑中改造过的物质的东西（A），任何观念都可以从现实世界中找到其物质“原型”（D），意识的内容是客观的。B项错误，观念是对现实的能动反映而不是简单模仿；C项错误，虚幻的观念是对现实的歪曲反映，并不反映事物的本质。故选 AD。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2007年多选第17题"},{"id":"ky-018","bank":"kaoyan","bankName":"考研政治真题精选","num":18,"type":"multi","stem":"从上世纪70年代至今，商务印书馆先后出版了多个版本的《新华字典》，除了一些旧的词条，增加了一些新的词条，并对若干词条的词义给了修改。例如1971年版对“科举”这个词的解释是：“从隋唐到清代的封建王朝为了维护其反动统治而设立分科考选文武官吏后备人员的制度”，1992年版删去“反动”二字，1998版又删去“为了维护其统治而设”直到2008年版删去了这句话。一本小字典记载着词语的发展变化也记录了时代前进的印证，字典词条释义的变化表明人们的意识（）","options":[{"key":"A","text":"是客观世界的能动反映"},{"key":"B","text":"取决于词语含义的改变"},{"key":"C","text":"随着社会生活变化而变化"},{"key":"D","text":"需要借助语言这一物质外壳表达出来"}],"answer":["A","C","D"],"analysis":"《新华字典》词条释义随时代发展而修改，说明意识是对客观世界的能动反映（A），随着社会生活的变化而变化（C），并且需要借助语言这一物质外壳表达出来（D）。B项颠倒了关系：词语含义的改变本身也是社会生活变化的反映，它不能决定意识。故选 ACD。","tags":["一、马克思主义哲学","世界的物质性"],"part":"一、马克思主义哲学","section":"世界的物质性","subsection":"","origin":"考研真题 · 2010年第17题"},{"id":"ky-019","bank":"kaoyan","bankName":"考研政治真题精选","num":19,"type":"single","stem":"“马者所以命形也；白者所以命色也。命色者非命形也，故曰白马非马。”从唯物辩证法的观点看，“白马非马”这一命题的错误在于（）","options":[{"key":"A","text":"割裂了事物共性和个性之间的联系"},{"key":"B","text":"模糊了事物本质和现象之间的联系"},{"key":"C","text":"混淆了事物内容和形式之间的区别"},{"key":"D","text":"颠倒了事物形态和功能之间的关系"}],"answer":["A"],"analysis":"“白马非马”的错误在于把“白马”（个性、个别）与“马”（共性、一般）割裂开来，只看到二者的差别而否认二者的联系。共性寓于个性之中，一般只能通过个别而存在，没有脱离个性的纯粹共性。B项本质与现象、C项内容与形式、D项形态与功能的关系均与题意不符。故选 A。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 2018年第2题"},{"id":"ky-020","bank":"kaoyan","bankName":"考研政治真题精选","num":20,"type":"multi","stem":"2017年6月，我国科学家利用“墨子号”量子科学实验卫星在国际上率先成功实现了千公里级的星地双向量子纠缠分发。“量子纠缠”是两个（或多个）粒子共同组成的量子状态，无论粒子之间相隔多远，测量其中一个粒子必须必然会影响其他粒子。“墨子号”量子纠缠现象虽然未被完全认知，但它仍然能够说明（）","options":[{"key":"A","text":"物质世界联系的客观性和普遍性"},{"key":"B","text":"事物联系的主观性和偶然性"},{"key":"C","text":"事物联系的复杂性和多样性"},{"key":"D","text":"世界的真正统一性在于它的物质性"}],"answer":["A","C","D"],"analysis":"量子纠缠现象说明，无论两个粒子相隔多远，对其中一个的测量都会影响另一个，这体现了物质世界联系的客观性和普遍性（A），事物联系的复杂性和多样性（C），以及世界的真正统一性在于它的物质性（D）。B项错误，联系是客观的而不是主观的，联系的表现有其必然性而非单纯的偶然性。故选 ACD。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 2018年第17题"},{"id":"ky-021","bank":"kaoyan","bankName":"考研政治真题精选","num":21,"type":"single","stem":"“橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”橘逾淮为枳说明了（）","options":[{"key":"A","text":"事物的发展变化以时间地点和条件为转移"},{"key":"B","text":"事物的普遍联系是通过中介来实现的"},{"key":"C","text":"任何实体事物都是普遍联系之网上的一个网结"},{"key":"D","text":"事物的变化和发展是一个过程"}],"answer":["A"],"analysis":"“橘生淮南则为橘，生于淮北则为枳”，橘的味道由甘甜变为酸涩，说明水土（时间、地点、条件）的变化引起了事物性质的变化，即事物的发展变化以时间、地点和条件为转移，联系具有条件性。B项“普遍联系通过中介实现”、C项“实体事物是普遍联系之网上的网结”、D项“变化发展是一个过程”本身表述都正确，但没有点出“水土异也”导致事物性质改变这一关键，与题意不符。故选 A。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 2019年第2题"},{"id":"ky-022","bank":"kaoyan","bankName":"考研政治真题精选","num":22,"type":"multi","stem":"中国古代的哲学家公孙龙提出的“白马非马”的命题，其错误是割裂了事物的（）","options":[{"key":"A","text":"一般和个别的关系"},{"key":"B","text":"共性和个性的关系"},{"key":"C","text":"整体和部分的关系"},{"key":"D","text":"普遍和特殊的关系"},{"key":"E","text":"抽象和具体的关系"}],"answer":["A","B","D"],"analysis":"“白马非马”的错误在于割裂了一般与个别（A）、共性与个性（B）、普遍与特殊（D）的关系。这三对范畴在哲学上属于同一层次，都是对一般与个别关系的不同表述。C项整体与部分、E项抽象与具体虽然也与该命题相关，但“白马非马”所割裂的并不是整体与部分的关系，也不是抽象与具体的关系。故选 ABD。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 1993年文科第15题"},{"id":"ky-023","bank":"kaoyan","bankName":"考研政治真题精选","num":23,"type":"single","stem":"1981年党的十一届六中全会通过《关于建国以来党的若干历史问题的决议》对我国社会主要矛盾作了规范的表述：“社会主义改造完成以后，我国所要解决的主要矛盾，是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。”我国社会主要矛盾的主要方面将长期是（）","options":[{"key":"A","text":"生产力落后"},{"key":"B","text":"生产力不断发展的要求"},{"key":"C","text":"经济文化发展不平衡"},{"key":"D","text":"人民日益增长的物质文化需要"}],"answer":["A"],"analysis":"矛盾的主要方面决定事物的性质。在我国社会主要矛盾“人民日益增长的物质文化需要同落后的社会生产之间的矛盾”中，落后的社会生产是矛盾的主要方面，它规定着矛盾的性质和发展方向，解决矛盾的根本途径是发展生产力，因而这一主要方面将长期存在。B、D两项都是矛盾的次要方面；C项经济文化发展不平衡并不是该矛盾主要方面的规范表述。故选 A。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 2010年第5题"},{"id":"ky-024","bank":"kaoyan","bankName":"考研政治真题精选","num":24,"type":"single","stem":"区分事物发展过程中量变和质变的根本标志是（）","options":[{"key":"A","text":"事物的变化是否迅速"},{"key":"B","text":"事物的变化过程中是否有部分质变"},{"key":"C","text":"事物的变化是否超过度的范围"},{"key":"D","text":"事物的变化是否显著"}],"answer":["C"],"analysis":"区分量变和质变的根本标志，是事物的变化是否超出度的范围：在度的范围内发生的是量变，超出度就要发生质变，一事物变成他事物。A项“变化是否迅速”、D项“变化是否显著”只是量的差别，不是根本标志；B项“是否有部分质变”是量变过程中发生的局部性变化，同样不能作为根本标志。故选 C。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 1992年文科第9题"},{"id":"ky-025","bank":"kaoyan","bankName":"考研政治真题精选","num":25,"type":"single","stem":"事物发展过程中的“度”是指（）","options":[{"key":"A","text":"事物质变的关节点"},{"key":"B","text":"事物质变的临界点"},{"key":"C","text":"事物保持一定质的量的限度"},{"key":"D","text":"事物保持一定量的质的限度"}],"answer":["C"],"analysis":"度是保持事物质的稳定性的数量界限，是事物质与量的统一，即“事物保持一定质的量的限度”。A项事物质变的关节点、B项事物质变的临界点是度的两端极限，不是度本身；D项“保持一定量的质的限度”把质与量的关系说颠倒了。故选 C。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 1993年文科第3题"},{"id":"ky-026","bank":"kaoyan","bankName":"考研政治真题精选","num":26,"type":"single","stem":"在工作中防止“过”或“不及”的关键在于（）","options":[{"key":"A","text":"抓住事物的主要矛盾"},{"key":"B","text":"认识事物的量"},{"key":"C","text":"确定事物的质"},{"key":"D","text":"把握事物的度"}],"answer":["D"],"analysis":"“过”与“不及”都是没有把握好度的表现：超出了度就是“过”，达不到度的要求就是“不及”，二者都不能达到预期效果。因此防止“过”或“不及”的关键在于把握事物的度，坚持适度原则。A项抓主要矛盾、B项认识量、C项确定质虽然都是辩证法的要求，但都不能直接说明如何防止“过”与“不及”。故选 D。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 1997年理科第2题"},{"id":"ky-027","bank":"kaoyan","bankName":"考研政治真题精选","num":27,"type":"single","stem":"有一则箴言：“在溪水和岩石的斗争中，胜利的总是溪水，不是因为力量，而是因为坚持。”“坚持就是胜利”的哲理在于（）","options":[{"key":"A","text":"必然性通过偶然性开辟道路"},{"key":"B","text":"肯定中包含着否定的因素"},{"key":"C","text":"量变必然引起质变"},{"key":"D","text":"有其因必有其果"}],"answer":["C"],"analysis":"溪水之所以能战胜岩石，不是因为力量，而是因为“坚持”——持续的、不间断的运动最终改变了岩石。这蕴含的道理是量变必然引起质变，量的积累达到一定程度就必然引起质的飞跃。A项必然性通过偶然性开辟道路、B项肯定中包含着否定因素、D项有其因必有其果虽然都是辩证法的观点，但不是题干着重的道理。故选 C。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 2010年第2题"},{"id":"ky-028","bank":"kaoyan","bankName":"考研政治真题精选","num":28,"type":"single","stem":"著名数学家华罗庚在一次报告中以“一支粉笔多长为好”为题来讲解他的优选法，对此，他解释道：“每支粉笔都要丢掉一段一定长的粉笔头，单就这一点来说：愈长愈好。但太长了，使用起来很不方便，而且容易折断，每断一次，必然多浪费一个粉笔头，反而不合适。因而就出现了粉笔多长最合适的问题—这就是一个优选问题。”所谓优选问题，从辩证的角度看，就是要（）","options":[{"key":"A","text":"注重量的积累"},{"key":"B","text":"保持物质的稳定性"},{"key":"C","text":"坚持适度原则"},{"key":"D","text":"全面考虑事物属性的多样性"}],"answer":["C"],"analysis":"粉笔太短，粉笔头浪费多；太长，使用不便且容易折断，断一次又多浪费一个粉笔头。这说明“多长最合适”是一个把握度的问题。所谓优选问题，从辩证法看就是要坚持适度原则，把事物的量控制在度的范围内，使质与量达到最佳统一。A项注重量的积累、B项保持物质的稳定性、D项全面考虑事物属性的多样性都没有抓住“最合适”这一度的要求。故选 C。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 2011年第1题"},{"id":"ky-029","bank":"kaoyan","bankName":"考研政治真题精选","num":29,"type":"single","stem":"有这样一道数学题：“90%×90%×90%×90%×90%=？”其答案是约59%，每个环节都打点折扣，得出的成绩就是不及格。这里蕴含的辩证法道理是（）","options":[{"key":"A","text":"肯定中包含否定"},{"key":"B","text":"量变引起质变"},{"key":"C","text":"必然性通过偶然性开辟道路"},{"key":"D","text":"可能和现实是相互转化的"}],"answer":["B"],"analysis":"90%连乘五次，结果降到约59%——每个环节都打一点折扣，量的微小减少不断累积，最终使整体成绩由“优”变为“不及格”，体现了量变引起质变的道理。常见的表述是：一项环环相扣的连续不断的工作，如果每个环节都打点折扣，最终得出的成绩就是不及格。A项肯定中包含否定、C项必然性通过偶然性开辟道路、D项可能与现实相互转化都与题意无关。故选 B。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 2012年第2题"},{"id":"ky-030","bank":"kaoyan","bankName":"考研政治真题精选","num":30,"type":"multi","stem":"形而上学否定观主张（）","options":[{"key":"A","text":"事物的自我否定"},{"key":"B","text":"外在力量对事物存在性的消灭"},{"key":"C","text":"包含肯定的否定"},{"key":"D","text":"主观、任意的否定"}],"answer":["B","D"],"analysis":"形而上学否定观的根本错误是否认事物内部的否定因素，把否定看作纯粹由外力强加于事物的消灭（B），看作主观的、任意的否定（D），其公式是“是就是，不是就不是，除此之外都是鬼话”，要么肯定一切，要么否定一切。A项事物的自我否定、C项包含肯定的否定都是辩证否定观的内容，与形而上学否定观相对立。故选 BD。","tags":["一、马克思主义哲学","三大规律"],"part":"一、马克思主义哲学","section":"三大规律","subsection":"","origin":"考研真题 · 1999年理科多选第17题"},{"id":"ky-031","bank":"kaoyan","bankName":"考研政治真题精选","num":31,"type":"single","stem":"“橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”橘逾淮为枳说明了（）","options":[{"key":"A","text":"事物的发展变化以时间地点和条件为转移"},{"key":"B","text":"事物的普遍联系是通过中介来实现的"},{"key":"C","text":"任何实体事物都是普遍联系之网上的一个网结"},{"key":"D","text":"事物的变化和发展是一个过程"}],"answer":["A"],"analysis":"同第21题。“橘生淮南则为橘，生于淮北则为枳”说明水土等条件的变化引起事物性质的变化，即事物的发展变化以时间、地点和条件为转移，联系具有条件性。B、C、D三项表述虽正确，但都没有点出条件变化导致事物性质改变这一关键。故选 A。\n\n> **说明：** 本题与第21题重复，原文档在“三大规律”和“联系和发展”两节中均收录。","tags":["一、马克思主义哲学","联系和发展"],"part":"一、马克思主义哲学","section":"联系和发展","subsection":"","origin":"考研真题 · 2019年第2题"},{"id":"ky-032","bank":"kaoyan","bankName":"考研政治真题精选","num":32,"type":"multi","stem":"据媒体报道，美国哥伦比亚大学的社会学家利用互联网技术做了一次实验，证明只要通过“电子邮件的6次信息接力”，一个人就可以同世界上任何一个陌生人联系上。这表明（）","options":[{"key":"A","text":"世界是相互联系的统一整体"},{"key":"B","text":"事物之间的联系都是人为的"},{"key":"C","text":"世界的普遍联系是通过“中介”实现的"},{"key":"D","text":"信息是世界普遍联系的基础"}],"answer":["A","C"],"analysis":"“电子邮件的6次信息接力”就能联系上世界任何陌生人，说明世界是相互联系的统一整体（A），而世界的普遍联系是通过“中介”实现的（C），这里的中介就是互联网这一技术手段。B项错误，事物的联系是客观的，不都是人为的；D项错误，信息不是世界普遍联系的基础，世界普遍联系的客观基础在于世界的物质性。故选 AC。","tags":["一、马克思主义哲学","联系和发展"],"part":"一、马克思主义哲学","section":"联系和发展","subsection":"","origin":"考研真题 · 2005年第16题"},{"id":"ky-033","bank":"kaoyan","bankName":"考研政治真题精选","num":33,"type":"multi","stem":"“沉舟侧畔千帆过，病树前头万木春。”辩证法认为发展的实质是新事物的产生和旧事物的灭亡。新生事物必然取代旧事物，从根本上说，是因为（）","options":[{"key":"A","text":"新生事物产生于旧事物之后，是新出现的事物"},{"key":"B","text":"新生事物具有新的结构和功能，能适应已经变化了的环境和条件"},{"key":"C","text":"新生事物是对旧事物的扬弃，并添加了旧事物所不能容纳的新内容"},{"key":"D","text":"在社会历史领域内，新生事物符合广大人民群众的根本利益和要求"}],"answer":["B","C","D"],"analysis":"新事物必然取代旧事物，从根本上说是因为：新事物具有新的结构和功能，能适应已经变化了的环境和条件（B）；新事物是对旧事物的扬弃，抛弃了旧事物中消极的、过时的东西，保留了其中积极的、合理的因素，并添加了旧事物所不能容纳的新内容（C）；在社会历史领域，新事物符合广大人民群众的根本利益和要求（D）。A项错误，新事物是指符合事物发展规律、具有强大生命力的事物，而不是泛指“新出现的事物”，以时间先后判断新旧是错误的是非标准。故选 BCD。","tags":["一、马克思主义哲学","联系和发展"],"part":"一、马克思主义哲学","section":"联系和发展","subsection":"","origin":"考研真题 · 2012年第17题"},{"id":"ky-034","bank":"kaoyan","bankName":"考研政治真题精选","num":34,"type":"single","stem":"唯物辩证法的因果联系是指（）","options":[{"key":"A","text":"一切前后相继的现象之间的联系"},{"key":"B","text":"一切同时并存的现象之间的联系"},{"key":"C","text":"引起和被引起的现象之间的联系"},{"key":"D","text":"反映和被反映的现象之间的联系"}],"answer":["C"],"analysis":"唯物辩证法所讲的因果联系，是引起与被引起的关系。原因和结果是揭示事物之间先后相继、彼此制约关系的一对范畴。A项把因果联系等同于时间上的前后相继，犯了“在此之后，因而因此之故”的逻辑错误；B项同时并存的现象之间不存在引起与被引起的关系；D项反映与被反映是认识论中的关系。故选 C。","tags":["一、马克思主义哲学","联系和发展"],"part":"一、马克思主义哲学","section":"联系和发展","subsection":"","origin":"考研真题 · 1992年文科第8题"},{"id":"ky-035","bank":"kaoyan","bankName":"考研政治真题精选","num":35,"type":"single","stem":"辩证唯物主义认为事物发展的规律是（）","options":[{"key":"A","text":"思维对事物本质的概念和反映"},{"key":"B","text":"用来整理感性材料的思维形式"},{"key":"C","text":"事物内在的本质的稳固的联系"},{"key":"D","text":"事物联系和发展的基本环节"}],"answer":["C"],"analysis":"辩证唯物主义认为，规律是事物运动发展过程中本身固有的、本质的、必然的、稳定的联系。A项把规律说成思维对事物本质的概念和反映、B项把规律说成用来整理感性材料的思维形式，都把规律归结为思维形式，属于唯心主义规律观；D项“事物联系和发展的基本环节”指的是原因与结果、必然与偶然、可能与现实等范畴，不是规律的定义。故选 C。","tags":["一、马克思主义哲学","客观规律性和主观能动性"],"part":"一、马克思主义哲学","section":"客观规律性和主观能动性","subsection":"","origin":"考研真题 · 1996年理科第2题"},{"id":"ky-036","bank":"kaoyan","bankName":"考研政治真题精选","num":36,"type":"single","stem":"俄国早期马克思主义理论家普列汉诺夫说，绝不会有人去组织一个“月食党”以促进或阻止月食的到来，但要进行社会革命就必须组织革命党，这是因为社会规律与自然规律有所不同，它是（）","options":[{"key":"A","text":"不具有重复性的客观规律"},{"key":"B","text":"由多数人的意志决定的"},{"key":"C","text":"通过人的有意识的活动实现的"},{"key":"D","text":"比自然规律更易于认识的规律"}],"answer":["C"],"analysis":"社会规律与自然规律都是客观的，但二者起作用的方式不同：自然规律是作为一种盲目的、无意识的力量起作用的，而社会规律必须通过人有意识、有目的的活动才能实现。这正是“月食党”不可能组织起来、而革命党必须组织的原因。A项错误，社会规律在同类社会条件下同样具有重复性；B项否认了社会规律的客观性；D项“比自然规律更易于认识”不能成立。故选 C。","tags":["一、马克思主义哲学","客观规律性和主观能动性"],"part":"一、马克思主义哲学","section":"客观规律性和主观能动性","subsection":"","origin":"考研真题 · 2014年第2题"},{"id":"ky-037","bank":"kaoyan","bankName":"考研政治真题精选","num":37,"type":"single","stem":"某地区进入供暖季后常常出现雾霾，而一旦出现大风天气或等到春暖花开后，雾霾就会散去或减少。从该地区较长时间的数据变化看，经过人们努力治霾，污染物排放总量在持续走低；但在某些时段，环境空气质量污染指数会迅速攀升，甚至“爆表”。这种看似“矛盾”的现象凸显了大气污染防治的一个特点：天帮忙很重要，但人努力才是根本。“人努力”与“天帮忙”之间的关系对我们正确处理主观能动性和客观规律性之间辩证关系的启示是（）","options":[{"key":"A","text":"尚未认识的外在自然规律对人的实践活动起着至关重要的作用"},{"key":"B","text":"人类有意识的思想活动是掌握客观规律的根本前提"},{"key":"C","text":"认识活动是客观规律性与主观能动性相统一的基础"},{"key":"D","
